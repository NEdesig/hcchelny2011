<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — ХК Челны 2011</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050b22;
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    margin-top: 30px;
}

.card {
    background: #0d1738;
    border: 1px solid #26345f;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    border-radius: 8px;
    border: 1px solid #394875;
    background: #070f2b;
    color: white;
    font-size: 15px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 15px;
    cursor: pointer;
    font-weight: bold;
    margin: 4px;
}

.primary {
    background: #ffcd00;
    color: #07102c;
}

.secondary {
    background: #26345f;
    color: white;
}

.danger {
    background: #d63c3c;
    color: white;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 20px;
}

.tab {
    background: #111d43;
    color: white;
}

.tab.active {
    background: #ffcd00;
    color: #07102c;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.item {
    background: #111d43;
    border-radius: 10px;
    padding: 14px;
    margin: 10px 0;
}

.item strong {
    display: block;
    margin-bottom: 6px;
}

.small {
    color: #aab5d5;
    font-size: 14px;
}

.hidden {
    display: none;
}

#message {
    text-align: center;
    margin: 10px 0;
    font-weight: bold;
}

.login {
    max-width: 420px;
    margin: 80px auto;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    border-bottom: 1px solid #29365d;
    padding: 9px;
    text-align: center;
}

th {
    background: #16234c;
}

@media(max-width:600px) {
    .tabs {
        grid-template-columns: repeat(2, 1fr);
    }

    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login container">

    <div class="card">

        <h1>🏒 ХК Челны 2011</h1>

        <h2>Вход в админ-панель</h2>

        <input id="email" type="email" placeholder="Email">

        <input id="password" type="password" placeholder="Пароль">

        <button class="primary" onclick="login()">
            Войти
        </button>

        <div id="loginMessage"></div>

    </div>

</div>


<!-- ADMIN -->

<div id="adminScreen" class="container hidden">

    <h1>⚙️ Админ-панель</h1>

    <button class="danger" onclick="logout()">
        Выйти
    </button>

    <div id="message"></div>


    <!-- TABS -->

    <div class="tabs">

        <button class="tab active" onclick="openTab('players', this)">
            👥 Состав
        </button>

        <button class="tab" onclick="openTab('news', this)">
            📰 Новости
        </button>

        <button class="tab" onclick="openTab('matches', this)">
            🏒 Матчи
        </button>

        <button class="tab" onclick="openTab('standings', this)">
            📊 Таблица
        </button>

    </div>


    <!-- PLAYERS -->

    <div id="players" class="section active">

        <div class="card">

            <h2>👥 Добавить игрока</h2>

            <input id="playerNumber" type="number" placeholder="Номер">

            <input id="playerName" placeholder="ФИО">

            <select id="playerPosition">
                <option value="Вратарь">Вратарь</option>
                <option value="Защитник">Защитник</option>
                <option value="Нападающий">Нападающий</option>
            </select>

            <button class="primary" onclick="addPlayer()">
                Добавить игрока
            </button>

        </div>

        <div class="card">

            <h2>Состав</h2>

            <div id="playersList"></div>

        </div>

    </div>


    <!-- NEWS -->

    <div id="news" class="section">

        <div class="card">

            <h2 id="newsFormTitle">📰 Добавить новость</h2>

            <input id="newsTitle" placeholder="Заголовок">

            <textarea id="newsText"
                placeholder="Текст новости"></textarea>

            <input id="newsImage"
                placeholder="Ссылка на изображение">

            <button class="primary" onclick="saveNews()">
                Сохранить новость
            </button>

            <button class="secondary hidden"
                    id="cancelNews"
                    onclick="cancelNewsEdit()">
                Отмена
            </button>

        </div>

        <div class="card">

            <h2>Новости</h2>

            <div id="newsList"></div>

        </div>

    </div>


    <!-- MATCHES -->

    <div id="matches" class="section">

        <div class="card">

            <h2 id="matchFormTitle">🏒 Добавить матч</h2>

            <input id="matchDate" type="date">

            <input id="matchTime"
                   type="text"
                   placeholder="Время, например 18:00">

            <input id="matchOpponent"
                   placeholder="Соперник">

            <select id="matchHome">

                <option value="true">
                    🏠 Домашний матч
                </option>

                <option value="false">
                    ✈️ Выездной матч
                </option>

            </select>

            <input id="matchScore"
                   placeholder="Счёт, например 5:2">

            <select id="matchStatus">

                <option value="Запланирован">
                    Запланирован
                </option>

                <option value="Завершен">
                    Завершен
                </option>

                <option value="Отменен">
                    Отменен
                </option>

            </select>

            <button class="primary" onclick="saveMatch()">
                Сохранить матч
            </button>

            <button class="secondary hidden"
                    id="cancelMatch"
                    onclick="cancelMatchEdit()">
                Отмена
            </button>

        </div>


        <div class="card">

            <h2>Матчи</h2>

            <div id="matchesList"></div>

        </div>

    </div>


    <!-- STANDINGS -->

    <div id="standings" class="section">

        <div class="card">

            <h2 id="standingFormTitle">
                📊 Добавить команду
            </h2>

            <input id="standingPosition"
                   type="number"
                   placeholder="Место">

            <input id="standingTeam"
                   placeholder="Команда">

            <input id="standingGames"
                   type="number"
                   placeholder="Игр">

            <input id="standingWins"
                   type="number"
                   placeholder="Побед">

            <input id="standingOvertimeWins"
                   type="number"
                   placeholder="Побед в ОТ">

            <input id="standingLosses"
                   type="number"
                   placeholder="Поражений">

            <input id="standingOvertimeLosses"
                   type="number"
                   placeholder="Поражений в ОТ">

            <input id="standingGF"
                   type="number"
                   placeholder="Забито">

            <input id="standingGA"
                   type="number"
                   placeholder="Пропущено">

            <input id="standingPoints"
                   type="number"
                   placeholder="Очки">

            <button class="primary"
                    onclick="saveStanding()">
                Сохранить
            </button>

            <button class="secondary hidden"
                    id="cancelStanding"
                    onclick="cancelStandingEdit()">
                Отмена
            </button>

        </div>


        <div class="card">

            <h2>Турнирная таблица</h2>

            <div id="standingsList"></div>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://jxlbojosxaaqnyuzohnw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_wNNvPktjjKpz3csoDMo3JA_4duyLAzL";

let accessToken = null;

let editingNewsId = null;
let editingMatchId = null;
let editingStandingId = null;


/* =========================
   HELPERS
========================= */

function headers() {

    return {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken,
        "Content-Type": "application/json"
    };

}


function publicHeaders() {

    return {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
    };

}


function showMessage(text) {

    document.getElementById("message").textContent = text;

    setTimeout(() => {

        document.getElementById("message").textContent = "";

    }, 3000);

}


/* =========================
   LOGIN
========================= */

async function login() {

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_KEY,
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })
        }
    );


    const data = await response.json();


    if (!response.ok) {

        document.getElementById("loginMessage").textContent =
            data.msg ||
            data.error_description ||
            "Ошибка входа";

        return;
    }


    accessToken = data.access_token;


    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("adminScreen")
        .classList.remove("hidden");


    loadAll();

}


/* =========================
   LOGOUT
========================= */

function logout() {

    accessToken = null;

    location.reload();

}


/* =========================
   TABS
========================= */

function openTab(tab, button) {

    document
        .querySelectorAll(".section")
        .forEach(el =>
            el.classList.remove("active")
        );


    document
        .querySelectorAll(".tab")
        .forEach(el =>
            el.classList.remove("active")
        );


    document
        .getElementById(tab)
        .classList.add("active");


    button.classList.add("active");

}


/* =========================
   LOAD ALL
========================= */

function loadAll() {

    loadPlayers();
    loadNews();
    loadMatches();
    loadStandings();

}


/* =========================
   PLAYERS
========================= */

async function loadPlayers() {

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/players?select=*&order=number.asc",
        {
            headers: publicHeaders()
        }
    );


    const players = await response.json();

    const list =
        document.getElementById("playersList");

    list.innerHTML = "";


    players.forEach(player => {

        const div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `
            <strong>
                #${player.number} ${player.name}
            </strong>

            <div class="small">
                ${player.position}
            </div>

            <button class="danger"
                    onclick="deletePlayer(${player.id})">
                Удалить
            </button>
        `;

        list.appendChild(div);

    });

}


async function addPlayer() {

    const number =
        document.getElementById("playerNumber").value;

    const name =
        document.getElementById("playerName").value;

    const position =
        document.getElementById("playerPosition").value;


    if (!number || !name) {

        alert("Заполни номер и имя");

        return;
    }


    const response = await fetch(
        SUPABASE_URL + "/rest/v1/players",
        {
            method: "POST",

            headers: {
                ...headers(),
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                number: Number(number),
                name: name,
                position: position
            })
        }
    );


    if (!response.ok) {

        alert(await response.text());

        return;
    }


    document.getElementById("playerNumber").value = "";
    document.getElementById("playerName").value = "";

    showMessage("Игрок добавлен");

    loadPlayers();

}


async function deletePlayer(id) {

    if (!confirm("Удалить игрока?")) return;


    await fetch(
        SUPABASE_URL +
        "/rest/v1/players?id=eq." + id,
        {
            method: "DELETE",
            headers: headers()
        }
    );


    loadPlayers();

}


/* =========================
   NEWS
========================= */

async function loadNews() {

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/news?select=*&order=created_at.desc",
        {
            headers: publicHeaders()
        }
    );


    const news = await response.json();

    const list =
        document.getElementById("newsList");

    list.innerHTML = "";


    news.forEach(item => {

        const div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `

            <strong>${escapeHtml(item.title)}</strong>

            <div class="small">
                ${escapeHtml(item.text)}
            </div>

            ${
                item.image
                ?
                `<div class="small">
                    🖼 ${escapeHtml(item.image)}
                </div>`
                :
                ""
            }

            <button class="primary"
                    onclick="editNews(${item.id})">
                Изменить
            </button>

            <button class="danger"
                    onclick="deleteNews(${item.id})">
                Удалить
            </button>

        `;

        list.appendChild(div);

    });

}


async function saveNews() {

    const title =
        document.getElementById("newsTitle").value;

    const text =
        document.getElementById("newsText").value;

    const image =
        document.getElementById("newsImage").value;


    if (!title || !text) {

        alert("Заполни заголовок и текст");

        return;
    }


    const body = {
        title: title,
        text: text,
        image: image || null
    };


    let response;


    if (editingNewsId) {

        response = await fetch(
            SUPABASE_URL +
            "/rest/v1/news?id=eq." +
            editingNewsId,
            {
                method: "PATCH",
                headers: headers(),
                body: JSON.stringify(body)
            }
        );

    } else {

        response = await fetch(
            SUPABASE_URL + "/rest/v1/news",
            {
                method: "POST",
                headers: headers(),
                body: JSON.stringify(body)
            }
        );

    }


    if (!response.ok) {

        alert(await response.text());

        return;
    }


    cancelNewsEdit();

    showMessage("Новость сохранена");

    loadNews();

}


async function editNews(id) {

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/news?id=eq." +
        id +
        "&select=*",
        {
            headers: publicHeaders()
        }
    );


    const data = await response.json();

    if (!data.length) return;


    const item = data[0];

    editingNewsId = id;


    document.getElementById("newsTitle").value =
        item.title;

    document.getElementById("newsText").value =
        item.text;

    document.getElementById("newsImage").value =
        item.image || "";


    document.getElementById("newsFormTitle")
        .textContent =
        "📰 Редактирование новости";


    document.getElementById("cancelNews")
        .classList.remove("hidden");


    openSectionDirect("news");

}


async function deleteNews(id) {

    if (!confirm("Удалить новость?")) return;


    await fetch(
        SUPABASE_URL +
        "/rest/v1/news?id=eq." + id,
        {
            method: "DELETE",
            headers: headers()
        }
    );


    showMessage("Новость удалена");

    loadNews();

}


function cancelNewsEdit() {

    editingNewsId = null;

    document.getElementById("newsTitle").value = "";
    document.getElementById("newsText").value = "";
    document.getElementById("newsImage").value = "";

    document.getElementById("newsFormTitle")
        .textContent =
        "📰 Добавить новость";

    document.getElementById("cancelNews")
        .classList.add("hidden");

}


/* =========================
   MATCHES
========================= */

async function loadMatches() {

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/matches?select=*&order=date.asc",
        {
            headers: publicHeaders()
        }
    );


    const matches = await response.json();

    const list =
        document.getElementById("matchesList");

    list.innerHTML = "";


    matches.forEach(match => {

        const div = document.createElement("div");

        div.className = "item";

        div.innerHTML = `

            <strong>
                ${formatDate(match.date)}
                ${match.time || ""}
            </strong>

            <div>
                ${match.home ? "🏠" : "✈️"}
                ХК Челны 2011 —
                ${escapeHtml(match.opponent)}
            </div>

            <div class="small">
                Счёт: ${match.score || "—"}
            </div>

            <div class="small">
                Статус: ${match.status || "—"}
            </div>

            <button class="primary"
                    onclick="editMatch(${match.id})">
                Изменить
            </button>

            <button class="danger"
                    onclick="deleteMatch(${match.id})">
                Удалить
            </button>

        `;

        list.appendChild(div);

    });

}


async function saveMatch() {

    const date =
        document.getElementById("matchDate").value;

    const time =
        document.getElementById("matchTime").value;

    const opponent =
        document.getElementById("matchOpponent").value;

    const home =
        document.getElementById("matchHome").value === "true";

    const score =
        document.getElementById("matchScore").value;

    const status =
        document.getElementById("matchStatus").value;


    if (!date || !opponent) {

        alert("Укажи дату и соперника");

        return;
    }


    const body = {
        date,
        time,
        opponent,
        home,
        score,
        status
    };


    let response;


    if (editingMatchId) {

        response = await fetch(
            SUPABASE_URL +
            "/rest/v1/matches?id=eq." +
            editingMatchId,
            {
                method: "PATCH",
                headers: headers(),
                body: JSON.stringify(body)
            }
        );

    } else {

        response = await fetch(
            SUPABASE_URL + "/rest/v1/matches",
            {
                method: "POST",
                headers: headers(),
                body: JSON.stringify(body)
            }
        );

    }


    if (!response.ok) {

        alert(await response.text());

        return;
    }


    cancelMatchEdit();

    showMessage("Матч сохранён");

    loadMatches();

}


async function editMatch(id) {

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/matches?id=eq." +
        id +
        "&select=*",
        {
            headers: publicHeaders()
        }
    );


    const data = await response.json();

    if (!data.length) return;


    const match = data[0];

    editingMatchId = id;


    document.getElementById("matchDate").value =
        match.date;

    document.getElementById("matchTime").value =
        match.time || "";

    document.getElementById("matchOpponent").value =
        match.opponent;

    document.getElementById("matchHome").value =
        String(match.home);

    document.getElementById("matchScore").value =
        match.score || "";

    document.getElementById("matchStatus").value =
        match.status || "Запланирован";


    document.getElementById("matchFormTitle")
        .textContent =
        "🏒 Редактирование матча";


    document.getElementById("cancelMatch")
        .classList.remove("hidden");


    openSectionDirect("matches");

}


async function deleteMatch(id) {

    if (!confirm("Удалить матч?")) return;


    await fetch(
        SUPABASE_URL +
        "/rest/v1/matches?id=eq." + id,
        {
            method: "DELETE",
            headers: headers()
        }
    );


    showMessage("Матч удалён");

    loadMatches();

}


function cancelMatchEdit() {

    editingMatchId = null;

    document.getElementById("matchDate").value = "";
    document.getElementById("matchTime").value = "";
    document.getElementById("matchOpponent").value = "";
    document.getElementById("matchScore").value = "";

    document.getElementById("matchStatus").value =
        "Запланирован";

    document.getElementById("matchHome").value =
        "true";


    document.getElementById("matchFormTitle")
        .textContent =
        "🏒 Добавить матч";


    document.getElementById("cancelMatch")
        .classList.add("hidden");

}


/* =========================
   STANDINGS
========================= */

async function loadStandings() {

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/standings?select=*&order=position.asc",
        {
            headers: publicHeaders()
        }
    );


    const standings = await response.json();

    const list =
        document.getElementById("standingsList");

    list.innerHTML = "";


    const wrapper =
        document.createElement("div");

    wrapper.className = "table-wrapper";


    const table =
        document.createElement("table");


    table.innerHTML = `
        <thead>
            <tr>
                <th>№</th>
                <th>Команда</th>
                <th>И</th>
                <th>В</th>
                <th>ВОТ</th>
                <th>П</th>
                <th>ПОТ</th>
                <th>ЗШ</th>
                <th>ПШ</th>
                <th>О</th>
                <th></th>
            </tr>
        </thead>
        <tbody></tbody>
    `;


    const tbody =
        table.querySelector("tbody");


    standings.forEach(team => {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>${team.position ?? ""}</td>

            <td>
                ${escapeHtml(team.team)}
            </td>

            <td>${team.games ?? 0}</td>

            <td>${team.wins ?? 0}</td>

            <td>${team.overtime_wins ?? 0}</td>

            <td>${team.losses ?? 0}</td>

            <td>${team.overtime_losses ?? 0}</td>

            <td>${team.goals_for ?? 0}</td>

            <td>${team.goals_against ?? 0}</td>

            <td><strong>${team.points ?? 0}</strong></td>

            <td>

                <button class="primary"
                        onclick="editStanding(${team.id})">
                    ✏️
                </button>

                <button class="danger"
                        onclick="deleteStanding(${team.id})">
                    🗑
                </button>

            </td>
        `;


        tbody.appendChild(tr);

    });


    wrapper.appendChild(table);

    list.appendChild(wrapper);

}


async function saveStanding() {

    const body = {

        position:
            Number(document.getElementById(
                "standingPosition").value),

        team:
            document.getElementById(
                "standingTeam").value,

        games:
            Number(document.getElementById(
                "standingGames").value || 0),

        wins:
            Number(document.getElementById(
                "standingWins").value || 0),

        overtime_wins:
            Number(document.getElementById(
                "standingOvertimeWins").value || 0),

        losses:
            Number(document.getElementById(
                "standingLosses").value || 0),

        overtime_losses:
            Number(document.getElementById(
                "standingOvertimeLosses").value || 0),

        goals_for:
            Number(document.getElementById(
                "standingGF").value || 0),

        goals_against:
            Number(document.getElementById(
                "standingGA").value || 0),

        points:
            Number(document.getElementById(
                "standingPoints").value || 0)

    };


    if (!body.team) {

        alert("Укажи название команды");

        return;
    }


    let response;


    if (editingStandingId) {

        response = await fetch(
            SUPABASE_URL +
            "/rest/v1/standings?id=eq." +
            editingStandingId,
            {
                method: "PATCH",
                headers: headers(),
                body: JSON.stringify(body)
            }
        );

    } else {

        response = await fetch(
            SUPABASE_URL + "/rest/v1/standings",
            {
                method: "POST",
                headers: headers(),
                body: JSON.stringify(body)
            }
        );

    }


    if (!response.ok) {

        alert(await response.text());

        return;
    }


    cancelStandingEdit();

    showMessage("Таблица сохранена");

    loadStandings();

}


async function editStanding(id) {

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/standings?id=eq." +
        id +
        "&select=*",
        {
            headers: publicHeaders()
        }
    );


    const data = await response.json();

    if (!data.length) return;


    const team = data[0];

    editingStandingId = id;


    document.getElementById("standingPosition").value =
        team.position ?? "";

    document.getElementById("standingTeam").value =
        team.team ?? "";

    document.getElementById("standingGames").value =
        team.games ?? 0;

    document.getElementById("standingWins").value =
        team.wins ?? 0;

    document.getElementById("standingOvertimeWins").value =
        team.overtime_wins ?? 0;

    document.getElementById("standingLosses").value =
        team.losses ?? 0;

    document.getElementById("standingOvertimeLosses").value =
        team.overtime_losses ?? 0;

    document.getElementById("standingGF").value =
        team.goals_for ?? 0;

    document.getElementById("standingGA").value =
        team.goals_against ?? 0;

    document.getElementById("standingPoints").value =
        team.points ?? 0;


    document.getElementById("standingFormTitle")
        .textContent =
        "📊 Редактирование команды";


    document.getElementById("cancelStanding")
        .classList.remove("hidden");


    openSectionDirect("standings");

}


async function deleteStanding(id) {

    if (!confirm("Удалить команду из таблицы?"))
        return;


    await fetch(
        SUPABASE_URL +
        "/rest/v1/standings?id=eq." + id,
        {
            method: "DELETE",
            headers: headers()
        }
    );


    showMessage("Команда удалена");

    loadStandings();

}


function cancelStandingEdit() {

    editingStandingId = null;


    document.getElementById("standingPosition").value = "";
    document.getElementById("standingTeam").value = "";
    document.getElementById("standingGames").value = "";
    document.getElementById("standingWins").value = "";
    document.getElementById("standingOvertimeWins").value = "";
    document.getElementById("standingLosses").value = "";
    document.getElementById("standingOvertimeLosses").value = "";
    document.getElementById("standingGF").value = "";
    document.getElementById("standingGA").value = "";
    document.getElementById("standingPoints").value = "";


    document.getElementById("standingFormTitle")
        .textContent =
        "📊 Добавить команду";


    document.getElementById("cancelStanding")
        .classList.add("hidden");

}


/* =========================
   UTILITIES
========================= */

function formatDate(date) {

    if (!date) return "";

    const parts = date.split("-");

    return parts[2] + "." +
           parts[1] + "." +
           parts[0];

}


function escapeHtml(text) {

    if (text === null ||
        text === undefined) return "";

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function openSectionDirect(name) {

    document
        .querySelectorAll(".section")
        .forEach(el =>
            el.classList.remove("active")
        );

    document
        .getElementById(name)
        .classList.add("active");


    document
        .querySelectorAll(".tab")
        .forEach(el =>
            el.classList.remove("active")
        );

    const tabs = {
        players: 0,
        news: 1,
        matches: 2,
        standings: 3
    };

    document
        .querySelectorAll(".tab")[tabs[name]]
        .classList.add("active");

}
