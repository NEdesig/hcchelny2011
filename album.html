
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000056">
  <title>Фотоальбом — ХК Челны 2011</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .album-page {
      width: min(1200px, calc(100% - 32px));
      margin: 32px auto 60px;
    }

    .album-back {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--primary, #000056);
      text-decoration: none;
      font-weight: 700;
    }

    .album-page-title {
      margin: 0 0 8px;
      color: var(--primary, #000056);
      font-size: clamp(27px, 5vw, 42px);
      line-height: 1.15;
    }

    .album-page-date {
      margin-bottom: 28px;
      color: #7a8192;
      font-size: 14px;
    }

    .album-description {
      margin-bottom: 24px;
      color: #596174;
    }

    .album-photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .album-photo-button {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background: #edf0f5;
      cursor: pointer;
    }

    .album-photo-button img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .25s ease;
    }

    .album-photo-button:hover img {
      transform: scale(1.04);
    }

    .album-photo-button:focus-visible {
      outline: 3px solid var(--gold, #ffcd00);
      outline-offset: 3px;
    }

    .album-state {
      padding: 50px 10px;
      text-align: center;
      color: #737b8d;
    }

    .album-lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 54px 64px;
      background: rgba(0, 0, 15, .96);
    }

    .album-lightbox.open {
      display: flex;
    }

    .album-lightbox-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
    }

    .album-lightbox-close,
    .album-lightbox-prev,
    .album-lightbox-next {
      position: absolute;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .13);
      color: white;
      cursor: pointer;
    }

    .album-lightbox-close {
      top: 16px;
      right: 18px;
      width: 44px;
      height: 44px;
      font-size: 30px;
    }

    .album-lightbox-prev,
    .album-lightbox-next {
      top: 50%;
      width: 44px;
      height: 44px;
      font-size: 27px;
      transform: translateY(-50%);
    }

    .album-lightbox-prev { left: 12px; }
    .album-lightbox-next { right: 12px; }

    .album-lightbox-counter {
      position: absolute;
      bottom: 16px;
      left: 50%;
      color: white;
      font-size: 14px;
      transform: translateX(-50%);
    }

    body.lightbox-open {
      overflow: hidden;
    }

    @media (max-width: 750px) {
      .album-photo-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .album-lightbox {
        padding: 55px 12px;
      }

      .album-lightbox-prev { left: 5px; }
      .album-lightbox-next { right: 5px; }
    }

    @media (max-width: 360px) {
      .album-photo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="header-logo-link" href="index.html" aria-label="На главную">
        <img id="teamLogo" class="header-logo" src="" alt="Логотип команды">
      </a>

      <a class="header-center" href="index.html">
        <span id="teamName" class="header-team-name">Челны 2011</span>
        <span id="teamSubtitle" class="header-subtitle">хоккейный клуб</span>
      </a>

      <button id="menuButton" class="header-menu" type="button"
        aria-label="Открыть меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <nav id="mobileMenu" class="mobile-menu" aria-hidden="true">
    <div class="mobile-menu-panel">
      <button id="menuClose" class="menu-close" type="button"
        aria-label="Закрыть меню">×</button>
      <a href="index.html#news">Новости</a>
      <a href="index.html#matchday">Матчи</a>
      <a href="index.html#competition">Турнирная таблица</a>
      <a href="index.html#stats">Статистика</a>
      <a href="index.html#leaders">Лидеры команды</a>
      <a href="index.html#albums">Фотоальбомы</a>
    </div>
  </nav>

  <main class="album-page">
    <a class="album-back" href="index.html#albums">← Все фотоальбомы</a>

    <div id="albumContent">
      <div class="album-state">Загрузка фотоальбома…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <img id="footerLogo" class="footer-logo" src="" alt="">
      <div>
        <div id="footerTeamName" class="footer-team-name">Челны 2011</div>
        <div id="footerCity" class="footer-city">Набережные Челны</div>
      </div>
      <div class="footer-copy">© <span id="footerYear"></span></div>
    </div>
  </footer>

  <div id="albumLightbox" class="album-lightbox"
    role="dialog" aria-modal="true" aria-label="Просмотр фотографии">
    <button id="lightboxClose" class="album-lightbox-close"
      type="button" aria-label="Закрыть">×</button>
    <button id="lightboxPrev" class="album-lightbox-prev"
      type="button" aria-label="Предыдущая фотография">‹</button>
    <img id="lightboxImage" class="album-lightbox-image" src="" alt="">
    <button id="lightboxNext" class="album-lightbox-next"
      type="button" aria-label="Следующая фотография">›</button>
    <div id="lightboxCounter" class="album-lightbox-counter"></div>
  </div>

  <script>
    document.getElementById("footerYear").textContent = new Date().getFullYear();

    const menuButton = document.getElementById("menuButton");
    const mobileMenu = document.getElementById("mobileMenu");
    const menuClose = document.getElementById("menuClose");

    function closeMenu() {
      mobileMenu?.classList.remove("open");
      mobileMenu?.setAttribute("aria-hidden", "true");
      menuButton?.setAttribute("aria-expanded", "false");
    }

    menuButton?.addEventListener("click", () => {
      const opened = mobileMenu.classList.toggle("open");
      mobileMenu.setAttribute("aria-hidden", String(!opened));
      menuButton.setAttribute("aria-expanded", String(opened));
    });

    menuClose?.addEventListener("click", closeMenu);
    mobileMenu?.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", closeMenu);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/album.js"></script>
</body>
</html>
