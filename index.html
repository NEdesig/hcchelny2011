<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#061a45"
    >

    <title>ХК Челны 2011</title>

    <link
        rel="stylesheet"
        href="css/style.css"

        <link rel="stylesheet" href="css/style.css">
    >
</head>

<body>

<!-- =========================================================
     ШАПКА
========================================================= -->

<header class="site-header">

    <div class="header-inner">

        <a
            href="#"
            class="club-brand"
        >

            <div
                class="club-logo"
                id="siteLogo"
            >
                Ч
            </div>

            <div class="club-title">

                <strong id="teamName">
                    Челны 2011
                </strong>

                <span id="teamSubtitle">
                    хоккейный клуб
                </span>

            </div>

        </a>


        <nav class="desktop-navigation">

            <button
                class="navigation-button"
                data-menu="club"
            >
                Клуб

                <span class="navigation-arrow">
                    ↓
                </span>
            </button>

            <button
                class="navigation-button"
                data-menu="matches"
            >
                Матчи

                <span class="navigation-arrow">
                    ↓
                </span>
            </button>

            <button
                class="navigation-button"
                data-menu="media"
            >
                Медиа

                <span class="navigation-arrow">
                    ↓
                </span>
            </button>

        </nav>


        <button
            class="mobile-menu-button"
            id="hamburger"
            aria-label="Открыть меню"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

</header>


<!-- =========================================================
     ВЫПАДАЮЩЕЕ МЕНЮ
========================================================= -->

<div
    class="dropdown-layer"
    id="dropdownLayer"
>

    <div
        class="dropdown-inner"
        id="dropdownInner"
    ></div>

</div>


<!-- =========================================================
     ОСНОВНОЙ САЙТ
========================================================= -->

<main>


    <!-- =====================================================
         НОВОСТИ
    ====================================================== -->

    <section class="news-section section-shell">

        <div class="section-header">

            <div>

                <span class="section-kicker">
                    ХК ЧЕЛНЫ 2011
                </span>

                <h2>
                    Новости
                </h2>

            </div>


            <div class="slider-arrows">

                <button
                    id="newsPrev"
                    aria-label="Предыдущая новость"
                >
                    ←
                </button>

                <button
                    id="newsNext"
                    aria-label="Следующая новость"
                >
                    →
                </button>

            </div>

        </div>


        <div
            class="news-slider"
            id="newsSlider"
        ></div>

    </section>


    <!-- =====================================================
         ИСТОРИИ
    ====================================================== -->

    <section class="stories-section section-shell">

        <div class="section-header">

            <div>

                <span class="section-kicker">
                    АКТУАЛЬНО
                </span>

                <h2>
                    Истории
                </h2>

            </div>

            <span class="section-description">
                24 часа
            </span>

        </div>


        <div
            class="stories-row"
            id="storyRow"
        ></div>

    </section>


    <!-- =====================================================
         ДЕНЬ МАТЧА
    ====================================================== -->

    <section class="matchday-section">

        <div class="matchday-inner section-shell">

            <span class="matchday-label">
                ДЕНЬ МАТЧА
            </span>


            <div
                class="matchday-date"
                id="matchdayDate"
            >
                СЕГОДНЯ
            </div>


            <div
                class="match-card"
                id="nextMatch"
            ></div>


            <a
                href="#matches"
                class="outline-button matchday-all"
            >
                Ко всем матчам
            </a>

        </div>

    </section>


    <!-- =====================================================
         СОРЕВНОВАНИЕ
    ====================================================== -->

    <section class="competition-section section-shell">

        <div class="competition-heading">

            <div>

                <span class="section-kicker">
                    ТУРНИР
                </span>

                <h2 id="competitionName">
                    Первенство ПФО. Группа Б2
                </h2>

            </div>

        </div>


        <!-- Последние три матча -->

        <div
            class="last-results"
            id="lastResults"
        ></div>


        <!-- Таблица -->

        <div class="standings-card">

            <div class="standings-title">
                Турнирная таблица
            </div>


            <div class="standings-head">

                <span>
                    Место
                </span>

                <span>
                    Команда
                </span>

                <span>
                    И
                </span>

                <span>
                    О
                </span>

            </div>


            <div
                id="standings"
                class="standings-list"
            ></div>

        </div>

    </section>


    <!-- =====================================================
         СТАТИСТИКА
    ====================================================== -->

    <section class="statistics-section section-shell">

        <div
            class="statistics-tabs"
            id="statsTabs"
        ></div>


        <div
            class="statistics-card"
            id="statsContent"
        ></div>

    </section>


    <!-- =====================================================
         ЛИДЕРЫ
    ====================================================== -->

    <section class="leaders-section section-shell">

        <div class="section-header">

            <div>

                <span class="section-kicker">
                    КОМАНДА
                </span>

                <h2>
                    Лидеры команды
                </h2>

            </div>


            <div class="slider-arrows">

                <button
                    id="leaderPrev"
                    aria-label="Предыдущий игрок"
                >
                    ←
                </button>

                <button
                    id="leaderNext"
                    aria-label="Следующий игрок"
                >
                    →
                </button>

            </div>

        </div>


        <div
            class="leader-card"
            id="leaderCard"
        ></div>

    </section>


    <!-- =====================================================
         ПОСЛЕДНИЕ ФОТО
    ====================================================== -->

    <section class="albums-section section-shell">

        <div class="section-header">

            <div>

                <span class="section-kicker">
                    МЕДИА
                </span>

                <h2 class="tall-heading">
                    ПОСЛЕДНИЕ ФОТО
                </h2>

            </div>


            <a
                href="#albums"
                class="all-link"
            >
                Все альбомы →
            </a>

        </div>


        <div
            class="albums-row"
            id="albumRow"
        ></div>

    </section>

</main>


<!-- =========================================================
     ПРОСМОТР ИСТОРИИ
========================================================= -->

<div
    class="story-viewer"
    id="storyViewer"
>

    <button
        class="story-close"
        id="storyClose"
    >
        ×
    </button>


    <img
        id="storyViewerImage"
        src=""
        alt=""
    >


    <div class="story-progress"></div>

</div>


<!-- =========================================================
     ОБЩЕЕ МОДАЛЬНОЕ ОКНО
========================================================= -->

<div
    class="modal"
    id="modal"
>

    <div
        class="modal-box"
        id="modalBox"
    ></div>

</div>


<!-- =========================================================
     НИЖНЯЯ ПАНЕЛЬ БЛИЖАЙШЕГО МАТЧА
========================================================= -->

<div
    class="bottom-match"
    id="bottomMatch"
></div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/app.js"></script>
    
</body>

</html>
