<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050b22">

    <meta
        name="description"
        content="ХК Челны 2011 — Набережные Челны"
    >

    <title>ХК Челны 2011</title>

    <!-- Основные стили -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer
    ></script>

    <!-- Конфигурация -->
    <script src="config.js" defer></script>

    <!-- Основная логика -->
    <script src="app.js" defer></script>
</head>

<body>

<div id="app">

    <!-- =====================================================
         ШАПКА
    ====================================================== -->

    <header class="site-header">

        <div class="header-left">

            <!-- Логотип -->
            <button
                class="header-logo-button"
                id="headerLogoButton"
                type="button"
                aria-label="Логотип команды"
            >
                <img
                    id="headerLogo"
                    class="header-logo"
                    src=""
                    alt="ХК Челны 2011"
                >
            </button>

            <!-- Название -->
            <div class="header-title-wrapper">

                <div
                    id="headerTitle"
                    class="header-title"
                >
                    ХК ЧЕЛНЫ 2011
                </div>

                <div
                    id="headerSubtitle"
                    class="header-subtitle"
                >
                    НАБЕРЕЖНЫЕ ЧЕЛНЫ
                </div>

            </div>

        </div>

        <!-- Кнопка админки -->
        <button
            id="headerSettingsButton"
            class="header-settings"
            type="button"
            aria-label="Настройки"
        >
            <span>⚙</span>
        </button>

    </header>


    <!-- =====================================================
         ОСНОВНОЙ КОНТЕНТ
    ====================================================== -->

    <main id="mainContent">

        <!-- Сюда JavaScript будет вставлять страницы -->

    </main>


    <!-- =====================================================
         НИЖНЯЯ НАВИГАЦИЯ
    ====================================================== -->

    <nav
        id="bottomNavigation"
        class="bottom-navigation"
        aria-label="Основная навигация"
    >

        <!-- Главная -->
        <button
            class="bottom-nav-item active"
            data-page="home"
            type="button"
        >
            <span class="bottom-nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M3 10.5 12 3l9 7.5"></path>
                    <path d="M5 9.5V21h14V9.5"></path>
                    <path d="M9 21v-6h6v6"></path>
                </svg>
            </span>

            <span class="bottom-nav-text">
                Главная
            </span>
        </button>


        <!-- Матчи -->
        <button
            class="bottom-nav-item"
            data-page="matches"
            type="button"
        >
            <span class="bottom-nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="17"
                        rx="3"
                    ></rect>

                    <path d="M7 2v4"></path>
                    <path d="M17 2v4"></path>
                    <path d="M3 9h18"></path>

                    <path d="M8 13h2"></path>
                    <path d="M14 13h2"></path>
                    <path d="M8 17h2"></path>
                    <path d="M14 17h2"></path>
                </svg>
            </span>

            <span class="bottom-nav-text">
                Матчи
            </span>
        </button>


        <!-- Состав -->
        <button
            class="bottom-nav-item"
            data-page="roster"
            type="button"
        >
            <span class="bottom-nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <circle
                        cx="12"
                        cy="8"
                        r="3.5"
                    ></circle>

                    <path
                        d="M5 21c.8-4.1 3.1-6 7-6s6.2 1.9 7 6"
                    ></path>
                </svg>
            </span>

            <span class="bottom-nav-text">
                Состав
            </span>
        </button>


        <!-- Медиа -->
        <button
            class="bottom-nav-item"
            data-page="media"
            type="button"
        >
            <span class="bottom-nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <rect
                        x="3"
                        y="4"
                        width="18"
                        height="16"
                        rx="3"
                    ></rect>

                    <circle
                        cx="8"
                        cy="9"
                        r="1.5"
                    ></circle>

                    <path
                        d="m4 17 5-5 3.5 3 2.5-2.5 5 5"
                    ></path>
                </svg>
            </span>

            <span class="bottom-nav-text">
                Медиа
            </span>
        </button>


        <!-- Товары -->
        <button
            class="bottom-nav-item"
            data-page="shop"
            type="button"
        >
            <span class="bottom-nav-icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M5 8h14l-1 13H6L5 8Z"></path>
                    <path d="M9 9V6a3 3 0 0 1 6 0v3"></path>
                </svg>
            </span>

            <span class="bottom-nav-text">
                Товары
            </span>
        </button>

    </nav>

</div>


<!-- =====================================================
     МОДАЛЬНОЕ ОКНО
====================================================== -->

<div
    id="modal"
    class="modal hidden"
    aria-hidden="true"
>

    <div
        id="modalBackdrop"
        class="modal-backdrop"
    ></div>

    <div
        id="modalContainer"
        class="modal-container"
        role="dialog"
        aria-modal="true"
    >

        <button
            id="modalClose"
            class="modal-close"
            type="button"
            aria-label="Закрыть"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path d="m6 6 12 12"></path>
                <path d="m18 6-12 12"></path>
            </svg>
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<!-- =====================================================
     УВЕДОМЛЕНИЯ
====================================================== -->

<div
    id="toast"
    class="toast"
    aria-live="polite"
>
</div>


<!-- =====================================================
     ЗАГРУЗЧИК
====================================================== -->

<div
    id="pageLoader"
    class="page-loader"
>

    <div class="loader-logo">

        <div class="loader-circle"></div>

        <span>
            ХЧ
        </span>

    </div>

    <div class="loader-text">
        ХК ЧЕЛНЫ 2011
    </div>

</div>


</body>
</html>
