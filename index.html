<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b22">
<meta name="description" content="ХК Челны 2011 — Набережные Челны">

<title>ХК Челны 2011</title>

<style>

/* =========================================================
   FONTS
   ========================================================= */

@font-face {
    font-family: "Stapel";
    src: url("fonts/Stapel-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: "Stapel";
    src: url("fonts/Stapel-Medium.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: "Stapel";
    src: url("fonts/Stapel-Bold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: "Stapel";
    src: url("fonts/Stapel-Black.woff2") format("woff2");
    font-weight: 900;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: "Stengazeta";
    src: url("fonts/Stengazeta.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: "Christopher";
    src: url("fonts/Christopher.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}


/* =========================================================
   COLORS
   ========================================================= */

:root {

    --primary: #000056;
    --yellow: #ffcd00;

    --bg: #050b22;
    --card: #0d1738;

    --white: #ffffff;
    --muted: #aab5d5;

    --border: #26345f;

    --radius: 18px;
    --shadow: 0 20px 60px rgba(0,0,0,.25);

    --max: 1180px;

    --font-main: "Stapel", Arial, sans-serif;
    --font-heading: "Stapel", Arial, sans-serif;
    --font-secondary: "Stengazeta", Arial, sans-serif;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(0,0,86,.65),
            transparent 42%
        ),
        var(--bg);

    color: var(--white);

    font-family: var(--font-main);

    min-height: 100vh;

    overflow-x: hidden;
}

img {
    max-width: 100%;
    display: block;
}

button,
a {
    font-family: inherit;
}

button {
    border: 0;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================================
   DYNAMIC FONTS
   ========================================================= */

h1,
h2,
h3,
.section-title,
.announcement-title,
.news-title,
.album-title,
.achievement-title,
.players-category-title {
    font-family: var(--font-heading);
}

.city-line,
.news-date,
.news-tag,
.section-link,
.nav-item,
.announcement-label,
.achievement-year,
.birthday-date,
.players-stat {
    font-family: var(--font-secondary);
}


/* =========================================================
   CONTAINER
   ========================================================= */

.container {

    width: min(
        calc(100% - 32px),
        var(--max)
    );

    margin: 0 auto;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
    padding-top: 24px;
}

.header-main {

    display: flex;

    align-items: center;

    gap: 15px;
}

.logo {

    width: 64px;
    height: 64px;

    object-fit: contain;

    flex-shrink: 0;
}

.city-line {

    margin-top: 18px;

    padding-top: 12px;

    border-top: 1px solid var(--border);

    color: var(--muted);

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;
}


/* =========================================================
   MAIN
   ========================================================= */

main {
    padding-bottom: 70px;
}

.section {

    margin-top: 48px;
}

.section-header {

    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 18px;
}

.section-title {

    font-size: clamp(27px, 7vw, 48px);

    line-height: .9;

    font-weight: 900;

    letter-spacing: -1.5px;

    text-transform: uppercase;
}

.section-title span {
    color: var(--yellow);
}

.section-link {

    color: var(--yellow);

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1px;

    text-transform: uppercase;

    white-space: nowrap;
}


/* =========================================================
   ANNOUNCEMENT
   ========================================================= */

.announcement {

    position: relative;

    min-height: 430px;

    border-radius: 25px;

    overflow: hidden;

    background: var(--card);

    border: 1px solid var(--border);

    box-shadow: var(--shadow);

    margin-top: 30px;
}

.announcement-image {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.announcement-overlay {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(5,11,34,.05) 20%,
            rgba(5,11,34,.4) 48%,
            rgba(5,11,34,.98) 100%
        );
}

.announcement-content {

    position: absolute;

    left: 24px;
    right: 24px;
    bottom: 24px;

    z-index: 2;
}

.announcement-label {

    display: inline-flex;

    padding: 7px 12px;

    border-radius: 50px;

    background: var(--yellow);

    color: var(--primary);

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1.5px;

    margin-bottom: 12px;
}

.announcement-title {

    font-size: clamp(30px, 8vw, 58px);

    line-height: .92;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: -1px;

    max-width: 800px;
}

.announcement-description {

    margin-top: 12px;

    max-width: 700px;

    color: rgba(255,255,255,.78);

    font-size: 14px;

    line-height: 1.55;
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty {

    padding: 40px 20px;

    border: 1px dashed var(--border);

    border-radius: var(--radius);

    text-align: center;

    color: var(--muted);

    background: rgba(13,23,56,.45);
}


/* =========================================================
   NEWS
   ========================================================= */

.news-grid {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 16px;
}

.news-card {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    overflow: hidden;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.news-card:hover {

    transform: translateY(-5px);

    border-color: rgba(255,205,0,.5);

    box-shadow: var(--shadow);
}

.news-image-wrap {

    position: relative;

    aspect-ratio: 16 / 10;

    overflow: hidden;

    background: var(--primary);
}

.news-image {

    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: transform .5s ease;
}

.news-card:hover .news-image {
    transform: scale(1.05);
}

.news-body {
    padding: 18px;
}

.news-date {

    color: var(--yellow);

    font-size: 10px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.news-title {

    margin-top: 8px;

    font-size: 20px;

    line-height: 1.05;

    font-weight: 800;

    text-transform: uppercase;
}

.news-description {

    margin-top: 9px;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.5;

    display: -webkit-box;

    -webkit-line-clamp: 3;

    -webkit-box-orient: vertical;

    overflow: hidden;
}

.news-tag {

    display: inline-flex;

    margin-top: 15px;

    color: var(--white);

    background: rgba(255,255,255,.08);

    border: 1px solid var(--border);

    border-radius: 30px;

    padding: 5px 9px;

    font-size: 9px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.more-button {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    min-height: 54px;

    margin-top: 18px;

    border-radius: 15px;

    background: var(--yellow);

    color: var(--primary);

    font-weight: 900;

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 1px;

    transition:
        transform .2s ease,
        opacity .2s ease;
}

.more-button:hover {
    transform: translateY(-2px);
}

.more-button:active {
    transform: scale(.98);
}


/* =========================================================
   PLAYERS
   ========================================================= */

.players-section {
    position: relative;
}

.players-accordion {
    display: grid;
    gap: 10px;
}

.players-category {
    background:
        linear-gradient(
            135deg,
            rgba(13,23,56,.98),
            rgba(9,18,48,.96)
        );

    border: 1px solid var(--border);

    border-radius: 17px;

    overflow: hidden;

    transition:
        border-color .3s ease,
        box-shadow .3s ease,
        transform .3s ease;
}

.players-category.open {
    border-color: rgba(255,205,0,.4);
    box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

.players-category-head {

    width: 100%;

    min-height: 67px;

    padding: 15px 17px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    background: transparent;

    color: var(--white);

    cursor: pointer;

    text-align: left;
}

.players-category-title {

    font-size: 18px;

    line-height: 1;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: -.3px;
}

.players-arrow {

    width: 31px;
    height: 31px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(255,255,255,.07);

    color: var(--yellow);

    font-size: 19px;

    transition:
        transform .35s ease,
        background .3s ease;
}

.players-category.open .players-arrow {
    transform: rotate(180deg);
    background: rgba(255,205,0,.12);
}

.players-category-body {

    display: grid;

    grid-template-rows: 0fr;

    opacity: 0;

    transition:
        grid-template-rows .45s cubic-bezier(.2,.7,.2,1),
        opacity .3s ease;
}

.players-category.open .players-category-body {

    grid-template-rows: 1fr;

    opacity: 1;
}

.players-category-inner {
    min-height: 0;
    overflow: hidden;
}

.players-list {

    padding: 0 12px 12px;

    display: grid;

    gap: 8px;
}

.player-top-card {

    position: relative;

    display: grid;

    grid-template-columns: 42px 58px minmax(0,1fr) auto;

    align-items: center;

    gap: 12px;

    min-height: 70px;

    padding: 8px 10px;

    border-radius: 13px;

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(255,255,255,.055);

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;
}

.player-top-card:hover {

    transform: translateX(3px);

    background: rgba(255,255,255,.06);

    border-color: rgba(255,205,0,.25);
}

.player-rank {

    width: 34px;
    height: 34px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: rgba(255,205,0,.1);

    color: var(--yellow);

    font-size: 14px;

    font-weight: 900;
}

.player-photo {

    width: 58px;
    height: 58px;

    border-radius: 11px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            rgba(0,0,86,.5)
        );

    border: 1px solid var(--border);

    display: flex;

    align-items: center;
    justify-content: center;

    color: rgba(255,255,255,.35);

    font-size: 20px;
}

.player-photo img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.player-name {

    min-width: 0;

    font-size: 14px;

    font-weight: 800;

    line-height: 1.15;

    text-transform: uppercase;
}

.player-position {

    margin-top: 5px;

    color: var(--muted);

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .8px;
}

.players-stat {

    color: var(--yellow);

    font-size: 17px;

    font-weight: 900;

    text-align: right;

    white-space: nowrap;
}

.players-empty {

    padding: 18px 12px 22px;

    color: var(--muted);

    text-align: center;

    font-size: 12px;
}


/* =========================================================
   MEDIA
   ========================================================= */

.media-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 16px;
}

.album-card {

    position: relative;

    min-height: 270px;

    overflow: hidden;

    border-radius: var(--radius);

    border: 1px solid var(--border);

    background: var(--card);

    cursor: pointer;
}

.album-image {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: transform .6s ease;
}

.album-card:hover .album-image {
    transform: scale(1.06);
}

.album-overlay {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            180deg,
            transparent 25%,
            rgba(5,11,34,.95) 100%
        );
}

.album-content {

    position: absolute;

    left: 20px;
    right: 20px;
    bottom: 20px;
}

.album-title {

    font-size: 28px;

    line-height: .95;

    font-weight: 900;

    text-transform: uppercase;
}

.album-description {

    color: var(--muted);

    margin-top: 7px;

    font-size: 12px;

    line-height: 1.45;
}


/* =========================================================
   ACHIEVEMENTS
   ========================================================= */

.achievement-list {

    display: grid;

    gap: 12px;
}

.achievement {

    position: relative;

    min-height: 170px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    overflow: hidden;

    border: 1px solid var(--border);

    background:
        linear-gradient(
            110deg,
            var(--card),
            rgba(13,23,56,.5)
        );

    border-radius: var(--radius);

    padding: 20px;
}

.achievement-info {

    position: relative;

    z-index: 2;

    max-width: 70%;
}

.achievement-year {

    color: var(--yellow);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2px;
}

.achievement-title {

    margin-top: 5px;

    font-size: clamp(25px, 6vw, 40px);

    line-height: .95;

    font-weight: 900;

    text-transform: uppercase;
}

.achievement-description {

    margin-top: 8px;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.45;
}

.trophy {

    position: absolute;

    right: 10px;
    bottom: -10px;

    width: 180px;
    height: 180px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 15px 25px rgba(0,0,0,.35)
        );

    z-index: 1;
}


/* =========================================================
   BIRTHDAYS
   ========================================================= */

.birthdays {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 12px;
}

.birthday {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;

    overflow: hidden;
}

.birthday-photo {

    aspect-ratio: 1;

    background: var(--primary);

    overflow: hidden;
}

.birthday-photo img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.birthday-body {
    padding: 12px;
}

.birthday-name {

    font-size: 14px;

    font-weight: 800;

    text-transform: uppercase;
}

.birthday-date {

    margin-top: 5px;

    color: var(--yellow);

    font-size: 10px;

    font-weight: 700;
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {

    position: fixed;

    left: 50%;

    bottom: 14px;

    transform: translateX(-50%);

    width: min(
        calc(100% - 24px),
        650px
    );

    z-index: 100;

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    padding: 7px;

    border-radius: 22px;

    background:
        rgba(5,11,34,.9);

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);
}

.nav-item {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 4px;

    min-height: 52px;

    border-radius: 16px;

    color: var(--muted);

    font-size: 9px;

    font-weight: 700;

    text-transform: uppercase;

    transition: .25s ease;
}

.nav-icon {

    font-size: 20px;

    line-height: 1;
}

.nav-item.active {

    color: var(--primary);

    background: var(--yellow);
}


/* =========================================================
   SCROLL ANIMATION
   ========================================================= */

.reveal {

    opacity: 0;

    transform:
        translateY(55px)
        scale(.97);

    transition:
        opacity .7s ease,
        transform .7s cubic-bezier(.2,.7,.2,1);
}

.reveal.visible {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 800px) {

    .header {
        padding-top: 40px;
    }

    .logo {

        width: 90px;
        height: 90px;
    }

    .announcement {
        min-height: 560px;
    }

    .section {
        margin-top: 70px;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .news-grid {
        grid-template-columns: 1fr;
    }

    .news-card:nth-child(n+3) {
        display: none;
    }

    .media-grid {
        grid-template-columns: 1fr;
    }

    .birthdays {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .achievement-info {
        max-width: 75%;
    }

    .trophy {

        width: 145px;
        height: 145px;
    }

    .player-top-card {

        grid-template-columns:
            36px 52px minmax(0,1fr) auto;

        gap: 9px;

        padding: 7px 8px;
    }

    .player-photo {

        width: 52px;
        height: 52px;
    }

    .player-rank {

        width: 30px;
        height: 30px;

        font-size: 12px;
    }

    .player-name {
        font-size: 12px;
    }

    .players-stat {
        font-size: 15px;
    }
}


/* =========================================================
   VERY SMALL
   ========================================================= */

@media (max-width: 390px) {

    .container {

        width: min(
            calc(100% - 22px),
            var(--max)
        );
    }

    .header-main {
        gap: 8px;
    }

    .logo {

        width: 52px;
        height: 52px;
    }

    .announcement-content {

        left: 18px;
        right: 18px;
        bottom: 18px;
    }

    .announcement {
        min-height: 390px;
    }

    .section {
        margin-top: 40px;
    }

    .player-top-card {

        grid-template-columns:
            31px 47px minmax(0,1fr) auto;

        gap: 7px;
    }

    .player-photo {

        width: 47px;
        height: 47px;
    }

    .player-name {
        font-size: 11px;
    }

    .player-position {
        font-size: 8px;
    }

    .players-stat {
        font-size: 13px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header reveal">

        <div class="header-main">

            <img
                id="siteLogo"
                class="logo"
                src=""
                alt="ХК Челны 2011"
            >

        </div>

        <div class="city-line">
            НАБЕРЕЖНЫЕ ЧЕЛНЫ
        </div>

    </header>


    <main>

        <!-- =================================================
             АНОНС
             ================================================= -->

        <section
            id="announcementSection"
            class="section reveal"
        >

            <div id="announcement"></div>

        </section>


        <!-- =================================================
             ПРЕССА
             ================================================= -->

        <section
            id="pressSection"
            class="section reveal"
        >

            <div class="section-header">

                <h2 class="section-title">
                    Пресса
                </h2>

            </div>

            <div
                id="newsGrid"
                class="news-grid"
            ></div>

            <a
                class="more-button"
                href="news.html"
            >
                Смотреть больше
            </a>

        </section>


        <!-- =================================================
             ИГРОКИ
             ================================================= -->

        <section
            id="playersSection"
            class="section reveal"
        >

            <div class="section-header">

                <h2 class="section-title">
                    Игроки
                </h2>

            </div>


            <div
                id="playersAccordion"
                class="players-accordion"
            >

                <!-- БОМБАРДИРЫ -->

                <div
                    class="players-category"
                    data-category="scorers"
                >

                    <button
                        class="players-category-head"
                        type="button"
                        onclick="togglePlayerCategory(this)"
                    >

                        <span class="players-category-title">
                            Бомбардиры
                        </span>

                        <span class="players-arrow">
                            ↓
                        </span>

                    </button>


                    <div class="players-category-body">

                        <div
                            class="players-category-inner"
                            id="scorersContent"
                        ></div>

                    </div>

                </div>


                <!-- СНАЙПЕРЫ -->

                <div
                    class="players-category"
                    data-category="snipers"
                >

                    <button

<script>

/* =========================================================

   ========================================================= */

const SUPABASE_URL =

const SUPABASE_KEY =

/* =========================================================
   API
   ========================================================= */

async function api(
    table,
    params = ""
) {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${table}${params}`,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                    `Bearer ${SUPABASE_KEY}`,
                "Content-Type":
                    "application/json"
            }
        }
    );

    if (!response.ok) {

        throw new Error(
            await response.text()
        );
    }

    return response.json();
}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   SETTINGS
   ========================================================= */

let settings = {};


async function loadSettings() {

    const rows = await api(
        "settings",
        "?select=*&limit=1"

    settings = rows[0] || {};

    applySettings();

   SETTINGS + DESIGN
   ========================================================= */

                "--card",

            );
    }

                "--primary",

            );

    }

    }


    applyUploadedFonts();

/* =========================================================
   UPLOADED FONTS
   ========================================================= */

function applyUploadedFonts() {

    const root =
        document.documentElement;


    if (settings.font_main) {

        addUploadedFont(
            "UploadedMain",
            settings.font_main
        );

        root.style.setProperty(
            "--font-main",
            '"UploadedMain", Arial, sans-serif'
        );
    }


    if (settings.font_heading) {

        addUploadedFont(
            "UploadedHeading",
            settings.font_heading
        );

        root.style.setProperty(
            "--font-heading",
            '"UploadedHeading", Arial, sans-serif'
        );
    }


    if (settings.font_secondary) {

        addUploadedFont(
            "UploadedSecondary",
            settings.font_secondary
        );

        root.style.setProperty(
            "--font-secondary",
            '"UploadedSecondary", Arial, sans-serif'
        );
    }
}


/* =========================================================
   ADD FONT
   ========================================================= */

function addUploadedFont(
    family,
    url
) {

    if (!url) {
        return;
    }


    const old =
        document.querySelector(
            `style[data-font="${family}"]`
        );


    if (old) {
        old.remove();
    }


    const style =
        document.createElement("style");


    style.dataset.font =
        family;


    let format = "woff2";


    const lower =
        String(url).toLowerCase();


    if (lower.includes(".woff")) {
        format = "woff";
    }

    if (lower.includes(".ttf")) {
        format = "truetype";
    }

    if (lower.includes(".otf")) {
        format = "opentype";
    }


    style.textContent = `

        @font-face {

            font-family: "${family}";

            src:
                url("${url}")
                format("${format}");

            font-weight:
                100 900;

            font-style:
                normal;

            font-display:
                swap;
        }

    `;


    document.head.appendChild(style);
}

const playerCategories = {

/* =========================================================
   LOAD PLAYER STATS
   ========================================================= */

async function loadPlayerStats() {

    const container =
        document.getElementById(
            "playersAccordion"
        );


    try {

        const stats =
            await api(
                "player_stats",
                "?select=*&order=category.asc,rank.asc"
            );


        const players =
            await api(
                "players",
                "?select=id,name,position"
            );


        const playerMap =
            new Map(
                players.map(
                    player => [
                        String(player.id),
                        player
                    ]
                )
            );


        Object.keys(playerCategories)
            .forEach(category => {

                const content =
                    document.getElementById(
                        `${category}Content`
                    );


                if (!content) {
                    return;
                }


                const categoryRows =
                    stats
                        .filter(
                            item =>
                                item.category === category
                        )
                        .sort(
                            (a,b) =>
                                Number(a.rank) -
                                Number(b.rank)
                        );


                if (!categoryRows.length) {

                    content.innerHTML = `

                        <div class="players-empty">

                            Пока статистика не добавлена

                        </div>

                    `;

                    return;
                }


                content.innerHTML = `

                    <div class="players-list">

                        ${
                            categoryRows
                                .slice(0,3)
                                .map(
                                    item =>
                                        playerCard(
                                            item,
                                            playerMap.get(
                                                String(
                                                    item.player_id
                                                )
                                            )
                                        )
                                )
                                .join("")
                        }

                    </div>

                `;

            });


    } catch (error) {

        console.error(
            "Ошибка загрузки статистики игроков:",
            error
        );


        Object.keys(playerCategories)
            .forEach(category => {

                const content =
                    document.getElementById(
                        `${category}Content`
                    );


                if (content) {

                    content.innerHTML = `

                        <div class="players-empty">

                            Статистика игроков пока недоступна

                        </div>

                    `;

                }

            });

    }
}

/* =========================================================
   DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    return date.toLocaleDateString(
        "ru-RU",
        {
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );
}


function formatBirthday(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(
            `2000-${value.substring(5)}`
        );


    return date.toLocaleDateString(
        "ru-RU",
        {
            day: "numeric",
            month: "long"
        }
    );
}


/* =========================================================
   SCROLL ANIMATION
   ========================================================= */

function initReveal() {

    const elements =
        document.querySelectorAll(
            ".reveal"
        );


    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if (
                        entry.isIntersecting
                    ) {

                        entry.target
                            .classList
                            .add("visible");


                        observer.unobserve(
                            entry.target
                        );
                    }

                });

            },
            {
                threshold: .12
            }
        );


    elements.forEach(
        element =>
            observer.observe(element)
    );
}

    }


    initReveal();
}
