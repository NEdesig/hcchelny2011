<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ХК Челны 2011</title>
<link rel="icon" id="favicon" href="logo.svg">

<style>
:root{
--primary:#000056;
--secondary:#0875dc;
--bg:#050b22;
--card:#0d1738;
--text:#fff;
--muted:#aab5d5;
--button:#ffcd00;
--border:#26345f;
--radius:16px;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
background-size:cover;
background-attachment:fixed;
}

header{
padding:18px;
background:linear-gradient(135deg,var(--primary),var(--secondary));
border-radius:0 0 25px 25px;
}

.header{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:55px;
height:55px;
background:white;
border-radius:50%;
object-fit:contain;
}

.club{
font-size:20px;
font-weight:900;
}

.season{
font-size:12px;
opacity:.7;
margin-top:4px;
}

main{
max-width:700px;
margin:auto;
padding:18px 14px 100px;
}

.label{
font-size:11px;
letter-spacing:1.5px;
color:var(--muted);
text-transform:uppercase;
}

h1{
font-size:30px;
margin:7px 0 15px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:var(--radius);
padding:17px;
margin-bottom:14px;
box-shadow:0 7px 25px rgba(0,0,0,.15);
}

.date{
font-size:11px;
color:var(--muted);
text-transform:uppercase;
}

.teams{
font-size:18px;
font-weight:800;
margin-top:7px;
}

.score{
font-size:30px;
font-weight:900;
margin:8px 0;
}

.title{
font-size:18px;
font-weight:900;
margin-bottom:6px;
}

.muted{
color:var(--muted);
font-size:13px;
line-height:1.5;
}

.more{
display:block;
text-align:center;
padding:12px;
background:var(--button);
color:#111;
border-radius:12px;
text-decoration:none;
font-weight:800;
margin-top:10px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:var(--card);
border-top:1px solid var(--border);
display:flex;
justify-content:space-around;
align-items:center;
z-index:20;
}

.bottom a{
color:var(--muted);
text-decoration:none;
font-size:10px;
text-align:center;
}

.bottom a.active{
color:var(--button);
font-weight:800;
}

.icon{
font-size:21px;
display:block;
margin-bottom:4px;
}
</style>
</head>

<body>

<header>
<div class="header">
<img id="logo" class="logo" src="logo.svg">
<div>
<div class="club" id="siteName">ХК ЧЕЛНЫ 2011</div>
<div class="season">СЕЗОН 2026/27</div>
</div>
</div>
</header>

<main>

<div class="label">Ближайший матч</div>
<h1>МАТЧ ДЭЙ</h1>

<div id="nextMatch" class="card">
Загрузка...
</div>

<div class="title">Последний матч</div>

<div id="lastMatch" class="card">
Загрузка...
</div>

<div class="title">Последние новости</div>

<div id="news">
Загрузка...
</div>

<a class="more" href="news.html">Все новости →</a>

</main>

<nav class="bottom">

<a class="active" href="index.html">
<span class="icon">⌂</span>
Главная
</a>

<a href="matches.html">
<span class="icon">🏒</span>
Матчи
</a>

<a href="roster.html">
<span class="icon">👥</span>
Состав
</a>

<a href="standings.html">
<span class="icon">📊</span>
Таблица
</a>

<a href="news.html">
<span class="icon">📰</span>
Новости
</a>

</nav>

<script>

const SUPABASE_URL="https://jxlbojosxaaqnyuzohnw.supabase.co";

const SUPABASE_KEY="sb_publishable_wNNvPktjjKpz3csoDMo3JA_4duyLAzL";

const headers={
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
};

async function getData(table,query=""){
const response=await fetch(
SUPABASE_URL+"/rest/v1/"+table+"?select=*"+query,
{headers}
);

if(!response.ok) throw new Error(response.status);

return await response.json();
}

function escapeHTML(text){
return String(text ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");
}

function formatDate(date){
if(!date)return "";

const d=new Date(date);

return d.toLocaleDateString("ru-RU",{
day:"numeric",
month:"long",
year:"numeric"
});
}

async function loadSettings(){

try{

const data=await getData("settings","&limit=1");

if(!data.length)return;

const s=data[0];

const root=document.documentElement;

if(s.primary_color)
root.style.setProperty("--primary",s.primary_color);

if(s.secondary_color)
root.style.setProperty("--secondary",s.secondary_color);

if(s.background_color)
root.style.setProperty("--bg",s.background_color);

if(s.card_color)
root.style.setProperty("--card",s.card_color);

if(s.text_color)
root.style.setProperty("--text",s.text_color);

if(s.muted_text_color)
root.style.setProperty("--muted",s.muted_text_color);

if(s.button_color)
root.style.setProperty("--button",s.button_color);

if(s.border_color)
root.style.setProperty("--border",s.border_color);

if(s.border_radius)
root.style.setProperty("--radius",s.border_radius+"px");

if(s.site_name){

document.title=s.site_name;

document.getElementById("siteName").textContent=s.site_name;

}

if(s.logo_url)
document.getElementById("logo").src=s.logo_url;

if(s.favicon_url)
document.getElementById("favicon").href=s.favicon_url;

if(s.background_image)
document.body.style.backgroundImage=
`url("${s.background_image}")`;

}

catch(error){

console.log(error);

}

}

async function loadMatches(){

try{

const matches=await getData(
"matches",
"&order=date.asc,time.asc"
);

const next=document.getElementById("nextMatch");

const last=document.getElementById("lastMatch");

if(!matches.length){

next.innerHTML="Матчей пока нет";

last.innerHTML="Матчей пока нет";

return;

}

const now=new Date();

let upcoming=matches.find(m=>{

if(!m.date)return false;

return new Date(
m.date+"T"+(m.time||"00:00")
)>=now;

});

if(!upcoming)
upcoming=matches[matches.length-1];

const home=
upcoming.home===true ||
String(upcoming.home).toLowerCase()==="true";

next.innerHTML=`

<div class="date">
${escapeHTML(formatDate(upcoming.date))}
${upcoming.time?" · "+escapeHTML(upcoming.time):""}
</div>

<div class="teams">
${escapeHTML(home?"ХК Челны":upcoming.opponent||"Соперник")}
</div>

<div class="teams">
${escapeHTML(home?
upcoming.opponent||"Соперник":
"ХК Челны")}
</div>

<div class="score">VS</div>

`;

const played=[...matches].reverse()
.find(m=>m.score || m.status);

if(played){

const h=
played.home===true ||
String(played.home).toLowerCase()==="true";

last.innerHTML=`

<div class="date">
${escapeHTML(formatDate(played.date))}
</div>

<div class="teams">
${escapeHTML(h?"ХК Челны":played.opponent||"Соперник")}
</div>

<div class="teams">
${escapeHTML(h?
played.opponent||"Соперник":
"ХК Челны")}
</div>

<div class="score">
${escapeHTML(played.score||"— : —")}
</div>

<div class="muted">
${escapeHTML(played.status||"")}
</div>

`;

}

}

catch(error){

console.log(error);

document.getElementById("nextMatch").textContent=
"Ошибка загрузки";

}

}

async function loadNews(){

try{

const news=await getData(
"news",
"&order=id.desc&limit=2"
);

const box=document.getElementById("news");

if(!news.length){

box.innerHTML=
'<div class="card">Новостей пока нет</div>';

return;

}

box.innerHTML=news.map(n=>`

<div class="card">

<div class="date">
${escapeHTML(formatDate(n.created_at||n.date))}
</div>

<div class="title">
${escapeHTML(n.title||"Новость")}
</div>

<div class="muted">
${escapeHTML(n.text||"")}
</div>

</div>

`).join("");

}

catch(error){

console.log(error);

}

}

loadSettings();
loadMatches();
loadNews();

</script>

</body>
</html>
