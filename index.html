<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ХК Челны 2011</title>

<style>
/* =========================================================
   ШРИФТЫ
   Положи файлы в папку fonts:
   Stapel-Regular.woff2
   Stapel-Medium.woff2
   Stapel-Bold.woff2
   Stapel-Black.woff2
   Stengazeta.woff2
   Christopher.woff2
========================================================= */

@font-face {
    font-family: "Stapel";
    src: url("fonts/Stapel-Regular.woff2") format("woff2");
    font-weight: 400;
}

@font-face {
    font-family: "Stapel";
    src: url("fonts/Stapel-Medium.woff2") format("woff2");
    font-weight: 500;
}

@font-face {
    font-family: "Stapel";
    src: url("fonts/Stapel-Bold.woff2") format("woff2");
    font-weight: 700;
}

@font-face {
    font-family: "Stapel";
    src: url("fonts/Stapel-Black.woff2") format("woff2");
    font-weight: 900;
}

@font-face {
    font-family: "Stengazeta";
    src: url("fonts/Stengazeta.woff2") format("woff2");
}

@font-face {
    font-family: "Christopher";
    src: url("fonts/Christopher.woff2") format("woff2");
}


/* =========================================================
   ОСНОВНЫЕ ЦВЕТА
========================================================= */

:root {
    --blue: #000056;
    --yellow: #ffcd00;

    --background: #050b22;
    --card: #0d1738;

    --white: #ffffff;
    --muted: #aab5d5;

    --border: #26345f;

    --radius: 18px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(0, 0, 86, 0.95),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #050b22 0%,
            #07102d 100%
        );

    color: var(--white);

    font-family: "Stapel", Arial, sans-serif;

    min-height: 100vh;

    padding-bottom: 90px;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

img {
    max-width: 100%;
}

a {
    text-decoration: none;
    color: inherit;
}


/* =========================================================
   ОБЩИЙ КОНТЕЙНЕР
========================================================= */

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;

    z-index: 50;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 15px 16px 10px;

    background:
        linear-gradient(
            180deg,
            rgba(5, 11, 34, 0.98),
            rgba(5, 11, 34, 0.86),
            transparent
        );

    backdrop-filter: blur(12px);
}

.header-logo {
    width: 50px;
    height: 50px;

    object-fit: contain;

    border-radius: 15px;

    background: var(--card);

    border: 1px solid var(--border);

    padding: 5px;
}

.header-title {
    font-weight: 900;

    font-size: 17px;

    line-height: 1;
}

.header-subtitle {
    margin-top: 5px;

    font-size: 9px;

    letter-spacing: 0.14em;

    color: var(--muted);

    text-transform: uppercase;
}

.header-button {
    margin-left: auto;

    width: 44px;
    height: 44px;

    border-radius: 14px;

    border: 1px solid var(--border);

    background: var(--card);

    color: white;

    font-size: 20px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    margin: 5px 14px 18px;

    padding: 25px 18px 18px;

    overflow: hidden;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #000056 0%,
            #0d1738 100%
        );

    border: 1px solid var(--border);

    box-shadow:
        0 25px 70px rgba(0,0,0,.3);
}

.hero::before {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    right: -120px;
    top: -100px;

    border-radius: 50%;

    background: rgba(255,205,0,.07);
}

.hero-label {
    position: relative;

    font-family: "Stengazeta", "Stapel", sans-serif;

    color: var(--yellow);

    font-size: 12px;

    letter-spacing: .15em;

    text-transform: uppercase;
}

.hero-title {
    position: relative;

    margin-top: 8px;

    font-size: 40px;

    line-height: .95;

    font-weight: 900;
}

.hero-description {
    position: relative;

    margin-top: 12px;

    max-width: 85%;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.45;
}


/* =========================================================
   MATCH
========================================================= */

.match-card {
    position: relative;

    margin-top: 22px;

    padding: 16px;

    background: white;

    color: #07102d;

    border-radius: 21px;

    z-index: 2;
}

.match-top {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}

.match-type {
    color: #70798f;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: .12em;

    text-transform: uppercase;
}

.match-date {
    margin-top: 5px;

    color: #70798f;

    font-size: 11px;
}


/* =========================================================
   МАТЧ ДЭЙ
========================================================= */

.match-day {
    display: none;

    padding: 7px 10px;

    border-radius: 9px;

    background: var(--yellow);

    color: var(--blue);

    font-size: 9px;

    font-weight: 900;

    letter-spacing: .08em;
}

.match-day.visible {
    display: block;
}


.match-teams {
    display: grid;

    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    gap: 10px;

    margin-top: 18px;
}

.team {
    display: flex;

    flex-direction: column;

    gap: 8px;
}

.team:last-child {
    align-items: flex-end;

    text-align: right;
}

.team-logo {
    width: 48px;
    height: 48px;

    object-fit: contain;
}

.team-name {
    font-weight: 900;

    font-size: 15px;

    line-height: 1.05;
}

.vs {
    font-family: "Stengazeta", sans-serif;

    color: var(--blue);

    font-size: 12px;

    text-align: center;
}

.score {
    font-size: 25px;

    font-weight: 900;

    white-space: nowrap;
}


/* =========================================================
   SECTIONS
========================================================= */

.section-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin: 25px 14px 11px;
}

.section-title {
    font-size: 20px;

    font-weight: 900;
}

.section-link {
    color: var(--yellow);

    font-size: 10px;

    font-weight: 900;
}


/* =========================================================
   CARDS
========================================================= */

.card {
    margin: 0 14px 12px;

    background: rgba(13,23,56,.96);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    overflow: hidden;
}

.card-content {
    padding: 15px;
}


/* =========================================================
   STATS
========================================================= */

.stats {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin: 0 14px;
}

.stat-card {
    padding: 17px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 16px;
}

.stat-number {
    font-size: 27px;

    font-weight: 900;

    color: var(--yellow);
}

.stat-title {
    margin-top: 4px;

    color: var(--muted);

    font-size: 10px;
}


/* =========================================================
   NEWS
========================================================= */

.news-card {
    cursor: pointer;

    transition:
        transform .18s ease,
        border-color .18s ease;
}

.news-card:active {
    transform: scale(.985);
}

.news-image {
    display: block;

    width: 100%;

    aspect-ratio: 16 / 9;

    object-fit: cover;

    background: var(--blue);
}

.news-content {
    padding: 15px;
}

.news-date {
    color: var(--muted);

    font-size: 9px;

    letter-spacing: .08em;

    text-transform: uppercase;
}

.news-title {
    margin-top: 6px;

    font-size: 17px;

    line-height: 1.1;

    font-weight: 900;
}

.news-text {
    margin-top: 7px;

    color: var(--muted);

    font-size: 11px;

    line-height: 1.5;
}


/* =========================================================
   TABLE
========================================================= */

.table-wrapper {
    margin: 0 14px;

    overflow-x: auto;

    border-radius: 16px;

    border: 1px solid var(--border);

    background: var(--card);
}

table {
    width: 100%;

    min-width: 600px;

    border-collapse: collapse;

    font-size: 10px;
}

th {
    padding: 11px;

    text-align: left;

    background: var(--blue);

    color: white;
}

td {
    padding: 10px;

    border-top: 1px solid var(--border);
}

.club-row {
    background: rgba(255,205,0,.08);
}

.club-row td {
    color: var(--yellow);

    font-weight: 900;
}


/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav {
    position: fixed;

    z-index: 100;

    bottom: 0;
    left: 0;
    right: 0;

    display: flex;

    max-width: 760px;

    margin: auto;

    padding:
        8px
        7px
        calc(8px + env(safe-area-inset-bottom));

    background: rgba(5,11,34,.97);

    border-top: 1px solid var(--border);

    backdrop-filter: blur(20px);
}

.nav-item {
    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 4px;

    color: var(--muted);

    font-size: 8px;

    font-weight: 700;
}

.nav-item.active {
    color: var(--yellow);
}

.nav-icon {
    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;
    justify-content: center;
}

.nav-icon img {
    width: 21px;
    height: 21px;

    object-fit: contain;
}

.nav-emoji {
    font-size: 19px;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: flex-end;

    background: rgba(0,0,0,.72);
}

.modal.open {
    display: flex;
}

.modal-window {
    width: 100%;

    max-width: 760px;

    max-height: 88vh;

    margin: auto;

    overflow-y: auto;

    padding: 18px;

    background: #0b1433;

    border: 1px solid var(--border);

    border-bottom: none;

    border-radius: 25px 25px 0 0;
}

.modal-close {
    float: right;

    width: 38px;
    height: 38px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: var(--card);

    color: white;

    font-size: 22px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
    margin: 0 14px;

    padding: 24px;

    text-align: center;

    color: var(--muted);

    border: 1px dashed var(--border);

    border-radius: 16px;

    font-size: 12px;
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 700px) {

    .hero {
        margin-top: 10px;
    }

    .hero-title {
        font-size: 48px;
    }

}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://jxlbojosxaaqnyuzohnw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wNNvPktjjKpz3csoDMo3JA_4duyLAzL";


/* =========================================================
   SUPABASE FETCH
========================================================= */

async function supabaseFetch(
    table,
    query = ""
) {

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        table +
        "?" +
        query,
        {
            method: "GET",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                    "Bearer " + SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {

        throw new Error(
            await response.text()
        );

    }

    return await response.json();

}


/* =========================================================
   ЭКРАНИРОВАНИЕ HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   ДАТА МОСКОВСКОЕ ВРЕМЯ
========================================================= */

function todayMoscow() {

    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Europe/Moscow",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );

    return formatter.format(
        new Date()
    );

}


/* =========================================================
   ВРЕМЯ МАТЧА
========================================================= */

function getMatchDate(match) {

    if (!match || !match.date) {

        return null;

    }

    const time =
        match.time || "00:00";

    /*
       Матчи считаем по московскому времени.
    */

    return new Date(
        match.date +
        "T" +
        time +
        ":00+03:00"
    );

}


/* =========================================================
   ПРОВЕРКА «МАТЧ ДЭЙ»
=========================================================

   ВАЖНО:

   Надпись появляется НЕ тогда,
   когда матч ближайший.

   Она появляется только если:

   дата матча === сегодняшняя дата.

========================================================= */

function isMatchDay(match) {

    if (!match || !match.date) {

        return false;

    }

    return (
        match.date ===
        todayMoscow()
    );

}


/* =========================================================
   НАСТРОЙКИ
========================================================= */

let settings = {};


/* =========================================================
   ДАННЫЕ
========================================================= */

let matches = [];

let news = [];

let players = [];

let standings = [];


/* =========================================================
   ЗАГРУЗКА НАСТРОЕК
========================================================= */

async function loadSettings() {

    const data =
        await supabaseFetch(
            "settings",
            "select=*&limit=1"
        );

    settings =
        data.length
            ? data[0]
            : {};

}


/* =========================================================
   ЗАГРУЗКА МАТЧЕЙ
========================================================= */

async function loadMatches() {

    matches =
        await supabaseFetch(
            "matches",
            "select=*&order=date.asc,time.asc"
        );

}


/* =========================================================
   ЗАГРУЗКА НОВОСТЕЙ
========================================================= */

async function loadNews() {

    news =
        await supabaseFetch(
            "news",
            "select=*&order=created_at.desc"
        );

}


/* =========================================================
   ЗАГРУЗКА СОСТАВА
========================================================= */

async function loadPlayers() {

    players =
        await supabaseFetch(
            "players",
            "select=*"
        );

}


/* =========================================================
   ЗАГРУЗКА ТАБЛИЦЫ
========================================================= */

async function loadStandings() {

    standings =
        await supabaseFetch(
            "standings",
            "select=*&order=position.asc"
        );

}


/* =========================================================
   НАЙТИ МАТЧ ПО ID
========================================================= */

function findMatch(id) {

    if (!id) {

        return null;

    }

    return matches.find(
        match =>
            String(match.id) ===
            String(id)
    );

}


/* =========================================================
   АВТОМАТИЧЕСКИЙ БЛИЖАЙШИЙ
========================================================= */

function getAutomaticUpcoming() {

    const now =
        new Date();

    return matches.find(
        match =>
            getMatchDate(match) >= now
    );

}


/* =========================================================
   АВТОМАТИЧЕСКИЙ ПОСЛЕДНИЙ
========================================================= */

function getAutomaticLast() {

    const now =
        new Date();

    const played =
        matches
            .filter(
                match =>
                    getMatchDate(match) < now
            )
            .sort(
                (a,b) =>
                    getMatchDate(b) -
                    getMatchDate(a)
            );

    return played[0] || null;

}


/* =========================================================
   ОТОБРАЖЕНИЕ БЛИЖАЙШЕГО МАТЧА
========================================================= */

function renderUpcoming() {

    /*
       СНАЧАЛА используем выбор администратора.

       Если он ничего не выбрал —
       используем автоматический поиск.
    */

    let match =
        findMatch(
            settings.home_upcoming_match_id
        );

    if (!match) {

        match =
            getAutomaticUpcoming();

    }


    if (!match) {

        document.getElementById(
            "upcomingMatch"
        ).style.display = "none";

        return;

    }


    document.getElementById(
        "upcomingMatch"
    ).style.display = "block";


    document.getElementById(
        "upcomingDate"
    ).textContent =
        formatMatchDate(match);


    document.getElementById(
        "upcomingOpponent"
    ).textContent =
        match.opponent ||
        "Соперник";


    /*
       =====================================================
       ГЛАВНАЯ ЛОГИКА «МАТЧ ДЭЙ»
       =====================================================

       Она НЕ зависит от того,
       ближайший матч это или нет.

       Проверяем именно дату.
    */

    const matchDay =
        document.getElementById(
            "matchDay"
        );


    if (
        isMatchDay(match)
    ) {

        matchDay.classList.add(
            "visible"
        );

    } else {

        matchDay.classList.remove(
            "visible"
        );

    }

}


/* =========================================================
   ФОРМАТ ДАТЫ
========================================================= */

function formatMatchDate(match) {

    if (!match.date) {

        return "";

    }

    const parts =
        match.date.split("-");

    if (parts.length !== 3) {

        return match.date;

    }

    const year =
        parts[0];

    const month =
        Number(parts[1]);

    const day =
        Number(parts[2]);


    const months = [
        "",
        "января",
        "февраля",
        "марта",
        "апреля",
        "мая",
        "июня",
        "июля",
        "августа",
        "сентября",
        "октября",
        "ноября",
        "декабря"
    ];


    return (
        day +
        " " +
        months[month] +
        " " +
        year +
        (
            match.time
                ? " · " + match.time
                : ""
        )
    );

}

function createIcon(
    value,
    fallback
) {

    if (!value) {

        return `
            <span class="nav-emoji">
                ${fallback}
            </span>
        `;

    }


    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {

        return `
            <img
                src="${escapeHTML(value)}"
                alt=""
            >
        `;

    }


    return `
        <span class="nav-emoji">
            ${escapeHTML(value)}
        </span>
    `;

}

========================================================= */

function openNews(id) {

    const item =
        news.find(
            x =>
                String(x.id) ===
                String(id)
        );


    if (!item) {

        return;

    }


    document.getElementById(
        "modalContent"
    ).innerHTML = `

        ${
            item.image_url
            ?
            `
            <img
                src="${escapeHTML(
                    item.image_url
                )}"
                style="
                    width:100%;
                    border-radius:16px;
                    margin-bottom:15px;
                "
            >
            `
            :
            ""
        }


        <div
            style="
                color:var(--muted);
                font-size:9px;
                text-transform:uppercase;
            "
        >
            ${escapeHTML(
                item.date || ""
            )}
        </div>


        <h2
            style="
                margin-top:7px;
                font-size:25px;
            "
        >
            ${escapeHTML(
                item.title || ""
            )}
        </h2>


        <p
            style="
                margin-top:12px;
                color:var(--muted);
                line-height:1.6;
                font-size:13px;
            "
        >
            ${escapeHTML(
                item.text ||
                item.content ||
                ""
            ).replace(
                /\n/g,
                "<br>"
            )}
        </p>

    `;


    document.getElementById(
        "newsModal"
    ).classList.add("open");

}


function closeNewsModal(event) {

    if (
        event &&
        event.target &&
        event.target.closest &&
        event.target.closest(
            ".modal-window"
        ) &&
        !event.target.classList.contains(
            "modal-close"
        )
    ) {

        return;

    }


    document.getElementById(
        "newsModal"
    ).classList.remove("open");

}


/* =========================================================
   ПРИМЕНЕНИЕ ЦВЕТОВ ИЗ SUPABASE
========================================================= */

function applyColors() {

    const root =
        document.documentElement;


    const colors = {

        "--blue":
            settings.primary_color,

        "--yellow":
            settings.secondary_color,

        "--background":
            settings.background_color,

        "--card":
            settings.card_color,

        "--white":
            settings.text_color,

        "--muted":
            settings.muted_text_color,

        "--border":
            settings.border_color

    };


    Object.entries(colors)
        .forEach(
            ([name,value]) => {

                if (value) {

                    root.style.setProperty(
                        name,
                        value
                    );

                }

            }
        );


    if (
        settings.border_radius
    ) {

        root.style.setProperty(
            "--radius",
            settings.border_radius +
            "px"
        );

    }

}

   ЗАПУСК
========================================================= */

async function start() {

    try {

        /*
           Загружаем всё параллельно.
        */

        await Promise.all([

            loadSettings(),

            loadMatches(),

            loadNews(),

            loadPlayers(),

            loadStandings()

        ]);


        applyColors();

        renderSettings();

        renderUpcoming();

        renderLastMatch();

        renderNews();

        renderPlayers();

        renderStandings();

        renderNavigation();


    } catch (error) {

        console.error(error);


        document.getElementById(
            "upcomingMatch"
        ).innerHTML = `

            <div
                style="
                    color:#000056;
                    padding:10px;
                "
            >
                Не удалось загрузить данные

        `;

    }

}


/* =========================================================

========================================================= */

start();
