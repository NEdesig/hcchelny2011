<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ХК Челны 2011</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--p:#000056;--a:#0875dc;--g:#ffcd00;--bg:#f5f7fb;--text:#101426;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Stapel,Arial,sans-serif;padding-bottom:88px}button{font:inherit;border:0;cursor:pointer}.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px;padding:8px 0 18px}.logo{width:52px;height:52px;object-fit:contain;border-radius:14px}.team{font-size:21px;font-weight:900;color:var(--p)}.muted{color:#7b8295}.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 8px 28px #0000000b}.match{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;position:relative;overflow:hidden}.match:after{content:'MATCHDAY';position:absolute;right:-24px;top:18px;font-size:38px;font-weight:900;opacity:.08}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:800;opacity:.8}.match h1{margin:8px 0 14px;font-size:28px}.teams{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;text-align:center;font-size:17px;font-weight:900}.vs{opacity:.6}.count{font-size:13px;margin-top:16px;background:#ffffff1a;padding:10px 12px;border-radius:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-title{font-size:20px;font-weight:900;margin:24px 0 10px}.btn{padding:11px 15px;border-radius:13px;background:var(--p);color:white}.btn.gold{background:var(--g);color:var(--p)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px;border-radius:18px;background:#fff;border:1px solid #e9edf5}.stat b{font-size:24px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.player{background:#fff;border-radius:20px;overflow:hidden;border:1px solid #e9edf5}.player img{width:100%;height:160px;object-fit:cover;background:#e8ebf2}.player .p{padding:12px}.num{color:var(--a);font-weight:900}.nav{position:fixed;z-index:20;left:8px;right:8px;bottom:8px;background:#fff;border:1px solid #e5e9f1;border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 10px 35px #0002}.nav button{background:none;color:#7d8494;font-size:10px;padding:8px 2px}.nav button.active{color:var(--p);font-weight:900}.page{display:none}.page.active{display:block}.list{display:grid;gap:10px}.item{background:#fff;border-radius:18px;padding:14px;border:1px solid #e8ebf2}.item img{width:100%;border-radius:14px;max-height:240px;object-fit:cover}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;border-radius:28px 28px 0 0;padding:20px;width:100%;max-height:90vh;overflow:auto}.close{float:right;background:#eef1f7;border-radius:50%;width:36px;height:36px}.pill{display:inline-block;background:#eef4ff;color:var(--a);border-radius:999px;padding:6px 9px;font-size:11px;margin:3px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 4px;border-bottom:1px solid #edf0f5;text-align:center}.table th:first-child,.table td:first-child{text-align:left}.empty{padding:28px;text-align:center;color:#8b91a0}
</style></head><body><main class="wrap"><header class="top"><img id="logo" class="logo"><div><div id="teamName" class="team">ХК Челны 2011</div><div class="muted">Официальный сайт команды</div></div></header>
<section id="home" class="page active"><div id="featured"></div><div id="previous"></div><div id="stats"></div><div id="roster"></div><div id="achievements"></div><div id="birthdays"></div></section>
<section id="matches" class="page"><div class="section-title">Матчи</div><div id="matchesList" class="list"></div></section>
<section id="squad" class="page"><div class="section-title">Состав</div><div id="fullRoster"></div></section>
<section id="standings" class="page"><div class="section-title">Таблица</div><div class="card"><table class="table"><thead><tr><th>Команда</th><th>И</th><th>В</th><th>ВО</th><th>П</th><th>О</th></tr></thead><tbody id="standingsBody"></tbody></table></div></section>
<section id="media" class="page"><div class="section-title">Медиа</div><div id="mediaList" class="list"></div></section>
<section id="products" class="page"><div class="section-title">Товары</div><div id="productsList" class="list"></div></section></main>
<nav class="nav"><button data-page="home">⌂<br>Главная</button><button data-page="matches">▣<br>Матчи</button><button data-page="squad">♙<br>Состав</button><button data-page="standings">☷<br>Таблица</button><button data-page="products">◆<br>Ещё</button></nav>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const sb=supabase.createClient(SITE_CONFIG.supabaseUrl,SITE_CONFIG.supabaseKey);let settings,teams=[],players=[],stats=[],matches=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(t,q=''){let r=await sb.from(t).select(q||'*');if(r.error)throw r.error;return r.data||[]}
function money(v){return Number(v||0).toLocaleString('ru-RU')+' ₽'}
function team(id){return teams.find(x=>x.id===id)||{name:'—'}}
function matchDate(m){return new Date(`${m.match_date}T${m.match_time||'00:00'}`)}
async function init(){try{[settings,teams,matches,players,stats]=await Promise.all([get('settings').then(x=>x[0]||{}),get('teams'),get('matches','*'),get('players','*'),get('player_season_stats','*')]);applySettings();renderAll();}catch(e){console.error(e);document.body.insertAdjacentHTML('afterbegin','<div class="card" style="margin:12px">Ошибка загрузки данных. Проверьте SQL и Supabase.</div>')}}
function applySettings(){let r=document.documentElement.style;r.setProperty('--p',settings.primary_color||'#000056');r.setProperty('--a',settings.accent_color||'#0875dc');r.setProperty('--g',settings.gold_color||'#ffcd00');r.setProperty('--bg',settings.background_color||'#f5f7fb');r.setProperty('--text',settings.text_color||'#101426');document.getElementById('teamName').textContent=settings.team_name||'ХК Челны 2011';if(settings.logo_url)document.getElementById('logo').src=settings.logo_url}
function renderAll(){renderFeatured();renderPrevious();renderStats();renderRoster('roster',4);renderRoster('fullRoster');renderMatches();renderStandings();renderMedia();renderProducts();renderAchievements();renderBirthdays()}
function renderFeatured(){
  const now = new Date();
  const upcoming = matches
    .filter(x => ['scheduled','live'].includes(x.status) && (x.status === 'live' || matchDate(x) >= now))
    .sort((a,b) => matchDate(a)-matchDate(b));
  const chosenId = settings.homepage?.featuredMatchId;
  const chosen = matches.find(x => String(x.id) === String(chosenId));
  const m = chosen && ['scheduled','live'].includes(chosen.status) ? chosen : upcoming[0];
  const root = document.getElementById('featured');
  if(!m){ root.innerHTML=''; return; }
  const d = matchDate(m);
  root.innerHTML = `<div class="card match" onclick="openMatch(${m.id})"><div class="eyebrow">МАТЧ ДЭЙ · ${esc(m.tournament||'Матч')}</div><h1>${d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long'})}</h1><div class="teams"><span>${esc(team(m.home_team_id).name)}</span><span class="vs">VS</span><span>${esc(team(m.away_team_id).name)}</span></div><div class="count" id="count">${m.status==='live'?'МАТЧ НАЧАЛСЯ':countdown(d)}</div></div>`;
}
function countdown(d){let n=Math.max(0,d-new Date());let h=Math.floor(n/36e5),m=Math.floor(n%36e5/6e4),s=Math.floor(n%6e4/1e3);return `До начала: ${h}ч ${m}м ${s}с`}
setInterval(()=>{let el=document.getElementById('count');if(el){let id=settings?.homepage?.featuredMatchId,m=matches.find(x=>String(x.id)===String(id)&&['scheduled','live'].includes(x.status))||matches.filter(x=>['scheduled','live'].includes(x.status)&&(x.status==='live'||matchDate(x)>=new Date())).sort((a,b)=>matchDate(a)-matchDate(b))[0];if(m)el.textContent=m.status==='live'?'МАТЧ НАЧАЛСЯ':countdown(matchDate(m))}},1000)
function renderPrevious(){
  const past = matches.filter(x => x.status === 'finished').sort((a,b)=>matchDate(b)-matchDate(a));
  const chosenId = settings.homepage?.previousMatchId;
  const chosen = matches.find(x => String(x.id) === String(chosenId) && x.status === 'finished');
  const m = chosen || past[0];
  const root = document.getElementById('previous');
  if(!m){ root.innerHTML=''; return; }
  root.innerHTML = `<div class="section-title">Последний матч</div><div class="card" onclick="openMatch(${m.id})"><div class="muted">${new Date(m.match_date).toLocaleDateString('ru-RU')} · ${esc(m.tournament||'')}</div><h3>${esc(team(m.home_team_id).name)} — ${esc(team(m.away_team_id).name)}</h3><b>Матч завершён · ${m.home_score ?? '—'}:${m.away_score ?? '—'}</b></div>`;
}
function renderStats(){let s=[['Бомбардиры','points'],['Снайперы','goals'],['Плюс/минус','plus_minus'],['Бомбардиры-защитники','points']];document.getElementById('stats').innerHTML='<div class="section-title">Статистика</div><div class="grid">'+s.map(([n,k],i)=>`<div class="stat" onclick="openLeaders('${k}',${i===3})"><b>↘</b><div>${n}</div></div>`).join('')+'</div>'}
function openLeaders(k,def){let arr=players.filter(p=>p.active&&(!def||p.position==='defense')).map(p=>({...p,s:stats.find(x=>x.player_id===p.id)||{}})).sort((a,b)=>(b.s?.[k]||0)-(a.s?.[k]||0)).slice(0,3);openModal(`<h2>${def?'Бомбардиры-защитники':k==='goals'?'Снайперы':k==='plus_minus'?'Плюс/минус':'Бомбардиры'}</h2>${arr.map((p,i)=>`<div class="item"><b>${i+1}. ${esc(p.full_name)}</b><br><span class="num">${p.s?.[k]||0}</span> ${k==='points'?'очков':k==='goals'?'голов':'+/-'}</div>`).join('')||'<div class="empty">Нет данных</div>')}
function renderRoster(target,limit){let arr=players.filter(p=>p.active).slice(0,limit||999);document.getElementById(target).innerHTML=`<div class="section-title">Состав</div><div class="players">${arr.map(playerCard).join('')}</div>`}
function playerCard(p){return `<div class="player" onclick="openPlayer(${p.id})"><img src="${esc(p.photo_url||'')}" onerror="this.style.visibility='hidden'"><div class="p"><span class="num">#${p.number??'—'}</span> ${p.role?`<b>${p.role}</b>`:''}<br><b>${esc(p.full_name)}</b><br><small class="muted">${position(p.position)}</small></div></div>`}
function position(p){return {goalie:'Вратарь',defense:'Защитник',forward:'Нападающий'}[p]||p}
function openPlayer(id){let p=players.find(x=>x.id===id),s=stats.find(x=>x.player_id===id)||{};openModal(`<h2>${esc(p.full_name)}</h2>${p.photo_url?`<img src="${esc(p.photo_url)}" style="width:100%;max-height:300px;object-fit:contain;border-radius:18px">`:''}<p><b>#${p.number??'—'}</b> · ${position(p.position)}</p><p>Дата рождения: ${p.birth_date||'—'}<br>Рост: ${p.height_cm||'—'} см · Вес: ${p.weight_kg||'—'} кг</p><div class="grid"><div class="stat"><b>${s.games||0}</b><br>игр</div><div class="stat"><b>${s.goals||0}</b><br>голов</div><div class="stat"><b>${s.assists||0}</b><br>ассистов</div><div class="stat"><b>${s.points||0}</b><br>очков</div></div>`)}
async function openMatch(id){let m=matches.find(x=>x.id===id),ev=await get('match_events',`*`).catch(()=>[]),periods=await get('match_periods',`*`).catch(()=>[]);ev=ev.filter(x=>x.match_id===id);periods=periods.filter(x=>x.match_id===id);let lineup=Array.isArray(m.lineup)?m.lineup:[];openModal(`<h2>${esc(team(m.home_team_id).name)} — ${esc(team(m.away_team_id).name)}</h2><p>${new Date(`${m.match_date}T${m.match_time||'00:00'}`).toLocaleString('ru-RU')}<br>${esc(m.tournament||'')}<br>${esc(m.venue||'')}</p>${lineup.length?`<h3>Состав</h3><p>${lineup.map(x=>esc(x)).join('<br>')}</p>`:''}<h3>Судьи</h3><p>Главный: ${esc(m.chief_referee||'—')}<br>Линейные: ${esc(m.linesman1||'—')}, ${esc(m.linesman2||'—')}</p>${m.stream_url?`<a class="btn" href="${esc(m.stream_url)}" target="_blank">📹 Трансляция</a>`:''}<h3>События</h3>${ev.map(x=>`<div class="item">${x.event_type==='goal'?'🏒':'⚠️'} ${x.event_time||''} · ${x.note||''}</div>`).join('')||'<div class="empty">Событий пока нет</div>'}${periods.length?`<h3>Периоды</h3>${periods.map(x=>`<div class="item">${x.period} период: ${x.home_score}:${x.away_score}</div>`).join('')}`:''}`)}
function renderMatches(){let arr=[...matches].sort((a,b)=>matchDate(b)-matchDate(a));document.getElementById('matchesList').innerHTML=arr.map(m=>`<div class="item" onclick="openMatch(${m.id})"><div class="muted">${new Date(m.match_date).toLocaleDateString('ru-RU')} · ${m.match_time||''}</div><b>${esc(team(m.home_team_id).name)} — ${esc(team(m.away_team_id).name)}</b><br><small>${esc(m.tournament||'')} · ${esc(m.venue||'')}</small></div>`).join('')||'<div class="empty">Матчей пока нет</div>'}
async function renderStandings(){let rows=await get('standings','*').catch(()=>[]);document.getElementById('standingsBody').innerHTML=rows.sort((a,b)=>(a.place||999)-(b.place||999)).map(x=>`<tr><td>${esc(team(x.team_id).name)}</td><td>${x.games}</td><td>${x.wins}</td><td>${x.overtime_wins}</td><td>${x.losses}</td><td><b>${x.points}</b></td></tr>`).join('')||'<tr><td colspan="6">Нет данных</td></tr>'}
async function renderMedia(){let a=await get('albums','*').catch(()=>[]);document.getElementById('mediaList').innerHTML=a.map(x=>`<div class="item"><h3>${esc(x.title)}</h3><div class="grid">${(x.photos||[]).map(p=>`<img src="${esc(p)}" style="width:100%;height:120px;object-fit:cover;border-radius:12px">`).join('')}</div></div>`).join('')||'<div class="empty">Альбомов пока нет</div>'}
async function renderProducts(){let a=await get('products','*').catch(()=>[]);document.getElementById('productsList').innerHTML=a.filter(x=>x.active).map(x=>`<div class="item" onclick="openModal('<h2>${esc(x.name)}</h2><p>${esc(x.description||'')}</p><h3>${money(x.price)}</h3><p>Продавец: ${esc(x.seller_contact||'—')}</p>')"><img src="${esc(x.images?.[0]||'')}" onerror="this.style.display='none'"><div class="row"><b>${esc(x.name)}</b><b>${money(x.price)}</b></div></div>`).join('')||'<div class="empty">Товаров пока нет</div>'}
async function renderAchievements(){let a=await get('achievements','*').catch(()=>[]);if(!settings.homepage?.showAchievements||!a.length)return;document.getElementById('achievements').innerHTML='<div class="section-title">Достижения</div>'+a.sort((x,y)=>x.sort_order-y.sort_order).map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.description||'')}</p></div>`).join('')}
async function renderBirthdays(){let a=await get('birthdays','*').catch(()=>[]);if(!settings.homepage?.showBirthdays||!a.length)return;document.getElementById('birthdays').innerHTML='<div class="section-title">Ближайшие дни рождения</div>'+a.slice(0,5).map(x=>`<div class="item">🎂 ${esc(players.find(p=>p.id===x.player_id)?.full_name||'Игрок')} · ${x.birthday||''}</div>`).join('')}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');scrollTo(0,0)});document.querySelector('.nav button').classList.add('active');init();
</script></body></html>
