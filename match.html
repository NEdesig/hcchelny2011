<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000056">

    <title>Матч — ХК Челны 2011</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #f4f6fa;
            color: #10152b;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        a {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        /* HEADER */

        .header {
            background: #000056;
            color: white;
            padding:
                calc(14px + env(safe-area-inset-top))
                18px
                16px;
            border-radius: 0 0 24px 24px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-button {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 13px;
            background: rgba(255,255,255,.12);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 22px;
        }

        .header-title {
            flex: 1;
        }

        .header-title strong {
            display: block;
            font-size: 18px;
            font-weight: 800;
        }

        .header-title span {
            display: block;
            margin-top: 2px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .12em;
            opacity: .65;
        }

        /* MATCH HERO */

        .match-hero {
            margin: 14px;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,86,.10);
        }

        .match-status {
            padding: 12px 16px;
            text-align: center;
            background: #000056;
            color: white;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .13em;
        }

        .match-status.live {
            background: #d71920;
        }

        .match-status.finished {
            background: #15192b;
        }

        .match-status.upcoming {
            background: #0875dc;
        }

        .match-main {
            padding: 24px 18px 22px;
        }

        .match-date {
            text-align: center;
            font-size: 12px;
            color: #747b91;
            margin-bottom: 22px;
        }

        .teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .team {
            min-width: 0;
            text-align: center;
        }

        .team-logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 10px;
            border-radius: 22px;
            background: #f1f3f8;
            object-fit: contain;
            padding: 10px;
        }

        .team-name {
            font-size: 15px;
            font-weight: 800;
            line-height: 1.15;
        }

        .team-city {
            margin-top: 4px;
            color: #8a90a3;
            font-size: 10px;
        }

        .score {
            min-width: 92px;
            text-align: center;
        }

        .score-value {
            font-size: 38px;
            line-height: 1;
            font-weight: 900;
            color: #000056;
            letter-spacing: -.04em;
        }

        .score-divider {
            margin: 5px 0;
            color: #a3a8b8;
            font-weight: 700;
        }

        .score-placeholder {
            font-size: 25px;
            font-weight: 900;
            color: #a3a8b8;
        }

        .match-info {
            margin-top: 22px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .info-item {
            background: #f5f7fb;
            border-radius: 14px;
            padding: 11px;
        }

        .info-label {
            color: #8a90a3;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .info-value {
            margin-top: 4px;
            font-size: 12px;
            font-weight: 800;
        }

        .stream-button {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: 0;
            border-radius: 15px;
            background: #ffcd00;
            color: #000056;
            font-weight: 900;
            text-align: center;
        }

        .stream-button.visible {
            display: block;
        }

        /* CONTENT */

        .section {
            margin: 14px;
            background: white;
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 7px 25px rgba(0,0,86,.06);
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 900;
        }

        .section-title span {
            font-size: 10px;
            color: #8a90a3;
        }

        /* PERIODS */

        .periods {
            display: grid;
            gap: 8px;
        }

        .period {
            display: grid;
            grid-template-columns: 45px 1fr 1fr;
            align-items: center;
            padding: 11px 12px;
            background: #f5f7fb;
            border-radius: 13px;
        }

        .period-name {
            font-size: 11px;
            color: #7b8296;
            font-weight: 700;
        }

        .period-score {
            text-align: center;
            font-size: 14px;
            font-weight: 900;
        }

        /* EVENTS */

        .events {
            display: grid;
            gap: 8px;
        }

        .event {
            display: grid;
            grid-template-columns: 42px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 11px 10px;
            border-radius: 14px;
            background: #f5f7fb;
        }

        .event-time {
            color: #000056;
            font-size: 12px;
            font-weight: 900;
        }

        .event-main {
            min-width: 0;
        }

        .event-title {
            font-size: 12px;
            font-weight: 900;
        }

        .event-description {
            margin-top: 3px;
            font-size: 10px;
            color: #858b9c;
        }

        .event-icon {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9edf6;
            color: #000056;
            font-weight: 900;
        }

        .event.goal .event-icon {
            background: #ffcd00;
        }

        /* REFEREES */

        .referees {
            display: grid;
            gap: 8px;
        }

        .referee {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px;
            background: #f5f7fb;
            border-radius: 13px;
        }

        .referee-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #000056;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
        }

        .referee-info {
            flex: 1;
        }

        .referee-role {
            color: #8a90a3;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .referee-name {
            margin-top: 3px;
            font-size: 12px;
            font-weight: 800;
        }

        /* LINEUP */

        .lineup {
            display: grid;
            gap: 14px;
        }

        .line {
            display: grid;
            gap: 7px;
        }

        .line-title {
            font-size: 10px;
            color: #8a90a3;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 800;
        }

        .line-players {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
        }

        .line-player {
            background: #f5f7fb;
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
        }

        .line-number {
            color: #0875dc;
            font-size: 10px;
            font-weight: 900;
        }

        .line-name {
            margin-top: 4px;
            font-size: 10px;
            font-weight: 800;
            line-height: 1.15;
        }

        /* EMPTY */

        .empty {
            padding: 24px 10px;
            text-align: center;
            color: #8a90a3;
            font-size: 12px;
        }

        /* LOADING */

        .loading {
            padding: 80px 20px;
            text-align: center;
            color: #8a90a3;
            font-size: 13px;
        }

        .error {
            margin: 14px;
            padding: 16px;
            border-radius: 16px;
            background: #fff0f0;
            color: #a51d25;
            font-size: 12px;
        }

        @media (min-width: 700px) {
            .header {
                border-radius: 0 0 28px 28px;
            }

            .match-hero {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">
        <div class="header-top">
            <button class="back-button" onclick="history.back()">‹</button>

            <div class="header-title">
                <strong id="teamTitle">ХК Челны 2011</strong>
                <span>матч</span>
            </div>
        </div>
    </header>

    <main id="app">
        <div class="loading">
            Загрузка матча…
        </div>
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
    "https://jxlbojosxaaqnyuzohnw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wNNvPktjjKpz3csoDMo3JA_4duyLAzL";

const STORAGE_BUCKET = "site-media";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const app = document.getElementById("app");

let match = null;
let teams = [];
let periods = [];
let events = [];
let referees = [];
let players = [];
let settings = {};

/* ================================
   HELPERS
================================ */

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function getParam(name) {
    return new URLSearchParams(location.search).get(name);
}

function imageUrl(url) {
    if (!url) return "";

    if (
        url.startsWith("http://") ||
        url.startsWith("https://") ||
        url.startsWith("data:")
    ) {
        return url;
    }

    return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${url}`;
}

function formatDate(date, time) {
    if (!date) return "";

    const d = new Date(
        `${date}T${time || "00:00"}:00`
    );

    if (Number.isNaN(d.getTime())) {
        return date;
    }

    return d.toLocaleDateString("ru-RU", {
        weekday: "long",
        day: "numeric",
        month: "long"
    });
}

function formatTime(time) {
    if (!time) return "";

    return String(time).slice(0, 5);
}

function getTeam(id) {
    return teams.find(
        team => String(team.id) === String(id)
    );
}

function getTeamName(team) {
    return (
        team?.name ||
        team?.title ||
        team?.short_name ||
        "Команда"
    );
}

function getTeamLogo(team) {
    return imageUrl(
        team?.logo_url ||
        team?.logo ||
        team?.image_url
    );
}

function getHomeTeam() {
    return getTeam(
        match.home_team_id ||
        match.home_id
    );
}

function getAwayTeam() {
    return getTeam(
        match.away_team_id ||
        match.away_id
    );
}

function getScore(team) {
    if (!team) return null;

    if (
        String(team.id) ===
        String(match.home_team_id)
    ) {
        return match.home_score;
    }

    if (
        String(team.id) ===
        String(match.away_team_id)
    ) {
        return match.away_score;
    }

    return null;
}

/* ================================
   MATCH STATUS
================================ */

function getStatus() {

    if (match.status === "finished") {
        return "finished";
    }

    if (
        match.status === "live" ||
        match.status === "started"
    ) {
        return "live";
    }

    if (
        match.home_score !== null &&
        match.home_score !== undefined &&
        match.away_score !== null &&
        match.away_score !== undefined
    ) {
        return "finished";
    }

    const date = new Date(
        `${match.match_date}T${match.match_time || "00:00"}:00`
    );

    if (date <= new Date()) {
        return "live";
    }

    return "upcoming";
}

function statusText(status) {

    if (status === "finished") {
        return "Матч завершён";
    }

    if (status === "live") {
        return "Матч идёт";
    }

    return "Предстоящий матч";
}

/* ================================
   LOAD
================================ */

async function load() {

    const matchId = getParam("id");

    if (!matchId) {
        showError("Матч не найден.");
        return;
    }

    try {

        const [
            settingsResult,
            teamsResult,
            matchResult,
            periodsResult,
            eventsResult,
            playersResult
        ] = await Promise.all([

            db
                .from("settings")
                .select("*"),

            db
                .from("teams")
                .select("*"),

            db
                .from("matches")
                .select("*")
                .eq("id", matchId)
                .maybeSingle(),

            db
                .from("match_periods")
                .select("*")
                .eq("match_id", matchId)
                .order("period"),

            db
                .from("match_events")
                .select("*")
                .eq("match_id", matchId)
                .order("period")
                .order("event_time"),

            db
                .from("players")
                .select("*")
        ]);

        if (matchResult.error) {
            throw matchResult.error;
        }

        if (!matchResult.data) {
            showError("Такого матча нет.");
            return;
        }

        settings = settingsResult.data || [];
        teams = teamsResult.data || [];
        match = matchResult.data;
        periods = periodsResult.data || [];
        events = eventsResult.data || [];
        players = playersResult.data || [];

        loadTitle();

        render();

    } catch (error) {

        console.error(error);

        showError(
            "Не удалось загрузить информацию о матче."
        );
    }
}

/* ================================
   TITLE
================================ */

function getSetting(key) {

    const item = settings.find(
        x =>
            x.key === key ||
            x.name === key
    );

    return item?.value || "";
}

function loadTitle() {

    const title =
        getSetting("team_name") ||
        getSetting("site_title") ||
        "ХК Челны 2011";

    document.getElementById(
        "teamTitle"
    ).textContent = title;

    document.title =
        `${title} — матч`;
}

/* ================================
   RENDER
================================ */

function render() {

    const status = getStatus();

    const home = getHomeTeam();
    const away = getAwayTeam();

    const homeName =
        getTeamName(home);

    const awayName =
        getTeamName(away);

    const homeScore =
        getScore(home);

    const awayScore =
        getScore(away);

    const stream =
        match.stream_url ||
        match.broadcast_url ||
        match.broadcast;

    app.innerHTML = `

        <section class="match-hero">

            <div class="match-status ${status}">
                ${statusText(status)}
            </div>

            <div class="match-main">

                <div class="match-date">
                    ${escapeHTML(
                        formatDate(
                            match.match_date ||
                            match.date,
                            match.match_time ||
                            match.time
                        )
                    )}
                    ${match.match_time || match.time
                        ? " · " +
                          escapeHTML(
                              formatTime(
                                  match.match_time ||
                                  match.time
                              )
                          )
                        : ""
                    }
                </div>

                <div class="teams">

                    <div class="team">

                        ${
                            getTeamLogo(home)
                            ? `
                                <img
                                    class="team-logo"
                                    src="${escapeHTML(
                                        getTeamLogo(home)
                                    )}"
                                    alt=""
                                >
                            `
                            : `
                                <div class="team-logo"></div>
                            `
                        }

                        <div class="team-name">
                            ${escapeHTML(homeName)}
                        </div>

                        <div class="team-city">
                            ${escapeHTML(
                                home?.city || ""
                            )}
                        </div>

                    </div>

                    <div class="score">

                        ${
                            homeScore !== null &&
                            awayScore !== null
                            ? `
                                <div class="score-value">
                                    ${escapeHTML(homeScore)}
                                </div>

                                <div class="score-divider">
                                    :
                                </div>

                                <div class="score-value">
                                    ${escapeHTML(awayScore)}
                                </div>
                            `
                            : `
                                <div class="score-placeholder">
                                    VS
                                </div>
                            `
                        }

                    </div>

                    <div class="team">

                        ${
                            getTeamLogo(away)
                            ? `
                                <img
                                    class="team-logo"
                                    src="${escapeHTML(
                                        getTeamLogo(away)
                                    )}"
                                    alt=""
                                >
                            `
                            : `
                                <div class="team-logo"></div>
                            `
                        }

                        <div class="team-name">
                            ${escapeHTML(awayName)}
                        </div>

                        <div class="team-city">
                            ${escapeHTML(
                                away?.city || ""
                            )}
                        </div>

                    </div>

                </div>

                <div class="match-info">

                    <div class="info-item">
                        <div class="info-label">
                            Турнир
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                match.tournament ||
                                match.competition ||
                                "—"
                            )}
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">
                            Место
                        </div>

                        <div class="info-value">
                            ${escapeHTML(
                                match.venue ||
                                match.arena ||
                                "—"
                            )}
                        </div>
                    </div>

                </div>

                ${
                    stream
                    ? `
                        <a
                            class="stream-button visible"
                            href="${escapeHTML(stream)}"
                            target="_blank"
                            rel="noopener"
                        >
                            📺 Смотреть трансляцию
                        </a>
                    `
                    : ""
                }

            </div>

        </section>

        <section class="section">

            <div class="section-title">
                <h2>Периоды</h2>
            </div>

            <div class="periods">
                ${
                    periods.length
                    ? periods.map(renderPeriod).join("")
                    : `
                        <div class="empty">
                            Данные по периодам пока не внесены.
                        </div>
                    `
                }
            </div>

        </section>

        <section class="section">

            <div class="section-title">
                <h2>События</h2>
                <span>
                    ${events.length}
                </span>
            </div>

            <div class="events">
                ${
                    events.length
                    ? events.map(renderEvent).join("")
                    : `
                        <div class="empty">
                            Событий пока нет.
                        </div>
                    `
                }
            </div>

        </section>

        <section class="section">

            <div class="section-title">
                <h2>Состав</h2>
            </div>

            <div class="lineup">

                ${renderLine("Звено 1", 0)}
                ${renderLine("Звено 2", 3)}
                ${renderLine("Звено 3", 6)}

            </div>

        </section>

        <section class="section">

            <div class="section-title">
                <h2>Судьи</h2>
            </div>

            <div class="referees">

                ${
                    renderReferees()
                }

            </div>

        </section>
    `;
}

/* ================================
   PERIOD
================================ */

function renderPeriod(period) {

    return `
        <div class="period">

            <div class="period-name">
                ${
                    period.period === 1
                    ? "1 период"
                    : period.period === 2
                    ? "2 период"
                    : period.period === 3
                    ? "3 период"
                    : "Овертайм"
                }
            </div>

            <div class="period-score">
                ${escapeHTML(
                    period.home_score ?? 0
                )}
            </div>

            <div class="period-score">
                ${escapeHTML(
                    period.away_score ?? 0
                )}
            </div>

        </div>
    `;
}

/* ================================
   EVENT
================================ */

function getPlayer(id) {

    return players.find(
        player =>
            String(player.id) === String(id)
    );
}

function renderEvent(event) {

    const player =
        getPlayer(event.player_id);

    const assist1 =
        getPlayer(event.assist1_player_id);

    const assist2 =
        getPlayer(event.assist2_player_id);

    if (event.event_type === "goal") {

        let description =
            player?.full_name ||
            player?.name ||
            "Гол";

        const assists = [
            assist1?.full_name || assist1?.name,
            assist2?.full_name || assist2?.name
        ].filter(Boolean);

        if (assists.length) {
            description +=
                " · " + assists.join(", ");
        }

        return `
            <div class="event goal">

                <div class="event-time">
                    ${escapeHTML(
                        event.event_time || "—"
                    )}
                </div>

                <div class="event-main">

                    <div class="event-title">
                        Гол
                    </div>

                    <div class="event-description">
                        ${escapeHTML(description)}
                    </div>

                </div>

                <div class="event-icon">
                    +
                </div>

            </div>
        `;
    }

    return `
        <div class="event">

            <div class="event-time">
                ${escapeHTML(
                    event.event_time || "—"
                )}
            </div>

            <div class="event-main">

                <div class="event-title">
                    Удаление
                </div>

                <div class="event-description">
                    ${
                        escapeHTML(
                            player?.full_name ||
                            player?.name ||
                            "Игрок"
                        )
                    }

                    ·

                    ${escapeHTML(
                        event.penalty_minutes ||
                        2
                    )} мин.
                </div>

            </div>

            <div class="event-icon">
                2'
            </div>

        </div>
    `;
}

/* ================================
   LINEUP
================================ */

function renderLine(title, start) {

    const selected =
        players.slice(start, start + 3);

    if (!selected.length) {
        return "";
    }

    return `
        <div class="line">

            <div class="line-title">
                ${title}
            </div>

            <div class="line-players">

                ${
                    selected.map(player => `
                        <div class="line-player">

                            <div class="line-number">
                                #${escapeHTML(
                                    player.number ??
                                    player.jersey_number ??
                                    ""
                                )}
                            </div>

                            <div class="line-name">
                                ${escapeHTML(
                                    player.full_name ||
                                    player.name ||
                                    "Игрок"
                                )}
                            </div>

                        </div>
                    `).join("")
                }

            </div>

        </div>
    `;
}

/* ================================
   REFEREES
================================ */

function renderReferees() {

    const list = [];

    if (match.chief_referee) {
        list.push({
            role: "Главный судья",
            name: match.chief_referee
        });
    }

    if (match.linesman_1) {
        list.push({
            role: "Линейный судья",
            name: match.linesman_1
        });
    }

    if (match.linesman_2) {
        list.push({
            role: "Линейный судья",
            name: match.linesman_2
        });
    }

    if (!list.length) {
        return `
            <div class="empty">
                Судьи пока не указаны.
            </div>
        `;
    }

    return list.map(referee => `

        <div class="referee">

            <div class="referee-avatar">
                С
            </div>

            <div class="referee-info">

                <div class="referee-role">
                    ${escapeHTML(referee.role)}
                </div>

                <div class="referee-name">
                    ${escapeHTML(referee.name)}
                </div>

            </div>

        </div>

    `).join("");
}

/* ================================
   ERROR
================================ */

function showError(message) {

    app.innerHTML = `
        <div class="error">
            ${escapeHTML(message)}
        </div>
    `;
}

/* ================================
   START
================================ */

load();
</script>

</html>
