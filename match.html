<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000056"
    >

    <title>Матч — ХК Челны 2011</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="matches.html"
                class="header-back"
                aria-label="Назад"
            >
                ‹
            </a>

            <img
                id="siteLogo"
                class="header-logo"
                src=""
                alt="ХК Челны 2011"
            >

            <div class="header-brand">

                <div
                    id="siteTitle"
                    class="header-brand-title"
                >
                    ХК Челны 2011
                </div>

                <div
                    id="siteSubtitle"
                    class="header-brand-subtitle"
                >
                    Набережные Челны
                </div>

            </div>

            <div class="header-spacer"></div>

        </div>

    </header>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <main class="container">

        <!-- =================================================
             MATCH HERO
        ================================================== -->

        <section
            id="matchHero"
            class="match-detail-hero"
        >

            <div class="loading-state">
                Загрузка матча…
            </div>

        </section>


        <!-- =================================================
             COUNTDOWN
        ================================================== -->

        <section
            id="matchCountdownSection"
            class="section hidden"
        >

            <div class="match-countdown-card">

                <div class="match-countdown-label">
                    До начала матча
                </div>

                <div
                    id="matchCountdown"
                    class="match-countdown"
                >
                    —
                </div>

            </div>

        </section>


        <!-- =================================================
             LINEUP
        ================================================== -->

        <section
            id="lineupSection"
            class="section hidden"
        >

            <div class="section-header">

                <div>

                    <h2 class="section-title">
                        Состав на матч
                    </h2>

                    <div class="section-subtitle">
                        Заявка команды
                    </div>

                </div>

            </div>


            <div
                id="matchLineup"
                class="players-grid"
            ></div>

        </section>


        <!-- =================================================
             PERIODS
        ================================================== -->

        <section
            id="periodsSection"
            class="section hidden"
        >

            <div class="section-header">

                <div>

                    <h2 class="section-title">
                        По периодам
                    </h2>

                    <div class="section-subtitle">
                        Результаты встречи
                    </div>

                </div>

            </div>


            <div class="match-periods-wrapper">

                <table class="match-periods-table">

                    <thead>

                        <tr>

                            <th>
                                Период
                            </th>

                            <th>
                                ХК Челны 2011
                            </th>

                            <th>
                                Соперник
                            </th>

                        </tr>

                    </thead>

                    <tbody id="periodsBody"></tbody>

                </table>

            </div>

        </section>


        <!-- =================================================
             EVENTS
        ================================================== -->

        <section
            id="eventsSection"
            class="section hidden"
        >

            <div class="section-header">

                <div>

                    <h2 class="section-title">
                        События матча
                    </h2>

                    <div class="section-subtitle">
                        Голы и удаления
                    </div>

                </div>

            </div>


            <div
                id="matchEvents"
                class="match-events"
            ></div>

        </section>


        <!-- =================================================
             OFFICIALS
        ================================================== -->

        <section
            id="officialsSection"
            class="section hidden"
        >

            <div class="section-header">

                <div>

                    <h2 class="section-title">
                        Судьи
                    </h2>

                    <div class="section-subtitle">
                        Судейская бригада
                    </div>

                </div>

            </div>


            <div
                id="matchOfficials"
                class="officials-list"
            ></div>

        </section>


        <!-- =================================================
             BROADCAST
        ================================================== -->

        <section
            id="broadcastSection"
            class="section hidden"
        >

            <a
                id="broadcastButton"
                class="broadcast-button"
                href="#"
                target="_blank"
                rel="noopener"
            >

                <span class="broadcast-icon">
                    ▶
                </span>

                <span>
                    Смотреть трансляцию
                </span>

            </a>

        </section>


        <!-- =================================================
             VENUE / INFO
        ================================================== -->

        <section
            id="matchInfoSection"
            class="section"
        >

            <div class="info-card">

                <div
                    id="matchDateInfo"
                    class="info-row"
                ></div>

                <div
                    id="matchTournamentInfo"
                    class="info-row"
                ></div>

                <div
                    id="matchVenueInfo"
                    class="info-row"
                ></div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         BOTTOM NAV
    ====================================================== -->

    <nav class="bottom-nav">

        <div class="bottom-nav-inner">

            <a
                href="index.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ⌂
                </span>

                <span>
                    Главная
                </span>
            </a>


            <a
                href="matches.html"
                class="bottom-nav-item active"
            >
                <span class="bottom-nav-icon">
                    ⚔
                </span>

                <span>
                    Матчи
                </span>
            </a>


            <a
                href="roster.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ◎
                </span>

                <span>
                    Состав
                </span>
            </a>


            <a
                href="standings.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ≡
                </span>

                <span>
                    Таблица
                </span>
            </a>


            <a
                href="news.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ◈
                </span>

                <span>
                    Новости
                </span>
            </a>

        </div>

    </nav>

</div>


<!-- =====================================================
     SCRIPTS
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="app.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        if (
            typeof initializeSite ===
            "function"
        ) {
            await initializeSite();
        }

        if (
            typeof initMatchPage ===
            "function"
        ) {
            await initMatchPage();
        }

    }
);

</script>

</body>
</html>
