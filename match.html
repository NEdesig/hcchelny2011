<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000056">
  <title>Матч — ХК Челны 2011</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .match-page {
      width: min(1000px, calc(100% - 32px));
      margin: 32px auto 60px;
    }

    .match-back {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--primary, #000056);
      text-decoration: none;
      font-weight: 700;
    }

    .match-hero {
      padding: 28px;
      border-radius: 12px;
      background: var(--primary, #000056);
      color: white;
    }

    .match-competition {
      text-align: center;
      color: #e1e5f4;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .match-scoreboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
    }

    .match-club {
      min-width: 0;
      text-align: center;
    }

    .match-club img {
      display: block;
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin: 0 auto 12px;
    }

    .match-club-name {
      font-weight: 800;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .match-score {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(32px, 7vw, 56px);
      font-weight: 900;
      white-space: nowrap;
    }

    .match-score-separator {
      opacity: .6;
    }

    .match-status {
      margin-top: 20px;
      text-align: center;
      color: var(--gold, #ffcd00);
      font-weight: 800;
    }

    .match-meta {
      margin-top: 14px;
      text-align: center;
      color: #e1e5f4;
      font-size: 14px;
      line-height: 1.7;
    }

    .match-details {
      margin-top: 34px;
    }

    .match-details h2 {
      margin: 0 0 16px;
      color: var(--primary, #000056);
      font-size: 23px;
    }

    .match-detail-card {
      margin-bottom: 28px;
      padding: 20px;
      border: 1px solid #e5e8ef;
      border-radius: 10px;
      background: white;
    }

    .match-event {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f5;
      border-left: 4px solid transparent;
      border-radius: 5px;
    }

    .match-event:last-child {
      border-bottom: 0;
    }

    .match-event.home {
      border-left-color: #000056;
      background: #f1f3fa;
    }

    .match-event.away {
      border-left-color: #e1a900;
      background: #fff9e5;
    }

    .match-event-time {
      color: var(--primary, #000056);
      font-weight: 900;
      white-space: nowrap;
    }

    .match-event-description {
      overflow-wrap: anywhere;
    }

    .match-event-team {
      color: #747d90;
      font-size: 12px;
      text-align: right;
    }

    .match-event-period {
      display: block;
      margin-top: 3px;
      color: #7a8192;
      font-size: 11px;
      font-weight: 700;
    }

    .match-roster-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .match-roster-title {
      margin: 0 0 12px;
      color: var(--primary, #000056);
      font-weight: 800;
    }

    .match-player {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .match-player-number {
      color: var(--primary, #000056);
      font-weight: 900;
    }

    .match-player-position {
      color: #7a8192;
      font-size: 12px;
    }

    .match-page-state {
      padding: 45px 10px;
      text-align: center;
      color: #737b8d;
    }

    /* =====================================
       ХОККЕЙНАЯ ДОСКА
    ===================================== */

    .match-lineup {
      margin-bottom: 28px;
    }

    .match-lineup-team {
      margin-bottom: 30px;
    }

    .match-lineup-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .match-lineup-heading h3 {
      margin: 0;
      color: var(--primary, #000056);
      font-size: 19px;
    }

    .match-lineup-heading span {
      color: #81899a;
      font-size: 12px;
    }

    .rink-board {
      position: relative;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      overflow: hidden;
      border: 5px solid #d9e0e9;
      border-radius: 48% / 8%;
      background:
        linear-gradient(
          to bottom,
          transparent 49.5%,
          rgba(0, 0, 86, .18) 49.5%,
          rgba(0, 0, 86, .18) 50.5%,
          transparent 50.5%
        ),
        #f7fbff;
      aspect-ratio: 1.18 / 1;
      box-shadow: inset 0 0 0 2px #c5d1df;
    }

    .rink-board::before,
    .rink-board::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(210, 35, 55, .45);
    }

    .rink-board::before {
      top: 24%;
    }

    .rink-board::after {
      bottom: 24%;
    }

    .rink-center-circle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 27%;
      aspect-ratio: 1;
      border: 2px solid rgba(0, 0, 86, .2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .rink-blue-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(0, 0, 86, .2);
    }

    .rink-blue-line.left {
      left: 25%;
    }

    .rink-blue-line.right {
      right: 25%;
    }

    .rink-goal-crease {
      position: absolute;
      left: 50%;
      bottom: 3%;
      width: 22%;
      height: 13%;
      border: 2px solid rgba(0, 0, 86, .35);
      border-bottom: 0;
      border-radius: 50% 50% 0 0;
      transform: translateX(-50%);
    }

    .rink-player {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: clamp(36px, 8vw, 48px);
      height: clamp(36px, 8vw, 48px);
      border: 2px solid #000056;
      border-radius: 50%;
      background: #000056;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 7px rgba(0,0,0,.18);
    }

    .rink-player.goalie {
      border-color: #e1a900;
      background: #ffcd00;
      color: #000056;
    }

    .rink-player-label {
      position: absolute;
      top: calc(100% + 4px);
      left: 50%;
      width: 90px;
      color: #24304b;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      transform: translateX(-50%);
      overflow-wrap: anywhere;
    }

    .rink-player.goalie .rink-player-label {
      color: #24304b;
    }

    .match-coach {
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f2f4f8;
      color: #303b54;
      font-size: 13px;
    }

    .match-coach strong {
      color: var(--primary, #000056);
    }

    .match-roster-section {
      margin-top: 22px;
    }

    .match-roster-section h4 {
      margin: 0 0 8px;
      color: var(--primary, #000056);
      font-size: 14px;
    }

    .match-roster-section .match-player:last-child {
      border-bottom: 0;
    }

    @media (max-width: 600px) {
      .match-hero {
        padding: 22px 12px;
      }

      .match-scoreboard {
        gap: 8px;
      }

      .match-club img {
        width: 58px;
        height: 58px;
      }

      .match-club-name {
        font-size: 13px;
      }

      .match-score {
        gap: 6px;
        font-size: 32px;
      }

      .match-detail-card {
        padding: 14px;
      }

      .match-roster-grid {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .match-event {
        grid-template-columns: 48px minmax(0, 1fr);
      }

      .match-event-team {
        grid-column: 2;
        text-align: left;
      }

      .rink-board {
        border-width: 3px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="header-logo-link" href="index.html" aria-label="На главную">
        <img id="teamLogo" class="header-logo" src="" alt="Логотип команды">
      </a>
      <a class="header-center" href="index.html">
        <span id="teamName" class="header-team-name">Челны 2011</span>
        <span id="teamSubtitle" class="header-subtitle">хоккейный клуб</span>
      </a>
      <button id="menuButton" class="header-menu" type="button"
        aria-label="Открыть меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <nav id="mobileMenu" class="mobile-menu" aria-hidden="true">
    <div class="mobile-menu-panel">
      <button id="menuClose" class="menu-close" type="button"
        aria-label="Закрыть меню">×</button>
      <a href="index.html#news">Новости</a>
      <a href="index.html#matchday">Матчи</a>
      <a href="index.html#competition">Турнирная таблица</a>
      <a href="index.html#stats">Статистика</a>
      <a href="index.html#leaders">Лидеры команды</a>
      <a href="index.html#albums">Фотоальбомы</a>
    </div>
  </nav>

  <main class="match-page">
    <a class="match-back" href="index.html#matches">← Все матчи</a>
    <div id="matchContent">
      <div class="match-page-state">Загрузка матча…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <img id="footerLogo" class="footer-logo" src="" alt="">
      <div>
        <div id="footerTeamName" class="footer-team-name">Челны 2011</div>
        <div id="footerCity" class="footer-city">Набережные Челны</div>
      </div>
      <div class="footer-copy">© <span id="footerYear"></span></div>
    </div>
  </footer>

  <script>
    document.getElementById("footerYear").textContent = new Date().getFullYear();

    const menuButton = document.getElementById("menuButton");
    const mobileMenu = document.getElementById("mobileMenu");
    const menuClose = document.getElementById("menuClose");

    function closeMenu() {
      mobileMenu?.classList.remove("open");
      mobileMenu?.setAttribute("aria-hidden", "true");
      menuButton?.setAttribute("aria-expanded", "false");
    }

    menuButton?.addEventListener("click", () => {
      const opened = mobileMenu.classList.toggle("open");
      mobileMenu.setAttribute("aria-hidden", String(!opened));
      menuButton.setAttribute("aria-expanded", String(opened));
    });

    menuClose?.addEventListener("click", closeMenu);
    mobileMenu?.querySelectorAll("a").forEach(link =>
      link.addEventListener("click", closeMenu)
    );
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/match.js"></script>
</body>
</html>
