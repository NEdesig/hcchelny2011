

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#000056">
  <meta name="description" content="Информация о матче хоккейного клуба Челны 2011">

  <title>Матч — ХК Челны 2011</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .match-page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 80px;
    }

    .match-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      color: var(--gold, #ffcd00);
      text-decoration: none;
      font-weight: 600;
    }

    .match-hero {
      padding: 36px;
      background: var(--primary, #000056);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      color: white;
    }

    .match-competition {
      text-align: center;
      color: var(--gold, #ffcd00);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 28px;
    }

    .match-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }

    .match-club {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      min-width: 0;
    }

    .match-club-logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
    }

    .match-club-name {
      font-size: 21px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .match-score {
      font-size: clamp(38px, 7vw, 68px);
      font-weight: 900;
      white-space: nowrap;
    }

    .match-vs {
      font-size: 28px;
      font-weight: 800;
      color: var(--gold, #ffcd00);
    }

    .match-status {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #c5cce0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .match-status.live {
      color: #ff5c5c;
    }

    .match-meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-top: 18px;
      color: #c5cce0;
      font-size: 14px;
      text-align: center;
    }

    .match-section {
      margin-top: 42px;
    }

    .match-section-title {
      font-size: 23px;
      margin: 0 0 20px;
      color: var(--primary, #000056);
    }

    .match-events {
      display: grid;
      gap: 12px;
    }

    .match-event {
      display: grid;
      grid-template-columns: 65px 1fr;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      background: #f3f5fa;
      border-radius: 10px;
    }

    .match-event-time {
      font-weight: 800;
      color: var(--primary, #000056);
    }

    .match-event-info {
      min-width: 0;
    }

    .match-event-player {
      font-weight: 700;
      color: #10182d;
    }

    .match-event-description {
      margin-top: 4px;
      color: #69738b;
      font-size: 13px;
    }

    .match-rosters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .match-roster {
      padding: 22px;
      background: #f3f5fa;
      border-radius: 12px;
    }

    .match-roster h3 {
      margin: 0 0 16px;
      color: var(--primary, #000056);
    }

    .roster-player {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #dce1eb;
      color: #20283b;
      font-size: 14px;
    }

    .roster-number {
      font-weight: 800;
      color: var(--primary, #000056);
    }

    .roster-position {
      color: #778198;
      font-size: 12px;
    }

    .match-loading,
    .match-error,
    .match-empty {
      padding: 24px;
      text-align: center;
      color: #778198;
      background: #f3f5fa;
      border-radius: 12px;
    }

    @media (max-width: 650px) {
      .match-page {
        padding-top: 24px;
      }

      .match-hero {
        padding: 24px 14px;
      }

      .match-main {
        gap: 8px;
      }

      .match-club-logo {
        width: 72px;
        height: 72px;
      }

      .match-club-name {
        font-size: 15px;
      }

      .match-rosters {
        grid-template-columns: 1fr;
      }

      .match-section-title {
        font-size: 20px;
      }

      .match-meta {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img
          id="teamLogo"
          src=""
          alt="Логотип команды"
        >
        <span>
          <strong id="teamName">Челны 2011</strong>
          <small id="teamSubtitle">хоккейный клуб</small>
        </span>
      </a>

      <a href="index.html" class="match-back">
        ← На главную
      </a>
    </div>
  </header>

  <main class="match-page">

    <a href="index.html#matches" class="match-back">
      ← Все матчи
    </a>

    <!-- ОСНОВНАЯ ИНФОРМАЦИЯ -->

    <section class="match-hero">

      <div class="match-competition" id="matchCompetition">
        Загрузка матча
      </div>

      <div class="match-main">

        <div class="match-club">
          <img
            id="homeLogo"
            class="match-club-logo"
            src=""
            alt="Хозяева"
            hidden
          >

          <div
            class="match-club-name"
            id="homeName"
          >
            —
          </div>
        </div>

        <div
          class="match-score"
          id="matchScore"
        >
          — : —
        </div>

        <div class="match-club">
          <img
            id="awayLogo"
            class="match-club-logo"
            src=""
            alt="Гости"
            hidden
          >

          <div
            class="match-club-name"
            id="awayName"
          >
            —
          </div>
        </div>

      </div>

      <div
        class="match-status"
        id="matchStatus"
      >
        Загрузка
      </div>

      <div class="match-meta">
        <span id="matchDate">Дата уточняется</span>
        <span id="matchVenue">Место проведения уточняется</span>
      </div>

    </section>

    <!-- СОБЫТИЯ МАТЧА -->

    <section class="match-section">
      <h2 class="match-section-title">
        События матча
      </h2>

      <div
        class="match-events"
        id="matchEvents"
      >
        <div class="match-loading">
          Загрузка событий...
        </div>
      </div>
    </section>

    <!-- СОСТАВЫ -->

    <section class="match-section">
      <h2 class="match-section-title">
        Составы команд
      </h2>

      <div class="match-rosters">

        <div class="match-roster">
          <h3 id="homeRosterTitle">
            Хозяева
          </h3>

          <div id="homeRoster">
            <div class="match-loading">
              Загрузка состава...
            </div>
          </div>
        </div>

        <div class="match-roster">
          <h3 id="awayRosterTitle">
            Гости
          </h3>

          <div id="awayRoster">
            <div class="match-loading">
              Загрузка состава...
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img
          id="footerLogo"
          src=""
          alt="Логотип ХК Челны 2011"
        >

        <div>
          <strong id="footerTeamName">Челны 2011</strong>
          <p id="footerCity">Набережные Челны</p>
        </div>
      </div>

      <span>
        © <span id="footerYear"></span> ХК Челны 2011
      </span>
    </div>
  </footer>

  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/match.js"></script>

</body>
</html>
