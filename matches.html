<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Матчи — ХК Челны 2011</title>
<link id="favicon" rel="icon" href="logo.svg">

<style>
:root{
--primary:#000056;
--secondary:#0875dc;
--bg:#050b22;
--card:#0d1738;
--text:#fff;
--muted:#aab5d5;
--button:#ffcd00;
--border:#26345f;
--radius:16px;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
padding:18px;
background:linear-gradient(135deg,var(--primary),var(--secondary));
border-radius:0 0 25px 25px;
}

.header{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:55px;
height:55px;
background:white;
border-radius:50%;
object-fit:contain;
}

.club{
font-size:20px;
font-weight:900;
}

.season{
font-size:12px;
opacity:.7;
}

main{
max-width:700px;
margin:auto;
padding:18px 14px 100px;
}

.label{
font-size:11px;
color:var(--muted);
letter-spacing:1.5px;
}

h1{
font-size:30px;
margin:8px 0 18px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:var(--radius);
padding:17px;
margin-bottom:13px;
}

.date{
font-size:11px;
color:var(--muted);
text-transform:uppercase;
}

.teams{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-top:14px;
}

.team{
width:45%;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.team-logo{
width:55px;
height:55px;
object-fit:contain;
margin-bottom:7px;
}

.team-logo.empty{
display:none;
}

.team-name{
font-size:17px;
font-weight:800;
line-height:1.15;
}

.team-city{
font-size:11px;
color:var(--muted);
margin-top:4px;
}

.vs{
font-size:12px;
font-weight:900;
color:var(--muted);
flex-shrink:0;
}

.score{
font-size:29px;
font-weight:900;
text-align:center;
margin-top:14px;
}

.muted{
color:var(--muted);
font-size:13px;
margin-top:7px;
text-align:center;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:var(--card);
border-top:1px solid var(--border);
display:flex;
justify-content:space-around;
align-items:center;
}

.bottom a{
color:var(--muted);
text-decoration:none;
font-size:10px;
text-align:center;
}

.bottom a.active{
color:var(--button);
font-weight:800;
}

.icon{
display:block;
font-size:21px;
margin-bottom:4px;
}

@media(max-width:430px){

.team-logo{
width:48px;
height:48px;
}

.team-name{
font-size:15px;
}

.team-city{
font-size:10px;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<img id="logo" class="logo" src="logo.svg">

<div>

<div class="club" id="siteName">
ХК ЧЕЛНЫ 2011
</div>

<div class="season">
СЕЗОН 2026/27
</div>

</div>

</div>

</header>

<main>

<div class="label">ХК ЧЕЛНЫ 2011</div>

<h1>Матчи</h1>

<div id="matches">
<div class="card">Загрузка...</div>
</div>

</main>

<nav class="bottom">

<a href="index.html">
<span class="icon">⌂</span>
Главная
</a>

<a class="active" href="matches.html">
<span class="icon">🏒</span>
Матчи
</a>

<a href="roster.html">
<span class="icon">👥</span>
Состав
</a>

<a href="standings.html">
<span class="icon">📊</span>
Таблица
</a>

<a href="news.html">
<span class="icon">📰</span>
Новости
</a>

</nav>

<script>

const SUPABASE_URL="https://jxlbojosxaaqnyuzohnw.supabase.co";

const SUPABASE_KEY="sb_publishable_wNNvPktjjKpz3csoDMo3JA_4duyLAzL";

const headers={
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
};

async function getData(table,query=""){

const r=await fetch(
SUPABASE_URL+"/rest/v1/"+table+"?select=*"+query,
{headers}
);

return await r.json();

}

function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}

function dateRu(v){

if(!v)return "";

return new Date(v).toLocaleDateString(
"ru-RU",
{
day:"numeric",
month:"long",
year:"numeric"
}
);

}

async function settings(){

const a=await getData("settings","&limit=1");

if(!a.length)return;

const s=a[0];

const r=document.documentElement.style;

if(s.primary_color)r.setProperty("--primary",s.primary_color);
if(s.secondary_color)r.setProperty("--secondary",s.secondary_color);
if(s.background_color)r.setProperty("--bg",s.background_color);
if(s.card_color)r.setProperty("--card",s.card_color);
if(s.text_color)r.setProperty("--text",s.text_color);
if(s.muted_text_color)r.setProperty("--muted",s.muted_text_color);
if(s.button_color)r.setProperty("--button",s.button_color);
if(s.border_color)r.setProperty("--border",s.border_color);
if(s.border_radius)r.setProperty("--radius",s.border_radius+"px");

if(s.site_name){

document.title=s.site_name+" — Матчи";

document.getElementById("siteName").textContent=
s.site_name;

}

if(s.logo_url)
document.getElementById("logo").src=s.logo_url;

if(s.favicon_url)
document.getElementById("favicon").href=s.favicon_url;

if(s.background_image)
document.body.style.backgroundImage=
`url("${s.background_image}")`;

}


/* =========================
   РЕЕСТР КОМАНД
========================= */

let teams=[];

let teamsMap=new Map();

async function loadTeams(){

try{

const data=await getData(
"teams",
"&order=name.asc"
);

if(!Array.isArray(data)){

teams=[];
teamsMap=new Map();

return;

}

teams=data;

teamsMap=new Map(
teams.map(team=>[
String(team.id),
team
])
);

}catch(error){

console.log("Реестр команд пока недоступен");

teams=[];
teamsMap=new Map();

}

}

function getTeam(id){

if(
id===null ||
id===undefined ||
id===""
){

return null;

}

return teamsMap.get(String(id))||null;

}

function findTeamByName(name){

if(!name)return null;

const search=String(name)
.trim()
.toLowerCase();

return teams.find(team=>
String(team.name||"")
.trim()
.toLowerCase()===search
)||null;

}

function findChelnyTeam(){

return teams.find(team=>
String(team.name||"")
.toLowerCase().includes("челны")
)||null;

}

function teamInfo(team,fallbackName){

if(team){

return {

name:team.name||fallbackName||"Команда",

city:team.city||"",

logo:team.logo_url||""

};

}

return {

name:fallbackName||"Команда",

city:"",

logo:""

};

}

function teamHTML(team){

const logo=team.logo
? `<img class="team-logo" src="${esc(team.logo)}" alt="">`
: "";

return `

<div class="team">

${logo}

<div class="team-name">
${esc(team.name)}
</div>

${
team.city
? `<div class="team-city">${esc(team.city)}</div>`
: ""
}

</div>

`;

}


/* =========================
   МАТЧИ
========================= */

async function load(){

const data=await getData(
"matches",
"&order=date.asc,time.asc"
);

const box=document.getElementById("matches");

if(!data.length){

box.innerHTML=
'<div class="card">Матчей пока нет</div>';

return;

}

box.innerHTML=data.map(m=>{

let team1;
let team2;


/*
  Новый вариант:
  home_team_id / away_team_id
*/

const homeTeam=
getTeam(m.home_team_id);

const awayTeam=
getTeam(m.away_team_id);

if(homeTeam || awayTeam){

team1=teamInfo(
homeTeam,
"ХК Челны"
);

team2=teamInfo(
awayTeam,
m.opponent||"Соперник"
);

}else{

/*
  Совместимость со старой структурой
*/

const home=
m.home===true ||
String(m.home).toLowerCase()==="true";

if(home){

team1=teamInfo(
findChelnyTeam(),
"ХК Челны"
);

team2=teamInfo(
findTeamByName(m.opponent),
m.opponent||"Соперник"
);

}else{

team1=teamInfo(
findTeamByName(m.opponent),
m.opponent||"Соперник"
);

team2=teamInfo(
findChelnyTeam(),
"ХК Челны"
);

}

}

let score="— : —";

if(
m.score!==null &&
m.score!==undefined &&
m.score!==""
){

score=m.score;

}else if(
m.home_score!==null &&
m.home_score!==undefined &&
m.away_score!==null &&
m.away_score!==undefined
){

score=
m.home_score+
" : "+
m.away_score;

}

return `

<div class="card">

<div class="date">

${esc(dateRu(m.date))}

${m.time?" · "+esc(m.time):""}

</div>

<div class="teams">

${teamHTML(team1)}

<div class="vs">
VS
</div>

${teamHTML(team2)}

</div>

<div class="score">
${esc(score)}
</div>

${
m.tournament
? `<div class="muted">${esc(m.tournament)}</div>`
: ""
}

${
m.status
? `<div class="muted">${esc(m.status)}</div>`
: ""
}

${
m.venue
? `<div class="muted">${esc(m.venue)}</div>`
: ""
}

</div>

`;

}).join("");

}


async function init(){

await settings();

await loadTeams();

await load();

}

init();

</script>

</body>
</html>
