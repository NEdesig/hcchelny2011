
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Матчи — ХК Челны 2011</title>
<link id="favicon" rel="icon" href="logo.svg">

<style>
:root{
--primary:#000056;
--secondary:#0875dc;
--bg:#050b22;
--card:#0d1738;
--text:#fff;
--muted:#aab5d5;
--button:#ffcd00;
--border:#26345f;
--radius:16px;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
padding:18px;
background:linear-gradient(135deg,var(--primary),var(--secondary));
border-radius:0 0 25px 25px;
}

.header{display:flex;align-items:center;gap:12px}

.logo{
width:55px;
height:55px;
background:white;
border-radius:50%;
object-fit:contain;
}

.club{font-size:20px;font-weight:900}
.season{font-size:12px;opacity:.7}

main{
max-width:700px;
margin:auto;
padding:18px 14px 100px;
}

.label{
font-size:11px;
color:var(--muted);
letter-spacing:1.5px;
}

h1{font-size:30px;margin:8px 0 18px}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:var(--radius);
padding:17px;
margin-bottom:13px;
}

.date{
font-size:11px;
color:var(--muted);
text-transform:uppercase;
}

.teams{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-top:14px;
}

.team{
width:45%;
min-width:0;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.team-logo{
width:55px;
height:55px;
object-fit:contain;
margin-bottom:7px;
}

.team-name{
font-size:17px;
font-weight:800;
line-height:1.2;
overflow-wrap:anywhere;
}

.team-city{
font-size:11px;
color:var(--muted);
margin-top:4px;
}

.vs{
font-size:12px;
font-weight:900;
color:var(--muted);
flex-shrink:0;
}

.score{
font-size:29px;
font-weight:900;
text-align:center;
margin-top:14px;
}

.muted{
color:var(--muted);
font-size:13px;
margin-top:7px;
text-align:center;
}

.message{
text-align:center;
color:var(--muted);
padding:20px 10px;
line-height:1.5;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:var(--card);
border-top:1px solid var(--border);
display:flex;
justify-content:space-around;
align-items:center;
z-index:10;
}

.bottom a{
color:var(--muted);
text-decoration:none;
font-size:10px;
text-align:center;
}

.bottom a.active{
color:var(--button);
font-weight:800;
}

.icon{
display:block;
font-size:21px;
margin-bottom:4px;
}

@media(max-width:430px){
.team-logo{width:48px;height:48px}
.team-name{font-size:15px}
.team-city{font-size:10px}
}
</style>
</head>

<body>

<header>
  <div class="header">
    <img id="logo" class="logo" src="logo.svg" alt="Логотип клуба">
    <div>
      <div class="club" id="siteName">ХК ЧЕЛНЫ 2011</div>
      <div class="season">СЕЗОН 2026/27</div>
    </div>
  </div>
</header>

<main>
  <div class="label">ХК ЧЕЛНЫ 2011</div>
  <h1>Матчи</h1>
  <div id="matches">
    <div class="card message">Загрузка матчей...</div>
  </div>
</main>

<nav class="bottom">
  <a href="index.html">
    <span class="icon">⌂</span>
    Главная
  </a>
  <a class="active" href="matches.html">
    <span class="icon">🏒</span>
    Матчи
  </a>
  <a href="roster.html">
    <span class="icon">👥</span>
    Состав
  </a>
  <a href="standings.html">
    <span class="icon">📊</span>
    Таблица
  </a>
  <a href="news.html">
    <span class="icon">📰</span>
    Новости
  </a>
</nav>

<script>
const SUPABASE_URL = "https://jxlbojosxaaqnyuzohnw.supabase.co";
const SUPABASE_KEY = "sb_publishable_wNNvPktjjKpz3csoDMo3JA_4duyLAzL";

const headers = {
  apikey: SUPABASE_KEY,
  Authorization: "Bearer " + SUPABASE_KEY
};

let teams = [];
let teamsMap = new Map();

async function getData(table, query = "") {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}?select=*${query}`,
    { headers }
  );

  if (!response.ok) {
    const message = await response.text();
    throw new Error(message || `Ошибка загрузки ${table}`);
  }

  return await response.json();
}

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function dateRu(value) {
  if (!value) return "";

  const date = new Date(value + (value.length === 10 ? "T12:00:00" : ""));

  if (Number.isNaN(date.getTime())) return value;

  return date.toLocaleDateString("ru-RU", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

async function settings() {
  try {
    const data = await getData("settings", "&limit=1");
    if (!data.length) return;

    const s = data[0];
    const root = document.documentElement.style;

    if (s.primary_color) root.setProperty("--primary", s.primary_color);
    if (s.secondary_color) root.setProperty("--secondary", s.secondary_color);
    if (s.background_color) root.setProperty("--bg", s.background_color);
    if (s.card_color) root.setProperty("--card", s.card_color);
    if (s.text_color) root.setProperty("--text", s.text_color);
    if (s.muted_text_color) root.setProperty("--muted", s.muted_text_color);
    if (s.button_color) root.setProperty("--button", s.button_color);
    if (s.border_color) root.setProperty("--border", s.border_color);

    if (s.border_radius !== null && s.border_radius !== undefined) {
      root.setProperty("--radius", Number(s.border_radius) + "px");
    }

    if (s.site_name) {
      document.title = s.site_name + " — Матчи";
      document.getElementById("siteName").textContent = s.site_name;
    }

    if (s.logo_url) {
      document.getElementById("logo").src = s.logo_url;
    }

    if (s.favicon_url) {
      document.getElementById("favicon").href = s.favicon_url;
    }

    if (s.background_image) {
      document.body.style.backgroundImage = `url("${s.background_image}")`;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundAttachment = "fixed";
    }
  } catch (error) {
    console.error("Не удалось загрузить настройки:", error);
  }
}

/* РЕЕСТР КОМАНД */

async function loadTeams() {
  try {
    const data = await getData("teams", "&order=name.asc");
    teams = Array.isArray(data) ? data : [];
    teamsMap = new Map(teams.map(team => [String(team.id), team]));
  } catch (error) {
    console.error("Не удалось загрузить реестр команд:", error);
    teams = [];
    teamsMap = new Map();
  }
}

function getTeam(id) {
  if (id === null || id === undefined || id === "") return null;
  return teamsMap.get(String(id)) || null;
}

function findTeamByName(name) {
  if (!name) return null;

  const normalized = String(name).trim().toLowerCase();

  return teams.find(team =>
    String(team.name || "").trim().toLowerCase() === normalized
  ) || null;
}

function findChelnyTeam() {
  return teams.find(team =>
    String(team.name || "").toLowerCase().includes("челны")
  ) || null;
}

function teamInfo(team, fallbackName) {
  return {
    name: team?.name || fallbackName || "Команда",
    city: team?.city || "",
    logo: team?.logo_url || ""
  };
}

function teamHTML(team) {
  const logo = team.logo
    ? `<img class="team-logo" src="${esc(team.logo)}" alt=""
         onerror="this.remove()">`
    : "";

  return `
    <div class="team">
      ${logo}
      <div class="team-name">${esc(team.name)}</div>
      ${team.city ? `<div class="team-city">${esc(team.city)}</div>` : ""}
    </div>
  `;
}

/* МАТЧИ */

async function load() {
  const box = document.getElementById("matches");

  try {
    const data = await getData("matches", "&order=date.asc,time.asc");

    if (!Array.isArray(data) || !data.length) {
      box.innerHTML = '<div class="card message">Матчей пока нет.</div>';
      return;
    }

    box.innerHTML = data.map(match => {
      let team1;
      let team2;

      const homeTeam = getTeam(match.home_team_id);
      const awayTeam = getTeam(match.away_team_id);

      if (match.home_team_id || match.away_team_id) {
        team1 = teamInfo(homeTeam, "ХК Челны");
        team2 = teamInfo(awayTeam, match.opponent || "Соперник");
      } else {
        const home =
          match.home === true ||
          String(match.home).toLowerCase() === "true";

        if (home) {
          team1 = teamInfo(findChelnyTeam(), "ХК Челны");
          team2 = teamInfo(findTeamByName(match.opponent), match.opponent || "Соперник");
        } else {
          team1 = teamInfo(findTeamByName(match.opponent), match.opponent || "Соперник");
          team2 = teamInfo(findChelnyTeam(), "ХК Челны");
        }
      }

      let score = "— : —";

      const hasHomeScore =
        match.home_score !== null &&
        match.home_score !== undefined &&
        match.home_score !== "";

      const hasAwayScore =
        match.away_score !== null &&
        match.away_score !== undefined &&
        match.away_score !== "";

      if (hasHomeScore && hasAwayScore) {
        score = `${match.home_score} : ${match.away_score}`;
      } else if (
        match.score !== null &&
        match.score !== undefined &&
        match.score !== ""
      ) {
        score = match.score;
      }

      return `
        <div class="card">
          <div class="date">
            ${esc(dateRu(match.date))}
            ${match.time ? " · " + esc(String(match.time).slice(0, 5)) : ""}
          </div>

          <div class="teams">
            ${teamHTML(team1)}
            <div class="vs">VS</div>
            ${teamHTML(team2)}
          </div>

          <div class="score">${esc(score)}</div>

          ${match.tournament ? `<div class="muted">${esc(match.tournament)}</div>` : ""}
          ${match.status ? `<div class="muted">${esc(match.status)}</div>` : ""}
          ${match.venue ? `<div class="muted">${esc(match.venue)}</div>` : ""}
        </div>
      `;
    }).join("");

  } catch (error) {
    console.error("Ошибка загрузки матчей:", error);
    box.innerHTML = `
      <div class="card message">
        Не удалось загрузить матчи.<br>
        Попробуй обновить страницу позже.
      </div>
    `;
  }
}

async function init() {
  await settings();
  await loadTeams();
  await load();
}

init();
</script>

</body>
</html>
