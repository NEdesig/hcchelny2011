<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000056">

    <title>Новости — ХК Челны 2011</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f5f7fb;
            color: #111827;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 72px;

            display: flex;
            align-items: center;

            padding: 0 18px;

            background: #000056;
            color: #fff;

            box-shadow: 0 4px 20px rgba(0,0,86,.16);
        }

        .header-left {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        .back-button {
            width: 40px;
            height: 40px;

            flex: 0 0 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(255,255,255,.12);
            color: #fff;

            font-size: 23px;

            transition: .2s ease;
        }

        .back-button:active {
            transform: scale(.92);
        }

        .header-logo {
            width: 42px;
            height: 42px;

            object-fit: contain;

            border-radius: 10px;
        }

        .header-title {
            min-width: 0;
        }

        .header-title h1 {
            margin: 0;

            font-size: 18px;
            line-height: 1.1;

            font-weight: 900;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-title span {
            display: block;

            margin-top: 3px;

            font-size: 10px;
            font-weight: 700;

            color: rgba(255,255,255,.65);

            letter-spacing: .08em;
            text-transform: uppercase;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 900px;

            margin: 0 auto;

            padding: 20px 14px 50px;
        }

        .page-heading {
            margin-bottom: 18px;
        }

        .page-heading h2 {
            margin: 0;

            font-size: 30px;
            line-height: 1.05;

            font-weight: 950;
            letter-spacing: -.04em;
        }

        .page-heading p {
            margin: 7px 0 0;

            color: #70798a;

            font-size: 13px;
            line-height: 1.4;
        }

        /* =========================
           FILTERS
        ========================= */

        .filters {
            display: flex;
            gap: 8px;

            overflow-x: auto;

            padding-bottom: 3px;
            margin-bottom: 20px;

            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .filter-button {
            flex: 0 0 auto;

            padding: 10px 15px;

            border-radius: 12px;

            background: #fff;
            color: #626b7b;

            font-size: 11px;
            font-weight: 900;

            box-shadow:
                0 2px 8px rgba(0,0,0,.05);

            transition: .2s ease;
        }

        .filter-button.active {
            background: #000056;
            color: #fff;
        }

        .filter-button:active {
            transform: scale(.96);
        }

        /* =========================
           NEWS LIST
        ========================= */

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .news-card {
            overflow: hidden;

            background: #fff;

            border-radius: 20px;

            border: 1px solid rgba(0,0,86,.05);

            box-shadow:
                0 5px 20px rgba(15,23,42,.06);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .news-card:active {
            transform: scale(.985);
        }

        .news-image-wrap {
            position: relative;

            width: 100%;
            aspect-ratio: 16 / 9;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #000056,
                    #0875dc
                );
        }

        .news-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .news-image-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(255,255,255,.8);

            font-size: 42px;
        }

        .news-tag {
            position: absolute;
            left: 12px;
            bottom: 12px;

            padding: 6px 9px;

            border-radius: 8px;

            background: #ffcd00;
            color: #000056;

            font-size: 9px;
            font-weight: 950;

            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .news-content {
            padding: 15px 15px 16px;
        }

        .news-meta {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 7px;

            color: #9299a7;

            font-size: 9px;
            font-weight: 800;
        }

        .news-meta-dot {
            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #b7bdc8;
        }

        .news-title {
            margin: 0;

            color: #151b28;

            font-size: 18px;
            line-height: 1.15;

            font-weight: 950;

            letter-spacing: -.025em;
        }

        .news-description {
            margin: 8px 0 0;

            color: #687181;

            font-size: 12px;
            line-height: 1.5;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 13px;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            color: #0875dc;

            font-size: 10px;
            font-weight: 900;
        }

        .read-arrow {
            font-size: 14px;
        }

        /* =========================
           FEATURED
        ========================= */

        .featured {
            position: relative;

            overflow: hidden;

            min-height: 310px;

            margin-bottom: 18px;

            border-radius: 22px;

            background: #000056;

            box-shadow:
                0 9px 28px rgba(0,0,86,.18);

            cursor: pointer;
        }

        .featured-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .featured-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0,0,25,.94) 0%,
                    rgba(0,0,25,.55) 42%,
                    rgba(0,0,25,.05) 100%
                );
        }

        .featured-content {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;

            padding: 20px;
        }

        .featured-tag {
            display: inline-flex;

            padding: 6px 9px;

            border-radius: 7px;

            background: #ffcd00;
            color: #000056;

            font-size: 9px;
            font-weight: 950;

            text-transform: uppercase;
        }

        .featured-title {
            margin: 9px 0 0;

            color: #fff;

            font-size: 24px;
            line-height: 1.05;

            font-weight: 950;

            letter-spacing: -.04em;
        }

        .featured-description {
            margin: 8px 0 0;

            max-width: 600px;

            color: rgba(255,255,255,.75);

            font-size: 11px;
            line-height: 1.45;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .featured-meta {
            margin-top: 10px;

            color: rgba(255,255,255,.55);

            font-size: 9px;
            font-weight: 700;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            padding: 45px 20px;

            text-align: center;

            background: #fff;

            border-radius: 20px;

            color: #838b9a;

            box-shadow:
                0 4px 18px rgba(15,23,42,.04);
        }

        .empty-icon {
            font-size: 36px;

            margin-bottom: 8px;
        }

        .empty-title {
            color: #303847;

            font-size: 15px;
            font-weight: 900;
        }

        .empty-text {
            margin-top: 5px;

            font-size: 11px;
            line-height: 1.45;
        }

        /* =========================
           LOADER
        ========================= */

        .loader-wrap {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 65px 0;
        }

        .loader {
            width: 32px;
            height: 32px;

            border: 3px solid #dfe4ed;
            border-top-color: #000056;

            border-radius: 50%;

            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           ARTICLE MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;

            z-index: 1000;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            background: rgba(0,0,30,.58);

            opacity: 0;
            pointer-events: none;

            transition: .25s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-window {
            width: 100%;
            max-width: 800px;

            max-height: 94vh;

            overflow-y: auto;

            background: #f5f7fb;

            border-radius: 26px 26px 0 0;

            transform: translateY(30px);

            transition: .25s ease;
        }

        .modal.active .modal-window {
            transform: translateY(0);
        }

        .modal-header {
            position: sticky;
            top: 0;
            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px 16px;

            background: #000056;

            color: #fff;
        }

        .modal-header-title {
            font-size: 15px;
            font-weight: 900;
        }

        .modal-close {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: rgba(255,255,255,.12);
            color: #fff;

            font-size: 20px;
        }

        .article-image {
            width: 100%;
            max-height: 420px;

            object-fit: cover;

            display: block;
        }

        .article-content {
            padding: 20px 16px 40px;
        }

        .article-tag {
            display: inline-flex;

            padding: 6px 9px;

            border-radius: 7px;

            background: #ffcd00;
            color: #000056;

            font-size: 9px;
            font-weight: 950;

            text-transform: uppercase;
        }

        .article-title {
            margin: 10px 0 0;

            font-size: 27px;
            line-height: 1.08;

            font-weight: 950;

            letter-spacing: -.04em;

            color: #111827;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-top: 10px;

            color: #858d9c;

            font-size: 10px;
            font-weight: 700;
        }

        .article-text {
            margin-top: 20px;

            color: #3e4757;

            font-size: 14px;
            line-height: 1.7;

            white-space: pre-line;
        }

        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .header {
                padding: 0 28px;
            }

            main {
                padding: 32px 20px 60px;
            }

            .news-list {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }

            .news-card:first-child {
                grid-column: 1 / -1;
            }

            .news-card:first-child .news-image-wrap {
                aspect-ratio: 2.4 / 1;
            }

            .modal {
                align-items: center;
                padding: 20px;
            }

            .modal-window {
                border-radius: 26px;
                max-height: 90vh;
            }

            .news-card:hover {
                transform: translateY(-2px);

                box-shadow:
                    0 10px 30px rgba(15,23,42,.09);
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="header-left">

        <button
            class="back-button"
            onclick="goBack()"
            aria-label="Назад"
        >
            ‹
        </button>

        <img
            id="headerLogo"
            class="header-logo"
            src=""
            alt=""
        >

        <div class="header-title">

            <h1 id="headerTeamName">
                ХК Челны 2011
            </h1>

            <span id="headerSeason">
                Сезон 2026/27
            </span>

        </div>

    </div>

</header>


<main>

    <div class="page-heading">

        <h2>
            Новости
        </h2>

        <p>
            Последние события команды,
            матчи и важные новости.
        </p>

    </div>


    <div
        class="filters"
        id="filters"
    >

        <button
            class="filter-button active"
            data-filter="all"
            onclick="setFilter('all')"
        >
            Все
        </button>

    </div>


    <div id="content">

        <div class="loader-wrap">
            <div class="loader"></div>
        </div>

    </div>

</main>


<!-- =========================
     ARTICLE MODAL
========================= -->

<div
    class="modal"
    id="newsModal"
    onclick="closeModalOutside(event)"
>

    <div class="modal-window">

        <div class="modal-header">

            <div class="modal-header-title">
                Новость
            </div>

            <button
                class="modal-close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div id="articleContent"></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
    "https://jxlbojosxaaqnyuzohnw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wNNvPktjjKpz3csoDMo3JA_4duyLAzL";

const STORAGE_BUCKET =
    "site-media";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   STATE
========================================================= */

let news = [];

let currentFilter = "all";

let currentNews = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function publicImage(url) {

    if (!url) {
        return "";
    }

    if (
        url.startsWith("http://") ||
        url.startsWith("https://")
    ) {
        return url;
    }

    const cleanPath =
        url
            .replace(/^\/+/, "")
            .replace(/^site-media\//, "");

    return (
        `${SUPABASE_URL}` +
        `/storage/v1/object/public/` +
        `${STORAGE_BUCKET}/${cleanPath}`
    );
}


function formatDate(dateValue) {

    if (!dateValue) {
        return "";
    }

    const date =
        new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return dateValue;
    }

    return date.toLocaleDateString(
        "ru-RU",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


function formatTime(dateValue) {

    if (!dateValue) {
        return "";
    }

    const date =
        new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleTimeString(
        "ru-RU",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function getNewsDate(item) {

    return (
        item.published_at ||
        item.created_at ||
        item.date ||
        item.news_date ||
        null
    );
}


function getNewsTitle(item) {

    return (
        item.title ||
        item.name ||
        "Без названия"
    );
}


function getNewsDescription(item) {

    return (
        item.description ||
        item.excerpt ||
        item.short_description ||
        item.text ||
        ""
    );
}


function getNewsText(item) {

    return (
        item.content ||
        item.text ||
        item.body ||
        item.description ||
        ""
    );
}


function getNewsImage(item) {

    return (
        item.image_url ||
        item.photo_url ||
        item.image ||
        item.cover_url ||
        ""
    );
}


function getNewsTag(item) {

    return (
        item.tag ||
        item.category ||
        item.type ||
        "Новости"
    );
}


/* =========================================================
   SETTINGS
========================================================= */

async function loadSettings() {

    try {

        const { data, error } =
            await db
                .from("settings")
                .select("*")
                .limit(1)
                .maybeSingle();

        if (error) {

            console.warn(
                "Ошибка настроек:",
                error
            );

            return;
        }

        if (!data) {
            return;
        }

        const teamName =
            data.team_name ||
            data.name ||
            "ХК Челны 2011";

        const season =
            data.season ||
            "2026/27";


        document
            .getElementById("headerTeamName")
            .textContent = teamName;

        document
            .getElementById("headerSeason")
            .textContent =
                `Сезон ${season}`;


        const logo =
            data.logo_url ||
            data.logo ||
            data.team_logo;

        if (logo) {

            const image =
                document.getElementById(
                    "headerLogo"
                );

            image.src =
                publicImage(logo);

        }


        if (data.font_main) {

            const style =
                document.createElement("style");

            style.textContent = `
                body {
                    font-family:
                        "${data.font_main}",
                        Arial,
                        sans-serif;
                }
            `;

            document.head.appendChild(style);
        }

    } catch (error) {

        console.error(error);
    }
}


/* =========================================================
   LOAD NEWS
========================================================= */

async function loadNews() {

    const { data, error } =
        await db
            .from("news")
            .select("*");

    if (error) {

        console.error(
            "Ошибка загрузки новостей:",
            error
        );

        document
            .getElementById("content")
            .innerHTML = `
                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <div class="empty-title">
                        Не удалось загрузить новости
                    </div>

                    <div class="empty-text">
                        Проверьте подключение
                        к Supabase.
                    </div>

                </div>
            `;

        return;
    }

    news = data || [];


    news.sort(
        (a, b) => {

            const dateA =
                new Date(
                    getNewsDate(a) || 0
                ).getTime();

            const dateB =
                new Date(
                    getNewsDate(b) || 0
                ).getTime();

            return dateB - dateA;
        }
    );


    buildFilters();

    render();
}


/* =========================================================
   FILTERS
========================================================= */

function buildFilters() {

    const filters =
        document.getElementById(
            "filters"
        );


    const categories = [];

    news.forEach(item => {

        const tag =
            getNewsTag(item);

        if (
            tag &&
            !categories.includes(tag)
        ) {
            categories.push(tag);
        }

    });


    let html = `
        <button
            class="filter-button active"
            data-filter="all"
            onclick="setFilter('all')"
        >
            Все
        </button>
    `;


    categories.forEach(category => {

        html += `
            <button
                class="filter-button"
                data-filter="${escapeHtml(category)}"
                onclick="setFilter('${escapeHtml(category)}')"
            >
                ${escapeHtml(category)}
            </button>
        `;

    });


    filters.innerHTML = html;
}


function setFilter(filter) {

    currentFilter = filter;


    document
        .querySelectorAll(".filter-button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.filter === filter
            );

        });


    render();
}


/* =========================================================
   FILTER NEWS
========================================================= */

function getFilteredNews() {

    if (currentFilter === "all") {
        return news;
    }

    return news.filter(
        item =>
            getNewsTag(item) ===
            currentFilter
    );
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    const container =
        document.getElementById(
            "content"
        );

    const filtered =
        getFilteredNews();


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    📰
                </div>

                <div class="empty-title">
                    Новостей пока нет
                </div>

                <div class="empty-text">
                    Новости появятся здесь
                    после публикации через админ-панель.
                </div>

            </div>
        `;

        return;
    }


    const featured =
        filtered[0];

    const rest =
        filtered.slice(1);


    let html = "";


    html += renderFeatured(
        featured
    );


    if (rest.length > 0) {

        html += `
            <div class="news-list">
                ${
                    rest
                        .map(renderNewsCard)
                        .join("")
                }
            </div>
        `;

    }


    container.innerHTML = html;
}


/* =========================================================
   FEATURED NEWS
========================================================= */

function renderFeatured(item) {

    const title =
        getNewsTitle(item);

    const description =
        getNewsDescription(item);

    const image =
        getNewsImage(item);

    const tag =
        getNewsTag(item);

    const date =
        getNewsDate(item);


    const imageHtml =
        image
            ? `
                <img
                    class="featured-image"
                    src="${escapeHtml(
                        publicImage(image)
                    )}"
                    alt=""
                    onerror="this.style.display='none'"
                >
            `
            : "";


    return `
        <article
            class="featured"
            onclick="openNews(${Number(item.id)})"
        >

            ${imageHtml}

            <div class="featured-overlay"></div>

            <div class="featured-content">

                <span class="featured-tag">
                    ${escapeHtml(tag)}
                </span>

                <h3 class="featured-title">
                    ${escapeHtml(title)}
                </h3>

                ${
                    description
                        ? `
                            <div class="featured-description">
                                ${escapeHtml(
                                    description
                                )}
                            </div>
                        `
                        : ""
                }

                <div class="featured-meta">

                    ${escapeHtml(
                        formatDate(date)
                    )}

                    ${
                        formatTime(date)
                            ? `
                                ·
                                ${escapeHtml(
                                    formatTime(date)
                                )}
                            `
                            : ""
                    }

                </div>

            </div>

        </article>
    `;
}


/* =========================================================
   NEWS CARD
========================================================= */

function renderNewsCard(item) {

    const title =
        getNewsTitle(item);

    const description =
        getNewsDescription(item);

    const image =
        getNewsImage(item);

    const tag =
        getNewsTag(item);

    const date =
        getNewsDate(item);


    const imageHtml =
        image
            ? `
                <img
                    class="news-image"
                    src="${escapeHtml(
                        publicImage(image)
                    )}"
                    alt=""
                    loading="lazy"
                    onerror="this.style.display='none'"
                >
            `
            : `
                <div class="news-image-placeholder">
                    🏒
                </div>
            `;


    return `
        <article
            class="news-card"
            onclick="openNews(${Number(item.id)})"
        >

            <div class="news-image-wrap">

                ${imageHtml}

                <div class="news-tag">
                    ${escapeHtml(tag)}
                </div>

            </div>


            <div class="news-content">

                <div class="news-meta">

                    <span>
                        ${escapeHtml(
                            formatDate(date)
                        )}
                    </span>

                    ${
                        formatTime(date)
                            ? `
                                <span class="news-meta-dot"></span>

                                <span>
                                    ${escapeHtml(
                                        formatTime(date)
                                    )}
                                </span>
                            `
                            : ""
                    }

                </div>


                <h3 class="news-title">
                    ${escapeHtml(title)}
                </h3>


                ${
                    description
                        ? `
                            <div class="news-description">
                                ${escapeHtml(
                                    description
                                )}
                            </div>
                        `
                        : ""
                }


                <div class="news-footer">

                    <div class="read-more">

                        Читать новость

                        <span class="read-arrow">
                            →
                        </span>

                    </div>

                </div>

            </div>

        </article>
    `;
}


/* =========================================================
   OPEN NEWS
========================================================= */

function openNews(id) {

    const item =
        news.find(
            newsItem =>
                Number(newsItem.id) ===
                Number(id)
        );

    if (!item) {
        return;
    }


    currentNews = item;


    const title =
        getNewsTitle(item);

    const image =
        getNewsImage(item);

    const tag =
        getNewsTag(item);

    const date =
        getNewsDate(item);

    const text =
        getNewsText(item);


    const imageHtml =
        image
            ? `
                <img
                    class="article-image"
                    src="${escapeHtml(
                        publicImage(image)
                    )}"
                    alt=""
                >
            `
            : "";


    document
        .getElementById(
            "articleContent"
        )
        .innerHTML = `

            ${imageHtml}

            <div class="article-content">

                <span class="article-tag">
                    ${escapeHtml(tag)}
                </span>


                <h1 class="article-title">
                    ${escapeHtml(title)}
                </h1>


                <div class="article-meta">

                    <span>
                        ${escapeHtml(
                            formatDate(date)
                        )}
                    </span>

                    ${
                        formatTime(date)
                            ? `
                                <span>•</span>

                                <span>
                                    ${escapeHtml(
                                        formatTime(date)
                                    )}
                                </span>
                            `
                            : ""
                    }

                </div>


                <div class="article-text">
                    ${escapeHtml(text)}
                </div>

            </div>

        `;


    document
        .getElementById("newsModal")
        .classList.add("active");


    document.body.style.overflow =
        "hidden";
}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

    document
        .getElementById("newsModal")
        .classList.remove("active");

    document.body.style.overflow =
        "";

    currentNews = null;
}


function closeModalOutside(event) {

    if (
        event.target.id ===
        "newsModal"
    ) {

        closeModal();
    }
}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    if (
        window.history.length > 1
    ) {

        window.history.back();

        return;
    }

    window.location.href =
        "index.html";
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModal();
        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function init() {

    await loadSettings();

    await loadNews();
}


init();


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
    async () => {

        await loadNews();

    },
    60000
);

</script>

</body>
</html>
