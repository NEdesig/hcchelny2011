<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000056"
    >

    <title>Новости — ХК Челны 2011</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="index.html"
                class="header-back"
                aria-label="На главную"
            >
                ‹
            </a>

            <img
                id="siteLogo"
                class="header-logo"
                src=""
                alt="ХК Челны 2011"
            >

            <div class="header-brand">

                <div
                    id="siteTitle"
                    class="header-brand-title"
                >
                    ХК Челны 2011
                </div>

                <div
                    id="siteSubtitle"
                    class="header-brand-subtitle"
                >
                    Набережные Челны
                </div>

            </div>

            <div class="header-spacer"></div>

        </div>

    </header>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <main class="container">

        <section class="section">

            <div class="section-header">

                <div>

                    <h1 class="section-title">
                        Новости
                    </h1>

                    <div class="section-subtitle">
                        Последние события команды
                    </div>

                </div>

            </div>


            <!-- =================================================
                 NEWS FILTERS
            ================================================== -->

            <div
                id="newsFilters"
                class="tabs news-tabs"
            >

                <button
                    type="button"
                    class="tab-button active"
                    data-filter="all"
                >
                    Все
                </button>

                <button
                    type="button"
                    class="tab-button"
                    data-filter="Матч"
                >
                    Матчи
                </button>

                <button
                    type="button"
                    class="tab-button"
                    data-filter="Команда"
                >
                    Команда
                </button>

                <button
                    type="button"
                    class="tab-button"
                    data-filter="Другое"
                >
                    Другое
                </button>

            </div>


            <!-- =================================================
                 NEWS GRID
            ================================================== -->

            <div
                id="newsGrid"
                class="news-grid"
            >

                <div class="loading-state">
                    Загрузка новостей…
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         NEWS MODAL
    ====================================================== -->

    <div
        id="newsModal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div
            class="modal-backdrop"
            data-close-modal
        ></div>

        <div class="modal-dialog">

            <button
                type="button"
                class="modal-close"
                data-close-modal
                aria-label="Закрыть"
            >
                ×
            </button>

            <div
                id="newsModalContent"
                class="modal-content"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         BOTTOM NAV
    ====================================================== -->

    <nav class="bottom-nav">

        <div class="bottom-nav-inner">

            <a
                href="index.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ⌂
                </span>

                <span>
                    Главная
                </span>
            </a>


            <a
                href="matches.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ⚔
                </span>

                <span>
                    Матчи
                </span>
            </a>


            <a
                href="roster.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ◎
                </span>

                <span>
                    Состав
                </span>
            </a>


            <a
                href="standings.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ≡
                </span>

                <span>
                    Таблица
                </span>
            </a>


            <a
                href="news.html"
                class="bottom-nav-item active"
            >
                <span class="bottom-nav-icon">
                    ◈
                </span>

                <span>
                    Новости
                </span>
            </a>

        </div>

    </nav>

</div>


<!-- =====================================================
     SCRIPTS
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="app.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        if (
            typeof initializeSite ===
            "function"
        ) {
            await initializeSite();
        }

        if (
            typeof initNewsPage ===
            "function"
        ) {
            await initNewsPage();
        }

    }
);

</script>

</body>
</html>
