<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогноз матча — ХК Челны 2011</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050b25;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.back {
    display: inline-block;
    color: #ffcd00;
    text-decoration: none;
    margin-bottom: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.card {
    background: #0c1640;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    border: 1px solid #1c2b65;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #172354;
    color: white;
    font-size: 16px;
    outline: none;
}

.teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    text-align: center;
    margin: 20px 0;
}

.team {
    flex: 1;
    font-size: 18px;
    font-weight: bold;
}

.vs {
    color: #ffcd00;
    font-weight: bold;
}

.score {
    display: flex;
    align-items: center;
    gap: 10px;
}

.score input {
    text-align: center;
}

.score span {
    font-size: 22px;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.option {
    background: #172354;
    border: 2px solid transparent;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
}

.option.active {
    border-color: #ffcd00;
    background: #202f68;
}

button {
    width: 100%;
    border: none;
    background: #ffcd00;
    color: #050b25;
    padding: 15px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.result {
    display: none;
    margin-top: 18px;
    padding: 18px;
    background: #101d4c;
    border-radius: 14px;
    text-align: center;
}

@media(max-width:500px) {
    .teams {
        gap: 8px;
    }

    .team {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">← На главную</a>

<h1>🏒 Прогноз матча</h1>

<div class="card">
    <label>Выберите матч</label>

    <select id="match">
        <option value="chelny-akbars">
            ХК Челны 2011 — Ак Барс 2011
        </option>

        <option value="chelny-neft">
            ХК Челны 2011 — Нефтяник 2011
        </option>

        <option value="chelny-izstal">
            ХК Челны 2011 — Ижсталь 2011
        </option>
    </select>

    <div class="teams">
        <div class="team" id="homeTeam">ХК Челны 2011</div>
        <div class="vs">VS</div>
        <div class="team" id="awayTeam">Ак Барс 2011</div>
    </div>
</div>

<div class="card">

    <label>Кто победит?</label>

    <div class="options">
        <div class="option" onclick="chooseWinner(this, 'home')">
            🏒 ХК Челны 2011
        </div>

        <div class="option" onclick="chooseWinner(this, 'away')">
            🏒 Соперник
        </div>
    </div>

</div>

<div class="card">

    <label>Счёт матча</label>

    <div class="score">
        <input type="number" id="homeScore" min="0" max="99" placeholder="0">
        <span>:</span>
        <input type="number" id="awayScore" min="0" max="99" placeholder="0">
    </div>

</div>

<div class="card">

    <label>Кто забьёт за ХК Челны 2011?</label>

    <select id="scorer">

        <option value="">Выберите игрока</option>

        <option>Амир Шарифуллин #26</option>
        <option>Саид Хузин #5</option>
        <option>Данис Шарифуллин #11</option>
        <option>Амир Норов #18</option>
        <option>Альберт Осипов #90</option>
        <option>Кирилл Большуновский #81</option>

    </select>

</div>

<button onclick="makePrediction()">
    Сделать прогноз
</button>

<div class="result" id="result"></div>

</div>

<script>

let winner = "";

const matches = {
    "chelny-akbars": "Ак Барс 2011",
    "chelny-neft": "Нефтяник 2011",
    "chelny-izstal": "Ижсталь 2011"
};

document.getElementById("match").addEventListener("change", function() {
    document.getElementById("awayTeam").textContent = matches[this.value];

    winner = "";

    document.querySelectorAll(".option").forEach(el => {
        el.classList.remove("active");
    });
});

function chooseWinner(element, value) {

    winner = value;

    document.querySelectorAll(".option").forEach(el => {
        el.classList.remove("active");
    });

    element.classList.add("active");
}

function makePrediction() {

    const match = document.getElementById("match");
    const opponent = matches[match.value];

    const homeScore = document.getElementById("homeScore").value;
    const awayScore = document.getElementById("awayScore").value;

    const scorer = document.getElementById("scorer").value;

    if (winner === "") {
        alert("Выберите победителя");
        return;
    }

    if (homeScore === "" || awayScore === "") {
        alert("Укажите счёт");
        return;
    }

    if (scorer === "") {
        alert("Выберите автора гола");
        return;
    }

    const winnerName =
        winner === "home"
        ? "ХК Челны 2011"
        : opponent;

    const result = document.getElementById("result");

    result.style.display = "block";

    result.innerHTML = `
        <h2>Прогноз принят! 🏒</h2>

        <p>
            <b>Матч:</b><br>
            ХК Челны 2011 — ${opponent}
        </p>

        <p>
            <b>Победитель:</b><br>
            ${winnerName}
        </p>

        <p>
            <b>Счёт:</b><br>
            ${homeScore}:${awayScore}
        </p>

        <p>
            <b>Автор гола:</b><br>
            ${scorer}
        </p>
    `;
}

</script>

</body>
</html>
