<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Прогноз матча — ХК Челны 2011</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #16458f 0%, #071a3d 50%, #020817 100%);

    color: white;
    padding: 20px;
}

.page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

.back {
    display: inline-block;
    margin: 10px 0 25px;

    color: white;
    text-decoration: none;
    opacity: .7;

    font-weight: 700;
}

.back:hover {
    opacity: 1;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.label {
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: 900;
    opacity: .55;
}

h1 {
    margin: 8px 0;

    font-size: clamp(34px, 7vw, 58px);
    font-weight: 1000;
}

.subtitle {
    margin: 0;
    opacity: .65;
}


/* МАТЧ */

.match {
    padding: 25px;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 22px;

    text-align: center;

    margin-bottom: 20px;
}

.match-title {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    opacity: .55;
    margin-bottom: 20px;
}

.teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    gap: 15px;
}

.team {
    padding: 20px;

    background: rgba(255,255,255,.06);

    border-radius: 16px;
}

.team-name {
    font-size: clamp(20px, 4vw, 30px);
    font-weight: 1000;
}

.team-sub {
    margin-top: 5px;
    font-size: 12px;
    opacity: .5;
}

.vs {
    font-size: 18px;
    font-weight: 1000;
    opacity: .5;
}


/* БЛОК */

.block {
    padding: 25px;
    margin-bottom: 18px;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 20px;
}

.block-title {
    margin-bottom: 17px;

    font-size: 17px;
    font-weight: 1000;
}


/* ВЫБОР */

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);

    gap: 10px;
}

.option {
    position: relative;
}

.option input {
    position: absolute;
    opacity: 0;
}

.option label {
    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 55px;
    padding: 12px;

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 13px;

    cursor: pointer;

    text-align: center;

    font-weight: 800;

    transition: .2s;
}

.option label:hover {
    background: rgba(255,255,255,.12);
}

.option input:checked + label {
    background: #ffd000;
    color: #061735;

    border-color: #ffd000;

    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(255,208,0,.2);
}


/* СЧЁТ */

.score-inputs {
    display: grid;

    grid-template-columns: 1fr 45px 1fr;

    align-items: center;

    gap: 10px;
}

.score-inputs input {
    width: 100%;

    padding: 18px 10px;

    border: 0;
    border-radius: 13px;

    background: rgba(255,255,255,.1);

    color: white;

    font-size: 28px;

    font-weight: 1000;

    text-align: center;

    outline: none;
}

.score-inputs input:focus {
    box-shadow: 0 0 0 2px #ffd000;
}

.score-separator {
    text-align: center;

    font-size: 25px;
    font-weight: 1000;
}


/* ИГРОКИ */

.players {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 10px;
}

.player-option {
    position: relative;
}

.player-option input {
    position: absolute;
    opacity: 0;
}

.player-option label {
    display: block;

    padding: 15px;

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 13px;

    cursor: pointer;

    transition: .2s;
}

.player-option label:hover {
    background: rgba(255,255,255,.12);
}

.player-option input:checked + label {
    background: #ffd000;
    color: #061735;

    border-color: #ffd000;

    transform: translateY(-2px);
}

.player-number {
    font-size: 12px;
    font-weight: 900;
    opacity: .5;
}

.player-name {
    margin-top: 3px;

    font-size: 16px;
    font-weight: 900;
}


/* ОТПРАВИТЬ */

.submit {
    width: 100%;

    border: 0;

    padding: 18px;

    border-radius: 14px;

    background: #ffd000;
    color: #061735;

    font-size: 16px;
    font-weight: 1000;

    cursor: pointer;

    transition: .2s;
}

.submit:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 30px rgba(255,208,0,.25);
}

.submit:active {
    transform: translateY(1px);
}


/* РЕЗУЛЬТАТ */

.success {
    display: none;

    margin-top: 20px;
    padding: 25px;

    background: rgba(45,190,100,.15);

    border: 1px solid rgba(45,190,100,.3);

    border-radius: 18px;

    text-align: center;
}

.success.show {
    display: block;
}

.success-title {
    font-size: 25px;
    font-weight: 1000;
}

.success-text {
    margin-top: 8px;
    opacity: .7;
}


/* МОБИЛЬНЫЙ */

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    .match,
    .block {
        padding: 18px;
    }

    .teams {
        grid-template-columns: 1fr;
    }

    .vs {
        display: none;
    }

    .options,
    .players {
        grid-template-columns: 1fr;
    }

    .score-inputs {
        grid-template-columns: 1fr 30px 1fr;
    }

}
</style>
</head>


<body>

<div class="page">

    <a href="index.html" class="back">
        ← Вернуться на сайт
    </a>


    <!-- ЗАГОЛОВОК -->

    <div class="header">

        <div class="label">
            ИНТЕРАКТИВ
        </div>

        <h1>
            ПРОГНОЗ МАТЧА
        </h1>

        <p class="subtitle">
            Проверь свою хоккейную интуицию
        </p>

    </div>


    <!-- МАТЧ -->

    <div class="match">

        <div class="match-title">
            БЛИЖАЙШИЙ МАТЧ
        </div>

        <div class="teams">

            <div class="team">

                <div class="team-name">
                    ЧЕЛНЫ 2011
                </div>

                <div class="team-sub">
                    ХК «Челны»
                </div>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="team">

                <div class="team-name" id="opponentName">
                    СОПЕРНИК
                </div>

                <div class="team-sub">
                    Гостевая команда
                </div>

            </div>

        </div>

    </div>


    <!-- ПОБЕДИТЕЛЬ -->

    <div class="block">

        <div class="block-title">
            🏆 Кто выиграет?
        </div>

        <div class="options">

            <div class="option">

                <input
                    type="radio"
                    name="winner"
                    id="winnerHome"
                    value="Челны 2011"
                >

                <label for="winnerHome">
                    🏒 Челны 2011
                </label>

            </div>


            <div class="option">

                <input
                    type="radio"
                    name="winner"
                    id="winnerAway"
                    value="Соперник"
                >

                <label for="winnerAway">
                    🏒 Соперник
                </label>

            </div>

        </div>

    </div>


    <!-- СЧЁТ -->

    <div class="block">

        <div class="block-title">
            🎯 Какой будет счёт?
        </div>

        <div class="score-inputs">

            <input
                type="number"
                id="homeScore"
                min="0"
                max="30"
                placeholder="0"
            >

            <div class="score-separator">
                :
            </div>

            <input
                type="number"
                id="awayScore"
                min="0"
                max="30"
                placeholder="0"
            >

        </div>

    </div>


    <!-- ПЕРВЫЙ ГОЛ -->

    <div class="block">

        <div class="block-title">
            ⚡ Кто забьёт первым?
        </div>

        <div class="players">

            <div class="player-option">

                <input
                    type="radio"
                    name="scorer"
                    id="player1"
                    value="Амир Шарифуллин"
                >

                <label for="player1">

                    <div class="player-number">
                        #26
                    </div>

                    <div class="player-name">
                        Амир Шарифуллин
                    </div>

                </label>

            </div>


            <div class="player-option">

                <input
                    type="radio"
                    name="scorer"
                    id="player2"
                    value="Саид Хузин"
                >

                <label for="player2">

                    <div class="player-number">
                        #5
                    </div>

                    <div class="player-name">
                        Саид Хузин
                    </div>

                </label>

            </div>


            <div class="player-option">

                <input
                    type="radio"
                    name="scorer"
                    id="player3"
                    value="Данис Шарифуллин"
                >

                <label for="player3">

                    <div class="player-number">
                        #11
                    </div>

                    <div class="player-name">
                        Данис Шарифуллин
                    </div>

                </label>

            </div>


            <div class="player-option">

                <input
                    type="radio"
                    name="scorer"
                    id="player4"
                    value="Другой игрок"
                >

                <label for="player4">

                    <div class="player-number">
                        —
                    </div>

                    <div class="player-name">
                        Другой игрок
                    </div>

                </label>

            </div>

        </div>

    </div>


    <!-- ОТПРАВКА -->

    <button class="submit" id="submitPrediction">
        ОТПРАВИТЬ ПРОГНОЗ
    </button>


    <!-- УСПЕШНАЯ ОТПРАВКА -->

    <div class="success" id="success">

        <div class="success-title">
            ✅ Прогноз принят!
        </div>

        <div class="success-text" id="successText">
            Твой прогноз сохранён.
        </div>

    </div>

</div>


<script>

/* =========================================
   НАСТРОЙКИ МАТЧА
========================================= */

const MATCH = {

    opponent: "СОПЕРНИК"

};


/* =========================================
   ПОДСТАВЛЯЕМ СОПЕРНИКА
========================================= */

document.getElementById("opponentName").textContent =
    MATCH.opponent;


/* =========================================
   ОТПРАВКА ПРОГНОЗА
========================================= */

document
    .getElementById("submitPrediction")
    .addEventListener("click", function () {


        /* Победитель */

        const winner =
            document.querySelector(
                'input[name="winner"]:checked'
            );


        /* Счёт */

        const homeScore =
            document.getElementById("homeScore").value;

        const awayScore =
            document.getElementById("awayScore").value;


        /* Бомбардир */

        const scorer =
            document.querySelector(
                'input[name="scorer"]:checked'
            );


        /* Проверка */

        if (!winner) {

            alert("Выбери победителя!");

            return;

        }


        if (
            homeScore === "" ||
            awayScore === ""
        ) {

            alert("Укажи счёт матча!");

            return;

        }


        if (!scorer) {

            alert("Выбери игрока, который забьёт первым!");

            return;

        }


        /* Проверяем соответствие победителя и счёта */

        const h =
            Number(homeScore);

        const a =
            Number(awayScore);


        if (h === a) {

            alert(
                "При равном счёте выбери победителя по буллитам или укажи другой счёт."
            );

            return;

        }


        if (
            winner.value === "Челны 2011" &&
            h <= a
        ) {

            alert(
                "Если выигрывают «Челны 2011», их счёт должен быть больше."
            );

            return;

        }


        if (
            winner.value === "Соперник" &&
            a <= h
        ) {

            alert(
                "Если выигрывает соперник, его счёт должен быть больше."
            );

            return;

        }


        /* УСПЕШНАЯ ОТПРАВКА */

        document.getElementById("successText").textContent =
            "Твой прогноз: " +
            winner.value +
            " — " +
            h +
            ":" +
            a +
            ". Первый гол — " +
            scorer.value +
            ".";


        document
            .getElementById("success")
            .classList.add("show");


        /* Прокрутка к результату */

        document
            .getElementById("success")
            .scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

    });

</script>

</body>
</html>
