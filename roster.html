<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000056"
    >

    <title>Состав — ХК Челны 2011</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="index.html"
                class="header-back"
                aria-label="На главную"
            >
                ‹
            </a>

            <img
                id="siteLogo"
                class="header-logo"
                src=""
                alt="ХК Челны 2011"
            >

            <div class="header-brand">

                <div
                    id="siteTitle"
                    class="header-brand-title"
                >
                    ХК Челны 2011
                </div>

                <div
                    id="siteSubtitle"
                    class="header-brand-subtitle"
                >
                    Набережные Челны
                </div>

            </div>

            <div class="header-spacer"></div>

        </div>

    </header>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <main class="container">

        <section class="section">

            <div class="section-header">

                <div>

                    <h1 class="section-title">
                        Состав
                    </h1>

                    <div class="section-subtitle">
                        ХК Челны 2011
                    </div>

                </div>

            </div>


            <!-- =================================================
                 POSITION FILTER
            ================================================== -->

            <div
                id="rosterTabs"
                class="tabs roster-tabs"
            >

                <button
                    type="button"
                    class="tab-button active"
                    data-position="all"
                >
                    Все
                </button>

                <button
                    type="button"
                    class="tab-button"
                    data-position="goalie"
                >
                    Вратари
                </button>

                <button
                    type="button"
                    class="tab-button"
                    data-position="defense"
                >
                    Защитники
                </button>

                <button
                    type="button"
                    class="tab-button"
                    data-position="forward"
                >
                    Нападающие
                </button>

            </div>


            <!-- =================================================
                 GOALIES
            ================================================== -->

            <section
                id="goaliesSection"
                class="roster-group"
            >

                <div class="roster-group-header">

                    <h2 class="roster-group-title">
                        Вратари
                    </h2>

                    <span
                        id="goaliesCount"
                        class="roster-group-count"
                    >
                        0
                    </span>

                </div>


                <div
                    id="goaliesGrid"
                    class="players-grid"
                ></div>

            </section>


            <!-- =================================================
                 DEFENSE
            ================================================== -->

            <section
                id="defenseSection"
                class="roster-group"
            >

                <div class="roster-group-header">

                    <h2 class="roster-group-title">
                        Защитники
                    </h2>

                    <span
                        id="defenseCount"
                        class="roster-group-count"
                    >
                        0
                    </span>

                </div>


                <div
                    id="defenseGrid"
                    class="players-grid"
                ></div>

            </section>


            <!-- =================================================
                 FORWARDS
            ================================================== -->

            <section
                id="forwardsSection"
                class="roster-group"
            >

                <div class="roster-group-header">

                    <h2 class="roster-group-title">
                        Нападающие
                    </h2>

                    <span
                        id="forwardsCount"
                        class="roster-group-count"
                    >
                        0
                    </span>

                </div>


                <div
                    id="forwardsGrid"
                    class="players-grid"
                ></div>

            </section>


            <!-- =================================================
                 EMPTY STATE
            ================================================== -->

            <div
                id="rosterEmpty"
                class="empty-state hidden"
            >

                <div class="empty-state-icon">
                    🏒
                </div>

                <div class="empty-state-title">
                    Игроков пока нет
                </div>

                <div class="empty-state-text">
                    Состав появится здесь после добавления игроков
                    в административной панели.
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         PLAYER MODAL
    ====================================================== -->

    <div
        id="playerModal"
        class="modal hidden"
        aria-hidden="true"
    >

        <div
            class="modal-backdrop"
            data-close-player
        ></div>

        <div class="modal-dialog player-modal-dialog">

            <button
                type="button"
                class="modal-close"
                data-close-player
                aria-label="Закрыть"
            >
                ×
            </button>

            <div
                id="playerModalContent"
                class="modal-content"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         BOTTOM NAV
    ====================================================== -->

    <nav class="bottom-nav">

        <div class="bottom-nav-inner">

            <a
                href="index.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ⌂
                </span>

                <span>
                    Главная
                </span>
            </a>


            <a
                href="matches.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ⚔
                </span>

                <span>
                    Матчи
                </span>
            </a>


            <a
                href="roster.html"
                class="bottom-nav-item active"
            >
                <span class="bottom-nav-icon">
                    ◎
                </span>

                <span>
                    Состав
                </span>
            </a>


            <a
                href="standings.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ≡
                </span>

                <span>
                    Таблица
                </span>
            </a>


            <a
                href="news.html"
                class="bottom-nav-item"
            >
                <span class="bottom-nav-icon">
                    ◈
                </span>

                <span>
                    Новости
                </span>
            </a>

        </div>

    </nav>

</div>


<!-- =====================================================
     SCRIPTS
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="app.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        if (
            typeof initializeSite ===
            "function"
        ) {
            await initializeSite();
        }

        if (
            typeof initRosterPage ===
            "function"
        ) {
            await initRosterPage();
        }

    }
);

</script>

</body>
</html>
