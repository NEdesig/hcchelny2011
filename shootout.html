<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Серия буллитов — ХК Челны 2011</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #123d82 0%, #061735 55%, #030b1b 100%);

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.game {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

.back {
    display: inline-block;
    margin-bottom: 25px;

    color: white;
    text-decoration: none;

    font-size: 14px;
    font-weight: 700;

    opacity: .7;
}

.back:hover {
    opacity: 1;
}

.logo-title {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 3px;
    opacity: .6;
}

h1 {
    margin: 8px 0;

    font-size: clamp(32px, 7vw, 58px);
    font-weight: 1000;
}

.subtitle {
    margin: 0 0 30px;

    opacity: .7;
}


/* СЧЁТ */

.score {
    display: flex;
    justify-content: center;
    gap: 12px;

    margin-bottom: 25px;
}

.score-box {
    min-width: 120px;

    padding: 12px 20px;

    background: rgba(255,255,255,.08);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 15px;
}

.score-box span {
    display: block;

    font-size: 11px;
    font-weight: 800;

    opacity: .55;
}

.score-box strong {
    display: block;

    margin-top: 3px;

    font-size: 30px;
}


/* ВОРОТА */

.goal {
    width: min(680px, 100%);
    aspect-ratio: 3 / 2;

    margin: auto;

    padding: 10px;

    border: 8px solid #e5e8ed;

    border-radius: 8px 8px 20px 20px;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.06) 0,
            rgba(255,255,255,.06) 2px,
            transparent 2px,
            transparent 7px
        );

    box-shadow:
        0 25px 60px rgba(0,0,0,.4),
        inset 0 0 20px rgba(255,255,255,.15);
}


/* КЛЕТКИ */

.grid {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);

    gap: 4px;
}

.cell {
    position: relative;

    border: 0;
    border-radius: 3px;

    cursor: pointer;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    transition:
        transform .15s,
        background .15s,
        box-shadow .15s;
}

.cell:hover {
    transform: scale(.97);

    background:
        rgba(255,255,255,.2);
}

.cell:disabled {
    cursor: default;
}


/* ГОЛ */

.cell.goal {
    background:
        radial-gradient(
            circle,
            #fff36b 0%,
            #ffd000 35%,
            #e87500 100%
        );

    box-shadow:
        0 0 30px rgba(255,210,0,.9),
        inset 0 0 25px rgba(255,255,255,.5);

    animation: goal .45s ease;
}

@keyframes goal {
    0% {
        transform: scale(.7);
        opacity: .3;
    }

    60% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* СЕЙВ */

.cell.save {
    background:
        radial-gradient(
            circle,
            #304a78,
            #101e3d
        );

    animation: save .35s ease;
}

@keyframes save {
    0%,100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-7px);
    }

    75% {
        transform: translateX(7px);
    }
}


/* ШАЙБА */

.puck {
    margin: 18px auto;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    background:
        radial-gradient(circle at 35% 30%, #444, #050505 65%);

    border: 3px solid #777;

    box-shadow:
        0 8px 15px rgba(0,0,0,.5);

    transition:
        transform .45s cubic-bezier(.2,.8,.2,1);
}

.puck.shooting {
    transform:
        translateY(-140px)
        scale(.75);
}


/* РЕЗУЛЬТАТ */

.result {
    min-height: 42px;

    margin: 5px 0 15px;

    font-size: 25px;
    font-weight: 1000;
}

.result.goal-text {
    color: #ffd000;
}

.result.save-text {
    color: white;
}


/* КНОПКИ */

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button.action {
    border: 0;

    padding: 14px 25px;

    border-radius: 12px;

    background: white;
    color: #061735;

    font-size: 13px;
    font-weight: 900;

    cursor: pointer;

    transition: .15s;
}

button.action:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
}

button.action:active {
    transform: translateY(1px);
}

#reset {
    background: #123d82;
    color: white;
}


/* МОБИЛЬНЫЙ */

@media(max-width:600px) {

    body {
        padding: 14px;
    }

    .goal {
        border-width: 5px;
        padding: 6px;
    }

    .score-box {
        min-width: 100px;
    }

    .result {
        font-size: 21px;
    }

    .puck {
        width: 45px;
        height: 45px;
    }
}
</style>
</head>

<body>

<div class="game">

    <a href="index.html" class="back">
        ← Вернуться на сайт
    </a>

    <div class="logo-title">
        ХК ЧЕЛНЫ 2011
    </div>

    <h1>СЕРИЯ БУЛЛИТОВ</h1>

    <p class="subtitle">
        Выбери угол и попробуй переиграть вратаря
    </p>


    <!-- СЧЁТ -->

    <div class="score">

        <div class="score-box">
            <span>БРОСКИ</span>
            <strong id="shots">0</strong>
        </div>

        <div class="score-box">
            <span>ГОЛЫ</span>
            <strong id="goals">0</strong>
        </div>

        <div class="score-box">
            <span>РЕАЛИЗАЦИЯ</span>
            <strong id="percent">0%</strong>
        </div>

    </div>


    <!-- ВОРОТА -->

    <div class="goal">

        <div class="grid">

            <button class="cell" data-cell="0"></button>
            <button class="cell" data-cell="1"></button>
            <button class="cell" data-cell="2"></button>

            <button class="cell" data-cell="3"></button>
            <button class="cell" data-cell="4"></button>
            <button class="cell" data-cell="5"></button>

            <button class="cell" data-cell="6"></button>
            <button class="cell" data-cell="7"></button>
            <button class="cell" data-cell="8"></button>

        </div>

    </div>


    <!-- ШАЙБА -->

    <div class="puck" id="puck"></div>


    <!-- РЕЗУЛЬТАТ -->

    <div class="result" id="result">
        ВЫБЕРИ УГОЛ
    </div>


    <!-- КНОПКИ -->

    <div class="buttons">

        <button class="action" id="newShot">
            НОВЫЙ БРОСОК
        </button>

        <button class="action" id="reset">
            СБРОСИТЬ СЧЁТ
        </button>

    </div>

</div>


<script>

const cells =
    document.querySelectorAll(".cell");

const result =
    document.getElementById("result");

const puck =
    document.getElementById("puck");

const shotsElement =
    document.getElementById("shots");

const goalsElement =
    document.getElementById("goals");

const percentElement =
    document.getElementById("percent");

const newShotButton =
    document.getElementById("newShot");

const resetButton =
    document.getElementById("reset");


let goalCells = [];

let shots = 0;

let goals = 0;

let shooting = false;


/* =========================================
   ВЫБИРАЕМ 3 ГОЛЕВЫЕ КЛЕТКИ
========================================= */

function generateGoalCells() {

    const result = [];

    while (result.length < 3) {

        const random =
            Math.floor(Math.random() * 9);

        if (!result.includes(random)) {

            result.push(random);

        }
    }

    goalCells = result;
}


/* =========================================
   ОБНОВЛЕНИЕ СТАТИСТИКИ
========================================= */

function updateStats() {

    shotsElement.textContent = shots;

    goalsElement.textContent = goals;

    const percent =
        shots === 0
            ? 0
            : Math.round((goals / shots) * 100);

    percentElement.textContent =
        percent + "%";
}


/* =========================================
   НОВЫЙ БРОСОК
========================================= */

function newShot() {

    shooting = false;

    cells.forEach(cell => {

        cell.disabled = false;

        cell.classList.remove("goal");
        cell.classList.remove("save");

    });

    puck.classList.remove("shooting");

    result.textContent =
        "ВЫБЕРИ УГОЛ";

    result.className =
        "result";

    generateGoalCells();
}


/* =========================================
   БРОСОК
========================================= */

function shoot(cell) {

    if (shooting) {
        return;
    }

    shooting = true;

    shots++;

    updateStats();

    cells.forEach(item => {

        item.disabled = true;

    });

    puck.classList.add("shooting");


    const selectedCell =
        Number(cell.dataset.cell);


    setTimeout(() => {

        if (goalCells.includes(selectedCell)) {

            /* ГОЛ */

            cell.classList.add("goal");

            goals++;

            result.textContent =
                "ГООООООЛ! 🏒";

            result.className =
                "result goal-text";

        } else {

            /* СЕЙВ */

            cell.classList.add("save");

            result.textContent =
                "СЕЙВ! 🧤";

            result.className =
                "result save-text";
        }

        updateStats();

    }, 350);


    /* Автоматически разрешаем следующий бросок */

    setTimeout(() => {

        newShot();

    }, 1300);

}


/* =========================================
   КЛЕТКИ
========================================= */

cells.forEach(cell => {

    cell.addEventListener("click", () => {

        shoot(cell);

    });

});


/* =========================================
   НОВЫЙ БРОСОК
========================================= */

newShotButton.addEventListener("click", () => {

    newShot();

});


/* =========================================
   СБРОС
========================================= */

resetButton.addEventListener("click", () => {

    shots = 0;

    goals = 0;

    updateStats();

    newShot();

});


/* =========================================
   ЗАПУСК
========================================= */

newShot();

</script>

</body>
</html>
