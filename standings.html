<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Таблица — ХК Челны 2011</title>

<link id="favicon"
rel="icon"
href="logo.svg">

<style>

:root{
--primary:#000056;
--secondary:#0875dc;
--bg:#050b22;
--card:#0d1738;
--text:#fff;
--muted:#aab5d5;
--button:#ffcd00;
--border:#26345f;
--radius:16px;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
padding:18px;
background:linear-gradient(
135deg,
var(--primary),
var(--secondary)
);
border-radius:0 0 25px 25px;
}

.header{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:55px;
height:55px;
background:white;
border-radius:50%;
object-fit:contain;
}

.club{
font-size:20px;
font-weight:900;
}

.season{
font-size:12px;
opacity:.7;
}

main{
padding:18px 12px 100px;
max-width:900px;
margin:auto;
}

.label{
font-size:11px;
color:var(--muted);
letter-spacing:1.5px;
}

h1{
font-size:30px;
margin:8px 0 18px;
}

.table-wrap{
overflow-x:auto;
background:var(--card);
border:1px solid var(--border);
border-radius:var(--radius);
}

table{
border-collapse:collapse;
width:100%;
min-width:650px;
}

th,td{
padding:12px 8px;
border-bottom:1px solid var(--border);
text-align:center;
font-size:12px;
}

th{
font-size:10px;
color:var(--muted);
}

td:nth-child(2){
text-align:left;
font-weight:800;
}

.team-cell{
display:flex;
align-items:center;
gap:9px;
}

.team-logo{
width:32px;
height:32px;
object-fit:contain;
flex-shrink:0;
}

.team-info{
display:flex;
flex-direction:column;
gap:2px;
}

.team-name{
font-weight:800;
line-height:1.1;
}

.team-city{
font-size:10px;
font-weight:400;
color:var(--muted);
}

.points{
font-weight:900;
font-size:15px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
background:var(--card);
border-top:1px solid var(--border);
display:flex;
justify-content:space-around;
align-items:center;
}

.bottom a{
color:var(--muted);
text-decoration:none;
font-size:10px;
text-align:center;
}

.bottom a.active{
color:var(--button);
font-weight:800;
}

.icon{
display:block;
font-size:21px;
margin-bottom:4px;
}

</style>

</head>

<body>

<header>

<div class="header">

<img id="logo"
class="logo"
src="logo.svg">

<div>

<div id="siteName"
class="club">
ХК ЧЕЛНЫ 2011
</div>

<div class="season">
СЕЗОН 2026/27
</div>

</div>

</div>

</header>

<main>

<div class="label">
ПФО · СЕЗОН 2026/27
</div>

<h1>Таблица</h1>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>#</th>
<th>КОМАНДА</th>
<th>И</th>
<th>В</th>
<th>ВО</th>
<th>П</th>
<th>ПО</th>
<th>ЗШ</th>
<th>ЗП</th>
<th>О</th>

</tr>

</thead>

<tbody id="standings">

<tr>

<td colspan="10">
Загрузка...
</td>

</tr>

</tbody>

</table>

</div>

</main>

<nav class="bottom">

<a href="index.html">
<span class="icon">⌂</span>
Главная
</a>

<a href="matches.html">
<span class="icon">🏒</span>
Матчи
</a>

<a href="roster.html">
<span class="icon">👥</span>
Состав
</a>

<a class="active" href="standings.html">
<span class="icon">📊</span>
Таблица
</a>

<a href="news.html">
<span class="icon">📰</span>
Новости
</a>

</nav>

<script>

const SUPABASE_URL=
"https://jxlbojosxaaqnyuzohnw.supabase.co";

const SUPABASE_KEY=
"sb_publishable_wNNvPktjjKpz3csoDMo3JA_4duyLAzL";

const headers={
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
};

async function getData(table,query=""){

const r=await fetch(
SUPABASE_URL+
"/rest/v1/"+
table+
"?select=*"+
query,
{headers}
);

return await r.json();

}

function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}

async function settings(){

const a=
await getData("settings","&limit=1");

if(!a.length)return;

const s=a[0];

const r=document.documentElement.style;

if(s.primary_color)
r.setProperty("--primary",s.primary_color);

if(s.secondary_color)
r.setProperty("--secondary",s.secondary_color);

if(s.background_color)
r.setProperty("--bg",s.background_color);

if(s.card_color)
r.setProperty("--card",s.card_color);

if(s.text_color)
r.setProperty("--text",s.text_color);

if(s.muted_text_color)
r.setProperty("--muted",s.muted_text_color);

if(s.button_color)
r.setProperty("--button",s.button_color);

if(s.border_color)
r.setProperty("--border",s.border_color);

if(s.border_radius)
r.setProperty("--radius",s.border_radius+"px");

if(s.site_name){

document.title=
s.site_name+" — Таблица";

document.getElementById(
"siteName"
).textContent=s.site_name;

}

if(s.logo_url)
document.getElementById("logo").src=
s.logo_url;

if(s.favicon_url)
document.getElementById("favicon").href=
s.favicon_url;

if(s.background_image)
document.body.style.backgroundImage=
`url("${s.background_image}")`;

}


/* =========================
   РЕЕСТР КОМАНД
========================= */

let teams=[];

let teamsMap=new Map();

async function loadTeams(){

try{

const data=await getData(
"teams",
"&order=name.asc"
);

if(!Array.isArray(data)){

teams=[];
teamsMap=new Map();

return;

}

teams=data;

teamsMap=new Map(
teams.map(team=>[
String(team.id),
team
])
);

}catch(error){

console.log("Реестр команд пока недоступен");

teams=[];
teamsMap=new Map();

}

}

function getTeam(id){

if(
id===null ||
id===undefined ||
id===""
){

return null;

}

return teamsMap.get(String(id))||null;

}

function findTeamByName(name){

if(!name)return null;

const search=String(name)
.trim()
.toLowerCase();

return teams.find(team=>
String(team.name||"")
.trim()
.toLowerCase()===search
)||null;

}


/* =========================
   ТАБЛИЦА
========================= */

function teamHTML(t){

const team=getTeam(t.team_id);

const name=
team?.name ||
t.team ||
"Команда";

const city=
team?.city ||
"";

const logo=
team?.logo_url ||
"";

return `

<div class="team-cell">

${
logo
? `<img
class="team-logo"
src="${esc(logo)}"
alt="">`
: ""
}

<div class="team-info">

<div class="team-name">
${esc(name)}
</div>

${
city
? `<div class="team-city">
${esc(city)}
</div>`
: ""
}

</div>

</div>

`;

}

async function load(){

const data=
await getData(
"standings",
"&order=position.asc"
);

const box=
document.getElementById("standings");

if(!data.length){

box.innerHTML=
'<tr><td colspan="10">Таблица пока не заполнена</td></tr>';

return;

}

box.innerHTML=data.map(t=>`

<tr>

<td>
${esc(t.position)}
</td>

<td>
${teamHTML(t)}
</td>

<td>
${esc(t.games||0)}
</td>

<td>
${esc(t.wins||0)}
</td>

<td>
${esc(t.overtime_wins||0)}
</td>

<td>
${esc(t.losses||0)}
</td>

<td>
${esc(t.overtime_losses||0)}
</td>

<td>
${esc(t.goals_for||0)}
</td>

<td>
${esc(t.goals_against||0)}
</td>

<td class="points">
${esc(t.points||0)}
</td>

</tr>

`).join("");

}


async function init(){

await settings();

await loadTeams();

await load();

}

init();

</script>

</body>
</html>
